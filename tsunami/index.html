<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>この美しいまちに住む、あなたへ ―南海トラフ地震</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6ec;--card:#ffffff;--ink:#3a3330;--mute:#7d736d;--line:#eadfd2;--acc:#ff6b5b;--acc2:#ffa94d;--teal:#25b0a0;--blue:#4c8fe0;--sea:#2a8fc0;--good:#3fb57a;--ok:#f0a92e;--bad:#ff6b5b;--fz:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic UI','Meiryo',system-ui,sans-serif;font-size:16px;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
ruby rt{font-size:.5em;font-weight:500;opacity:.85}
body.nofuri rt{display:none}
.screen{display:none;min-height:100dvh;flex-direction:column;max-width:760px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
.screen.on{display:flex}
h1,h2,h3{margin:0;font-weight:800}
.btn{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:13px 16px;font-size:calc(15.5px*var(--fz));text-align:left;width:100%;line-height:1.75;box-shadow:0 3px 0 var(--line)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--acc);border-color:#e85445;color:#fff;text-align:center;font-weight:800;box-shadow:0 4px 0 #d94436}
.btn.sea{background:var(--sea);border-color:#1f7aa8;color:#fff;text-align:center;font-weight:800;box-shadow:0 4px 0 #1b6b93}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;text-align:center;color:var(--mute)}
.mute{color:var(--mute)} .small{font-size:calc(13px*var(--fz))}
/* ---- title ---- */
#title{justify-content:center;gap:14px}
#title .logo{background:linear-gradient(160deg,#2f9ed1,#3cc0b0 60%,#ffb35c);color:#fff;border-radius:28px;padding:24px 22px 18px;box-shadow:0 8px 0 #1f7aa8;position:relative;overflow:hidden}
#title .kicker{font-size:12px;letter-spacing:.18em;font-weight:800;opacity:.92}
#title h1{font-size:clamp(27px,7.4vw,38px);line-height:1.4;margin-top:8px}
#title h1 small{display:block;font-size:.62em;margin-top:6px;letter-spacing:.06em}
#title .lead{font-size:calc(15px*var(--fz));line-height:1.95;margin-top:10px}
.seaw{width:100%;height:36px;margin-top:6px;display:block}
.seaw path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;opacity:.85}
.seaw .w1{animation:sw 4s ease-in-out infinite}.seaw .w2{animation:sw 5.5s ease-in-out infinite reverse;opacity:.5}
@keyframes sw{50%{transform:translateX(-18px)}}
.settings{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.set-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:calc(14px*var(--fz))}
.set-row .lbl{min-width:6.5em;font-weight:700}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 12px;font-size:calc(14px*var(--fz));font-weight:700;color:var(--mute)}
.seg button.on{background:var(--sea);color:#fff}
.disc{font-size:calc(12px*var(--fz));color:var(--mute);line-height:1.75;border-top:2px solid var(--line);padding-top:12px}
.note{background:#fff8e6;border:2px solid #f4dfb0;border-radius:14px;padding:10px 12px;font-size:calc(13px*var(--fz));line-height:1.75;color:#7a5a20}
/* ---- menu ---- */
#menu{gap:12px}
.stagehead{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.stagehead h3{font-size:calc(18px*var(--fz))}
.stagehead span{font-size:calc(12.5px*var(--fz));color:var(--mute)}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.case{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:0;text-align:left;overflow:hidden;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column}
.case:active{transform:translateY(2px)}
.case[disabled]{opacity:.62;cursor:default}
.case .thumb{height:96px;display:block;width:100%}
.case .body{padding:10px 12px 12px}
.case .no{font-size:11px;color:var(--sea);font-weight:800;letter-spacing:.08em}
.case h3{font-size:calc(17px*var(--fz));margin:2px 0 4px;line-height:1.5}
.case p{margin:0;font-size:calc(13px*var(--fz));line-height:1.7;color:#5f5650}
.stars{color:#e8a317;letter-spacing:1px;font-size:13px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;border-radius:99px;padding:2px 8px;background:#f4ece2;color:#7a6c60;font-weight:700}
.tag.x{background:#e2f2fb;color:#1f6f99}
.tag.wip{background:#eee;color:#888}
.badge{float:right;font-weight:800;font-size:20px;line-height:1}
.badge.S{color:#e7b416}.badge.A{color:var(--good)}.badge.B{color:var(--blue)}.badge.C{color:var(--mute)}.badge.X{color:#3a3330;font-size:14px}
/* ---- play ---- */
#play{padding:0;max-width:760px;height:100dvh;min-height:0;overflow:hidden;position:relative;user-select:none;-webkit-user-select:none;transition:background .8s}
.stage{position:relative;flex:none;height:calc(min(62.5vw,475px,50vh) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);overflow:hidden;background:#cfe6f5}
.stage svg.sc{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage svg.sc{top:env(safe-area-inset-top)!important;height:calc(100% - env(safe-area-inset-top))!important}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(10px + env(safe-area-inset-top)) 12px 0;z-index:6;pointer-events:none}
.pill{background:#ffffffe6;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:700;box-shadow:0 2px 6px #0001;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill b{color:var(--sea)}
.clock{background:#ffffffe6;border-radius:14px;padding:4px 10px;text-align:right;box-shadow:0 2px 6px #0001;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1;transition:background .8s,color .8s}
.clock small{display:block;font-size:10px;color:var(--mute);font-weight:700}
.clock.tick{animation:tick .6s}
.clock.el{background:#2b3440e8;color:#fff}.clock.el small{color:#ffcf9a}
@keyframes tick{0%{transform:scale(1.15)}100%{transform:none}}
.topbtns{position:absolute;top:calc(56px + env(safe-area-inset-top));right:12px;z-index:7;display:flex;gap:6px}
.topbtns button{background:#ffffffd0;border:none;border-radius:99px;width:36px;height:36px;font-size:15px;box-shadow:0 2px 6px #0001}
/* FX overlays */
.fxl{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .8s}
#fxRed{background:radial-gradient(ellipse at center,transparent 45%,#ff3b2f66 100%);animation:pulse 1.6s infinite}
@keyframes pulse{50%{filter:brightness(1.4)}}
#fxSmoke{background:linear-gradient(0deg,#7d7d7d00,#6d6a6acc 70%)}
#fxSmoke:before,#fxSmoke:after{content:'';position:absolute;left:-20%;right:-20%;height:60%;top:10%;background:radial-gradient(circle at 30% 50%,#8888 0,transparent 40%),radial-gradient(circle at 70% 40%,#7779 0,transparent 45%);animation:drift 6s linear infinite alternate}
#fxSmoke:after{top:30%;animation-duration:9s;animation-direction:reverse}
@keyframes drift{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
#fxDust{background:linear-gradient(0deg,#c9b79a99,#d8cbb455 60%,transparent)}
#fxDim{background:#10141cc4}
#fxNight{background:#14224fa0}
#fxDusk{background:linear-gradient(180deg,#2c3a4fb0,#55607066)}
#fxSiren{background:linear-gradient(90deg,#ff3b3b55,transparent 40%,transparent 60%,#3b6bff55);animation:siren .7s steps(2) infinite}
@keyframes siren{50%{background:linear-gradient(90deg,#3b6bff55,transparent 40%,transparent 60%,#ff3b3b55)}}
#fxFlash{background:#fff}
#fxBlack{background:#000;transition:opacity 1.6s}
.fxl.on{opacity:1}
.stage.shake{animation:shake .45s}
.stage.quake{animation:shake .3s 6}
.stage.bigquake{animation:bigq 2.4s infinite}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-2px)}}
@keyframes bigq{0%{transform:none}5%{transform:translate(-9px,3px) rotate(-.6deg)}10%{transform:translate(8px,-4px)}15%{transform:translate(-7px,4px) rotate(.5deg)}20%{transform:translate(9px,-2px)}25%{transform:translate(-5px,3px)}30%{transform:translate(4px,-2px)}38%{transform:translate(-3px,1px)}46%{transform:translate(3px,-1px)}55%{transform:translate(-8px,3px) rotate(-.5deg)}60%{transform:translate(10px,-4px)}65%{transform:translate(-9px,4px) rotate(.6deg)}70%{transform:translate(7px,-3px)}78%{transform:translate(-4px,2px)}86%{transform:translate(3px,-2px)}100%{transform:none}}
/* actors */
.actor{transition:opacity .5s}
.actor .bd{transform-box:fill-box;transform-origin:50% 100%;transition:transform .7s cubic-bezier(.5,1.6,.6,1)}
.actor.idle .bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-1.5px) scaleY(1.01)}}
.actor[data-p="sit"] .bd{transform:translateY(14%) scaleY(.82)}
.actor[data-p="slump"] .bd{transform:translateY(14%) scaleY(.8) rotate(-9deg)}
.actor[data-p="crouch"] .bd{transform:scaleY(.68) rotate(6deg)}
.actor[data-p="duck"] .bd{transform:translateY(6%) scaleY(.6)}
.actor[data-p="down"] .bd{transform:rotate(-88deg) translateX(-8%)}
.actor[data-p="downr"] .bd{transform:rotate(88deg) translateX(8%)}
.actor[data-p="lean"] .bd{transform:rotate(-8deg)}
.actor[data-p="run"] .bd{transform:rotate(-10deg)}
.actor[data-p="run"] .bob{animation:runb .35s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes runb{50%{transform:translateY(-3px)}}
.actor .arm{transform-box:fill-box;transform-origin:50% 8%;transition:transform .5s}
.actor[data-arm="neck"] .arm.l{transform:rotate(150deg) translate(0,-2px)}
.actor[data-arm="neck"] .arm.r{transform:rotate(-150deg) translate(0,-2px)}
.actor[data-arm="head"] .arm.l{transform:rotate(160deg)} .actor[data-arm="head"] .arm.r{transform:rotate(-160deg)}
.actor[data-arm="chest"] .arm.r{transform:rotate(-125deg)}
.actor[data-arm="point"] .arm.r{transform:rotate(-100deg)}
.actor[data-arm="up"] .arm.l{transform:rotate(165deg)} .actor[data-arm="up"] .arm.r{transform:rotate(-165deg)}
.actor[data-arm="wave"] .arm.r{animation:wave .6s infinite alternate}
@keyframes wave{from{transform:rotate(-150deg)}to{transform:rotate(-175deg)}}
.actor .fc{display:none}
.actor[data-f="normal"] .fc.normal,.actor[data-f="smile"] .fc.smile,.actor[data-f="pain"] .fc.pain,.actor[data-f="weak"] .fc.weak,.actor[data-f="closed"] .fc.closed,.actor[data-f="shock"] .fc.shock,.actor[data-f="droop"] .fc.droop,.actor[data-f="cry"] .fc.cry{display:inline}
.actor .tint{opacity:0;transition:opacity .8s}
.actor[data-t="pale"] .tint{opacity:.55;fill:#e6eef2}
.emote{animation:pop .35s cubic-bezier(.4,2,.6,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.emote{transform-box:fill-box;transform-origin:50% 100%}
.wave{animation:wv 3s ease-in-out infinite}
@keyframes wv{50%{transform:translateX(-12px)}}
.surge{animation:surge 9s ease-in forwards}
@keyframes surge{from{transform:translateX(0)}to{transform:translateX(-260px)}}
.flood{transition:transform 4s ease-out}
.rain line{animation:fall .6s linear infinite}
@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(270px)}}
/* dialog box */
.box{position:relative;flex:1 1 auto;overflow:visible;background:var(--card);border-top:3px solid #bfe3f2;padding:14px 18px calc(16px + env(safe-area-inset-bottom));min-height:150px;cursor:pointer;z-index:5;transition:background .8s,color .8s,border-color .8s}
.name{position:absolute;top:-17px;left:16px;background:var(--sea);color:#fff;border-radius:99px;padding:3px 14px;font-weight:800;font-size:calc(14px*var(--fz));box-shadow:0 3px 0 #1b6b93;z-index:6}
.name.voice{background:var(--blue);box-shadow:0 3px 0 #3a73b8}
.name.sys{background:var(--acc2);box-shadow:0 3px 0 #e0892a}
.name.radio{background:#5a5f66;box-shadow:0 3px 0 #3a3e44}
.name.me{background:var(--acc);box-shadow:0 3px 0 #d94436}
.txt{font-size:calc(17.5px*var(--fz));line-height:1.95;min-height:3.6em;white-space:pre-wrap;max-height:calc(100dvh - min(62.5vw,475px,50vh) - 90px);overflow:auto}
body:not(.nofuri) .txt{line-height:2.15}
.txt.narr{color:#4e4540}
.txt.sys{font-size:calc(14.5px*var(--fz));color:#a2622a}
.txt.radio{letter-spacing:.06em;color:#4a4f56;animation:flick 2.2s infinite}
.txt.radio .echo{opacity:.38;filter:blur(.4px)}
@keyframes flick{0%,100%{opacity:1}47%{opacity:1}50%{opacity:.55}53%{opacity:1}80%{opacity:.8}}
.txt .hid{color:#9aa3ad;letter-spacing:.05em}
.txt .gb{display:inline-block;filter:blur(.6px);transform:skewX(-8deg);color:#8a8f96}
.next{position:absolute;right:16px;bottom:calc(10px + env(safe-area-inset-bottom));color:var(--sea);font-size:14px;animation:nb 1s infinite}
@keyframes nb{50%{transform:translateY(3px)}}
/* modes */
#play.m-tense{background:#18202a}
#play.m-tense .box{background:#222c38;color:#eef3f7;border-top-color:#ff6b5b}
#play.m-tense .txt.narr{color:#dfe6ec}
#play.m-tense .txt.radio{color:#cfd6dd}
#play.m-tense .next{color:#ffb4a8}
#play.m-night{background:#121a33}
#play.m-night .box{background:#1d2747;color:#e9edf8;border-top-color:#8fa6ff}
#play.m-night .txt.narr{color:#d9def0}
#play.m-night .next{color:#b5c3ff}
/* choice sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;top:calc(min(62.5vw,475px,50vh) + env(safe-area-inset-top));overflow:auto;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -6px 20px #0002;padding:14px 14px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.3,1.2,.5,1);z-index:8}
.sheet.on{transform:none}
.sheet .q{font-weight:800;font-size:calc(17px*var(--fz));margin:2px 4px 10px;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 2px 10px}
.chip{background:#eef6ff;color:#2d5f9a;border-radius:10px;padding:4px 9px;font-size:calc(12.5px*var(--fz));line-height:1.6}
.chip b{color:#6a8bb3;font-weight:700;margin-right:4px}
.choices{display:flex;flex-direction:column;gap:9px}
.timer{height:8px;background:#f2e8de;border-radius:99px;overflow:hidden;margin:0 2px 10px;display:none}
.timer.on{display:block}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:100%}
/* cpr */
.cpr{display:flex;flex-direction:column;align-items:center;gap:10px}
.pad{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#ffe1d9,#ffb4a3);border:5px solid var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#c23f30;touch-action:manipulation;position:relative;transition:transform .06s}
.pad.hit{transform:scale(.92)}
.pad .guide{position:absolute;inset:-14px;border-radius:50%;border:3px solid #ff6b5b88;opacity:0}
.pad .guide.go{animation:beat .545s infinite}
@keyframes beat{0%{opacity:1;transform:scale(1)}70%{opacity:0;transform:scale(1.15)}100%{opacity:0}}
.bpm{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums}
.bpm.in{color:var(--good)}.bpm.out{color:var(--ok)}
.meter{width:100%;max-width:320px;height:12px;background:#f2e8de;border-radius:99px;position:relative;overflow:hidden}
.meter .band{position:absolute;top:0;bottom:0;background:#bfe9cf}
.meter .needle{position:absolute;top:-2px;bottom:-2px;width:5px;background:var(--ink);border-radius:3px;transition:left .15s}
/* result / debrief */
#out,#deb,#src,#msg{gap:14px}
.res-card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 5px 0 var(--line)}
.grade{font-size:72px;font-weight:800;line-height:1}
.grade.S{color:#e7b416}.grade.A{color:var(--good)}.grade.B{color:var(--blue)}.grade.C{color:var(--mute)}.grade.X{color:#3a3330;font-size:46px}
.lesson{background:#eef8fc;border:2px solid #cfe8f3;border-radius:16px;padding:12px 14px;font-size:calc(14.5px*var(--fz));line-height:1.85}
.lesson h4{margin:0 0 4px;font-size:calc(14px*var(--fz));color:#1f6f99}
.lesson ul{margin:0;padding-left:1.2em}
.lesson .src{font-size:calc(12px*var(--fz));color:var(--mute);margin-top:6px}
.rv{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:calc(14px*var(--fz));line-height:1.8}
.rv .h{display:flex;gap:10px;align-items:flex-start;font-weight:800;margin-bottom:4px}
.mk{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:800}
.mk.best{background:var(--good)}.mk.ok{background:var(--ok)}.mk.bad{background:var(--bad)}.mk.fatal{background:#3a3330}
.rv .you{color:var(--blue);font-weight:700}
.rv .bt{margin-top:8px;padding-top:8px;border-top:2px dashed var(--line);color:#2f7a52}
.sec{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;line-height:1.9;font-size:calc(15px*var(--fz))}
.sec h3{font-size:calc(16px*var(--fz));margin-bottom:6px;color:#1f6f99}
.sec ul{margin:0;padding-left:1.2em}
.sec p{margin:0 0 6px}
.sec a{color:#1f6f99;word-break:break-all}
.heard{display:flex;flex-direction:column;gap:8px}
.heard div{border-left:4px solid #cfe8f3;padding-left:10px}
.heard .s{color:var(--mute)}
details.deep{background:#eef5ff;border:2px solid #d3e3f7;border-radius:16px;padding:2px 16px;font-size:calc(14px*var(--fz));line-height:1.85}
details.deep summary{padding:10px 0;font-weight:800;color:#2d5f9a;cursor:pointer}
.row{display:flex;gap:10px}
.letter{background:#fffdf7;border:2px solid #eadfc6;border-radius:18px;padding:20px 18px;line-height:2.1;font-size:calc(16px*var(--fz));white-space:pre-wrap}
</style>
</head>
<body>

<section id="title" class="screen on">
  <div class="logo">
    <div class="kicker">四万十・幡多　防災ストーリーゲーム</div>
    <h1>この美しいまちに<br>住む、あなたへ<small>― 南海トラフ地震</small></h1>
    <svg class="seaw" viewBox="0 0 400 36" preserveAspectRatio="none"><path class="w1" d="M-40 18 q20 -12 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/><path class="w2" d="M-40 28 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/></svg>
    <div class="lead" id="titleLead"></div>
  </div>
  <div class="settings" id="settings"></div>
  <button class="btn primary" id="toMenu">はじめる</button>
  <div class="row"><button class="btn" id="toMsg" style="text-align:center">作者からのメッセージ</button><button class="btn" id="toSrc" style="text-align:center">出典・資料</button></div>
  <div class="disc" id="titleDisc"></div>
</section>

<section id="menu" class="screen">
  <div class="row" style="justify-content:space-between;align-items:center"><h2 style="font-size:24px">8人の物語</h2><button class="btn ghost small" id="menuBack" style="width:auto;padding:4px 8px">設定</button></div>
  <div class="small mute" style="line-height:1.8" id="menuLead"></div>
  <div id="stories"></div>
  <div class="disc" id="menuDisc"></div>
</section>

<section id="play" class="screen">
  <div class="stage" id="stage">
    <svg class="sc" id="sc" viewBox="0 0 400 250" preserveAspectRatio="xMidYMax slice"></svg>

<script>
'use strict';
const $ = id => document.getElementById(id);
/* =========================================================
   サウンド（The Magic City のBGM・効果音シンセを移植）
   ========================================================= */
let SOUND = true;
try{ SOUND = localStorage.getItem('tsu_snd')!=='0'; }catch(e){}
const AU = { ctx:null, master:null, bgm:null, sfx:null, song:null, timer:null, step:0, next:0, want:null };
function audioInit(){
  if(AU.ctx){ if(AU.ctx.state==='suspended') AU.ctx.resume(); return; }
  try{
    const C = new (window.AudioContext||window.webkitAudioContext)();
    AU.ctx=C; AU.master=C.createGain(); AU.master.connect(C.destination);
    AU.bgm=C.createGain(); AU.bgm.connect(AU.master); AU.sfx=C.createGain(); AU.sfx.connect(AU.master);
    AU.lp=C.createBiquadFilter(); AU.lp.type='lowpass'; AU.lp.frequency.value=2400; AU.lp.connect(AU.bgm);
    const n=C.createBuffer(1,C.sampleRate*.5,C.sampleRate); const d=n.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; AU.noise=n;
    vol();
    if(AU.want!==null){ const w=AU.want; AU.want=null; music(w); }
  }catch(e){ AU.ctx=null; }
}
function vol(){ if(!AU.ctx) return; AU.master.gain.value = SOUND?1:0; AU.bgm.gain.value=.16; AU.sfx.gain.value=.3; }
const mtof = m => 440*Math.pow(2,(m-69)/12);
function tone(t,f,dur,type='square',v=.2,dest,a=.005,r=.06){
  const C=AU.ctx; const o=C.createOscillator(), g=C.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+a); g.gain.setValueAtTime(v,t+Math.max(a,dur-r)); g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g); g.connect(dest||AU.sfx); o.start(t); o.stop(t+dur+.02); return o;
}
function noise(t,dur,v,freq=6000,dest){ const C=AU.ctx; const s=C.createBufferSource(); s.buffer=AU.noise; const f=C.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; const g=C.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); s.connect(f); f.connect(g); g.connect(dest||AU.sfx); s.start(t); s.stop(t+dur); }
function sfx(k){
  if(!AU.ctx||!SOUND) return; const t=AU.ctx.currentTime;
  switch(k){
    case 'cur': tone(t,1320,.04,'square',.06); break;
    case 'ok': tone(t,784,.06,'square',.1); tone(t+.06,1175,.09,'square',.1); break;
    case 'back': tone(t,523,.06,'square',.09); tone(t+.06,392,.08,'square',.08); break;
    case 'blip': tone(t,880+Math.random()*120,.025,'square',.03); break;
    case 'lvl': [0,4,7,12,16].forEach((s,i)=>tone(t+i*.08,mtof(72+s),.14,'square',.1)); break;
    case 'start': [0,7,12,19].forEach((s,i)=>tone(t+i*.11,mtof(60+s),.5,'triangle',.14,null,.01,.3)); break;
    case 'jingle': [[67,0],[72,.14],[76,.28],[79,.42],[84,.62]].forEach(([n,d])=>tone(t+d,mtof(n),.22,'square',.07)); break;
    case 'msg': tone(t,1568,.07,'sine',.1); tone(t+.09,2093,.1,'sine',.09); break;
    case 'ring': for(let k2=0;k2<2;k2++){ tone(t+k2*.5,440,.38,'sine',.12); tone(t+k2*.5,480,.38,'sine',.12);} break;
    case 'thud': noise(t,.25,.5,300); tone(t,110,.18,'sine',.3); break;
    case 'hit': noise(t,.06,.3,1200); tone(t,180,.07,'sine',.2); break;
    case 'quake': for(let i=0;i<10;i++) noise(t+i*.12,.3,.5,120+Math.random()*80); break;
    case 'beep': tone(t,1000,.12,'sine',.12); tone(t+.35,1000,.12,'sine',.12); break;
    case 'shock': noise(t,.35,.5,2500); tone(t,90,.3,'sawtooth',.2); break;
    case 'alarm': for(let i=0;i<8;i++) tone(t+i*.25,i%2?880:1100,.2,'square',.06); break;
    case 'wave': noise(t,1.6,.25,500); break;
    case 'rumble': noise(t,.7,.35,90+Math.random()*60); noise(t+.2,.5,.2,220); break;
    case 'roar': for(let i=0;i<6;i++) noise(t+i*.4,1.2,.3-i*.03,300+i*40); break;
    case 'crackle': for(let i=0;i<5;i++) noise(t+i*.07+Math.random()*.05,.05,.12,3000+Math.random()*2000); break;
    case 'chime': [[79,0],[76,.42],[72,.84],[67,1.26]].forEach(([n,d])=>{ tone(t+d,mtof(n),.9,'sine',.12,null,.01,.7); tone(t+d+.12,mtof(n),.7,'sine',.04,null,.01,.6); }); break;
    case 'mail': for(let i=0;i<6;i++){ tone(t+i*.36,1046,.16,'square',.07); tone(t+i*.36+.18,1318,.16,'square',.07);} break;
    case 'crash': noise(t,.5,.6,800); noise(t+.1,.4,.4,3000); tone(t,70,.3,'sine',.3); break;
    case 'glass': for(let i=0;i<7;i++) tone(t+i*.03,3000+Math.random()*2500,.08,'sine',.05); noise(t,.25,.25,5000); break;
    case 'drop': [76,72,67,60].forEach((n,i)=>tone(t+i*.16,mtof(n),.3,'triangle',.12)); break;
    case 'siren': { const o=AU.ctx.createOscillator(), g=AU.ctx.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(500,t); for(let i=0;i<4;i++){ o.frequency.linearRampToValueAtTime(900,t+i*1.6+.8); o.frequency.linearRampToValueAtTime(500,t+i*1.6+1.6);} g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.05,t+.8); g.gain.linearRampToValueAtTime(0,t+6.4); o.connect(g); g.connect(AU.sfx); o.start(t); o.stop(t+6.5); break; }
  }
}
const SONGS = {
  title:{bpm:76,ch:[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]],bass:[41,40,38,36],arp:1,hat:0},
  town:{bpm:100,ch:[[53,57,60,64],[57,60,64,67],[58,62,65,69],[55,60,64,70]],bass:[41,45,46,48],arp:1,hat:1},
  talk:{bpm:88,ch:[[48,52,55,59],[45,48,52,55],[50,53,57,60],[43,47,50,53]],bass:[36,33,38,31],arp:0,hat:0},
  night:{bpm:72,ch:[[57,60,64,67],[53,57,60,64],[50,53,57,60],[52,56,59,62]],bass:[45,41,38,40],arp:1,hat:0},
  tense:{bpm:118,ch:[[50,53,57,62],[46,50,53,58],[43,46,50,55],[45,49,52,57]],bass:[38,34,31,33],arp:1,hat:1,pulse:1},
  hope:{bpm:84,ch:[[48,52,55,60],[53,57,60,65],[55,59,62,67],[52,55,60,64]],bass:[36,41,43,40],arp:1,hat:0}
};
function music(name){
  if(!AU.ctx){ AU.want=name; return; }
  if(AU.song===name) return;
  AU.song=name; AU.step=0; AU.next=AU.ctx.currentTime+.1;
  clearInterval(AU.timer); if(!name) return;
  AU.timer=setInterval(schedule,60);
}
function schedule(){
  const C=AU.ctx, sg=SONGS[AU.song]; if(!sg||!C) return;
  const st=60/sg.bpm/2;
  while(AU.next<C.currentTime+.25){
    const t=AU.next, s=AU.step, bar=(s>>3)%4, ch=sg.ch[bar], b=s%8;
    if(b===0) ch.forEach(n=>tone(t,mtof(n),st*7.6,'sawtooth',.022,AU.lp,.25,.6));
    if(b===0||b===4||(sg.pulse&&b%2===0)) tone(t,mtof(sg.bass[bar]-(b===4&&!sg.pulse?-12:0)),st*(sg.pulse?1.6:3.4),'triangle',.16,AU.lp,.01,.1);
    if(sg.arp&&(b%2===1||sg.bpm>95)) tone(t,mtof(ch[(s*3)%4]+12),st*.9,'square',.022,AU.lp,.005,.05);
    if(sg.hat&&b%2===1) noise(t,.04,.05,8000,AU.lp);
    AU.next+=st*(b%2===0?1.08:.92); AU.step++;
  }
}
function setSound(on){ SOUND=on; try{localStorage.setItem('tsu_snd',on?'1':'0')}catch(e){} vol(); ['snd'].forEach(i=>{ if($(i)) $(i).textContent=on?'🔊':'🔇'; }); }
document.addEventListener('pointerdown',audioInit,{passive:true});

function hairBack(L,hy,r){

function hairFront(L,hy,r){

function emoteSvg(e,y){
  const bub=(c,inner)=>`<g class="emote"><path d="M-11 ${y-24} h22 a5 5 0 0 1 5 5 v10 a5 5 0 0 1 -5 5 h-7 l-4 5 l-4 -5 h-7 a5 5 0 0 1 -5 -5 v-10 a5 5 0 0 1 5 -5z" fill="#fff" stroke="${c}" stroke-width="2"/>${inner}</g>`;
  switch(e){
    case '!': return bub('#ff6b5b',`<text x="0" y="${y-9}" font-size="15" font-weight="800" fill="#ff6b5b" text-anchor="middle">！</text>`);
    case '?': return bub('#4c8fe0',`<text x="0" y="${y-9}" font-size="14" font-weight="800" fill="#4c8fe0" text-anchor="middle">？</text>`);
    case '…': return bub('#8a807a',`<text x="0" y="${y-11}" font-size="12" font-weight="800" fill="#8a807a" text-anchor="middle">…</text>`);
    case 'heart': return bub('#ff7aa0',`<path d="M0 ${y-9} l-5 -5 a3 3 0 0 1 5 -4 a3 3 0 0 1 5 4z" fill="#ff7aa0"/>`);
    case 'note': return bub('#25b0a0',`<text x="0" y="${y-9}" font-size="13" fill="#25b0a0" text-anchor="middle">♪</text>`);
    case 'zz': return bub('#8a807a',`<text x="0" y="${y-9}" font-size="11" font-weight="800" fill="#8a807a" text-anchor="middle">zz</text>`);
    case 'cough': return bub('#ffa94d',`<text x="0" y="${y-10}" font-size="9" font-weight="800" fill="#e0892a" text-anchor="middle">ゴホッ</text>`);
  }
  return '';
}

const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* ---------- 文字の整形（ふりがな・聞き取れない言葉） ---------- */
let RUBY_KEYS=null;
function rubyKeys(){ if(!RUBY_KEYS) RUBY_KEYS=Object.keys(RUBY).sort((a,b)=>b.length-a.length); return RUBY_KEYS; }
const rb=(k,y)=>`<ruby>${esc(k)}<rt>${esc(y)}</rt></ruby>`;
const KANJI=/[一-鿿々]/;
/** 平文を、ふりがな付きのトークン列にする */
function plainTokens(s,out){
  const keys=rubyKeys(); let i=0;
  while(i<s.length){
    const ch=s[i];
    if(KANJI.test(ch)){
      let hit=null; for(const k of keys){ if(s.startsWith(k,i)){ hit=k; break; } }
      if(hit){ const mm=hit.match(/^([\u4e00-\u9fff々]+)([^\u4e00-\u9fff々]+)$/); out.push(mm?rb(mm[1],RUBY[hit])+esc(mm[2]):rb(hit,RUBY[hit])); i+=hit.length; continue; }
      if(window.__miss) window.__miss.add(ch);
    }
    out.push(esc(ch)); i++;
  }
}
/** 整形してトークン列（1トークン＝文字送りの1単位）を返す。heardに聞き取れなかった言葉を集める */
function tokens(src,heard){
  const out=[]; const re=/\{([^|{}]+)\|([^{}]+)\}|\[\[([^|\]]*)\|([^|\]]*)(?:\|([^\]]*))?\]\]|⟪([^⟫]*)⟫|《([^》]*)》/g;
  let last=0,m;
  while((m=re.exec(src))){
    plainTokens(src.slice(last,m.index),out);
    if(m[1]!==undefined) out.push(rb(m[1],m[2]));
    else if(m[3]!==undefined){ out.push(`<span class="gb">${esc(m[3])}</span>`); if(heard) heard.push({s:m[3],r:m[4],t:m[5]||''}); }
    else if(m[6]!==undefined){ out.push(`<span class="hid">${'〇'.repeat([...m[6]].length)}</span>`); if(heard) heard.push({s:'〇'.repeat([...m[6]].length),r:m[6],t:''}); }
    else if(m[7]!==undefined){ const t=[]; plainTokens(m[7],t); out.push(`<span class="echo">${t.join('')}</span>`); }
    last=re.lastIndex;
  }
  plainTokens(src.slice(last),out);
  return out;
}
const fmt=s=>tokens(String(s)).join('');

/* ---------- 描画 ---------- */
function sceneSvg(view,cast,thumb){
  const sc=SCENES[view.scene]||SCENES.yard;
  let s=sc.bg;
  if(sc.dyn) s+=sc.dyn(view);
  const split=sc.split||0; let back='',front='';
  for(const [id,a] of Object.entries(view.actors)){
    const c=cast[id]; if(!c||!c.look||!a.show) continue;
    const L=LOOK[c.look]; if(!L) continue;
    const g=`<g class="actor ${a.p==='stand'||!a.p?'idle':''}" ${thumb?'':`id="ac_${id}"`} data-p="${a.p||'stand'}" data-f="${a.f||'normal'}" data-t="${a.t||''}" data-arm="${a.arm||''}" style="transform:translate(${a.x}px,${a.y||215}px) scale(${a.sc||c.sc||1});transition:transform .9s ease">${fig(L)}${a.e?emoteSvg(a.e,-(DIM[L.k].leg+DIM[L.k].body)-DIM[L.k].head*2-4):''}</g>`;
    if(split && (a.y||215)>=split) front+=g; else back+=g;
  }
  s+=back;
  if(sc.fg) s+=sc.fg;
  if(sc.fgdyn) s+=sc.fgdyn(view);
  s+=front;
  return s;
}
function render(){
  $('sc').innerHTML=sceneSvg(S.view,C.cast);
  FXK.forEach(k=>$('fx'+k[0].toUpperCase()+k.slice(1)).classList.toggle('on',!!S.view.fx[k]));
}
function updActor(id,ch){
  const a=S.view.actors[id]||(S.view.actors[id]={x:200,show:false});
  Object.assign(a,ch);
  const elx=document.getElementById('ac_'+id);
  if(!elx || ch.show!==undefined || ch.e!==undefined){ render(); if(ch.e) setTimeout(()=>{ if(S&&S.view.actors[id]&&S.view.actors[id].e===ch.e){ S.view.actors[id].e=null; const g=document.querySelector('#ac_'+id+' .emote'); if(g) g.remove(); } },1800); return; }
  if(ch.p!==undefined){ elx.dataset.p=ch.p; elx.classList.toggle('idle',ch.p==='stand'); }
  if(ch.f!==undefined) elx.dataset.f=ch.f;
  if(ch.t!==undefined) elx.dataset.t=ch.t;
  if(ch.arm!==undefined) elx.dataset.arm=ch.arm;
  if(ch.x!==undefined||ch.y!==undefined||ch.sc!==undefined) elx.style.transform=`translate(${a.x}px,${a.y||215}px) scale(${a.sc||C.cast[id].sc||1})`;
}
function setClock(){
  const c=$('clock');
  if(S.q0!=null){ $('hm').textContent=el(S.clock-S.q0); $('day').textContent=(S.day?S.day+'・':'')+'地震発生から'; c.classList.add('el'); }
  else { $('hm').textContent=hm(S.clock); $('day').textContent=S.day||''; c.classList.remove('el'); }
  c.classList.remove('tick'); void c.offsetWidth; c.classList.add('tick');
}
const elapsed=()=>S.q0==null?0:S.clock-S.q0;
function stageFx(k){ const st=$('stage'); st.classList.remove('shake','quake'); void st.offsetWidth; st.classList.add(k); setTimeout(()=>st.classList.remove(k),k==='quake'?1900:500); }
let rumbleT=null;
function bigQuake(on){
  const st=$('stage'); st.classList.toggle('bigquake',on); clearInterval(rumbleT);
  if(on){ sfx('quake'); rumbleT=setInterval(()=>sfx('rumble'),650); if(navigator.vibrate) try{navigator.vibrate([400,100,300,100,500])}catch(e){} }
}
function setMode(m){ const p=$('play'); p.classList.remove('m-tense','m-night'); if(m) p.classList.add('m-'+m); S.mode=m||''; }

/* ---------- 行の処理 ---------- */
let queue=[], onDone=null, typing=null, waiting=false;
function play(lines,cb){ queue=lines.filter(x=>x!==''&&x!=null&&x!==false); onDone=cb; step(); }
function step(){
  while(queue.length){
    const it=queue.shift();
    if(typeof it==='string'){ say(it); return; }
    if(it.sys){ say('@sys|'+it.sys); return; }
    if(it.radio){ sfx('chime'); say('@radio|'+it.radio); return; }
    doAction(it);
    if(it.wait){ waiting=true; setTimeout(()=>{ waiting=false; step(); },window.__fast?0:it.wait); return; }
  }
  const f=onDone; onDone=null; f&&f();
}
function doAction(it){
  if(it.a){ const ch={...it}; delete ch.a; delete ch.wait; updActor(it.a,ch); return; }
  if(it.d!==undefined){ S.day=it.d; setClock(); }
  if(it.t){ S.clock=toMin(it.t); setClock(); }
  if(it.q0){ S.q0=S.clock; setClock(); }
  if(it.at!==undefined){ S.clock=(S.q0||0)+it.at; setClock(); }
  if(it.adv){ S.clock+=it.adv; setClock(); }
  if(it.bg){ S.view.scene=it.bg; render(); }
  if(it.v){ Object.assign(S.view,it.v); render(); }
  if(it.mode!==undefined) setMode(it.mode);
  if(it.set){ Object.assign(S.flags,it.set); }
  if(it.fx){
    const k=it.fx;
    if(k==='shake'||k==='quake'){ stageFx(k); if(k==='quake') sfx('quake'); }
    else if(k==='bigquake') bigQuake(true);
    else if(k==='noquake') bigQuake(false);
    else if(k==='flash'){ const f=$('fxFlash'); f.classList.add('on'); setTimeout(()=>f.classList.remove('on'),180); }
    else if(k==='calm'){ FXK.forEach(x=>S.view.fx[x]=false); bigQuake(false); render(); }
    else if(k.startsWith('no')){ S.view.fx[k.slice(2)]=false; render(); }
    else { S.view.fx[k]=true; render(); if(k==='siren') sfx('siren'); }
  }
  if(it.se) sfx(it.se);
  if(it.bgm!==undefined) music(it.bgm);
}
let typedFull='';
function say(line){
  let who=null, txt=line;
  const m=line.match(/^(@?\w+)\|(.*)$/s); if(m){ who=m[1]; txt=m[2]; }
  const nm=$('name'), tx=$('txt');
  nm.className='name'; tx.className='txt';
  if(who==='@sys'){ nm.textContent='おしらせ'; nm.classList.add('sys'); nm.style.display='block'; tx.classList.add('sys'); }

function computeMax(c){
  const memo={};
  const dfs=id=>{ if(!id||id==='END') return 0; if(memo[id]!==undefined) return memo[id]; memo[id]=0; const n=c.nodes[id];
    let v; if(n.mini) v=2+dfs(n.next); else if(!n.choices) v=n.go?(typeof n.go==='string'?dfs(n.go):Math.max(0,...(n.goAll||[]).map(dfs))):(n.next?dfs(n.next):0); else v=Math.max(...n.choices.filter(x=>x.g!=='fatal').map(x=>(x.sc||0)+dfs(x.next)));
    return memo[id]=v; };
  return Math.max(1,dfs(c.start));
}
function gradeOf(sc,max){ const r=sc/max; return r>=.85?'S':r>=.6?'A':r>=.3?'B':'C'; }

  S={flags:{},x:{},heard:[],score:0,clock:0,q0:null,day:'',mode:'',log:[],node:null,snap:null,view:{scene:C.scene,actors,fx:{}}};
  $('hudNo').textContent=C.who; $('hudTitle').textContent=C.title;
  $('hm').textContent='--:--'; $('day').textContent=''; $('clock').classList.remove('el'); $('txt').textContent=''; $('name').style.display='none';
  setMode(''); bigQuake(false);

  enterNode(C.start);

function enterNode(id){
  if(id==='END') return ending();

  if(n.mini==='cpr') return runCPR(()=>enterNode(n.next));

  play(lines||[],()=>{
    if(n.fatal) return fail('fatal',typeof n.fatal==='function'?n.fatal(S):n.fatal);
    if(n.go) return enterNode(typeof n.go==='function'?n.go(S):n.go);

function choose(n,c,timedOut){

  S.log.push({q:n.q||'どうする？',you:c.t,g:c.g,why:c.why||'',best:best&&best!==c?best.t:null,bestWhy:best&&best!==c?best.why:null});

function runCPR(cb){
  $('chips').innerHTML=''; $('q').textContent='胸骨圧迫'; $('choices').style.display='none'; $('timer').classList.remove('on');
  const P=$('cpr'); P.style.display='flex'; $('sheet').classList.add('on');
  $('cprDone').style.display='none'; $('pad').style.pointerEvents='auto';
  $('cprMsg').innerHTML='胸の真ん中を押すつもりで、円をテンポよくタップ。<br>最初のタップから10秒間。目標は1分間に100〜120回。';
  const lo=60,hi=160, pct=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));
  $('band').style.left=pct(100)+'%'; $('band').style.width=(pct(120)-pct(100))+'%'; $('needle').style.left='0%'; $('bpm').textContent='--'; $('bpm').className='bpm';
  let taps=[],t0=0,timer=null,done=false; const pad=$('pad');
  const end=()=>{
    done=true; clearInterval(timer); pad.style.pointerEvents='none';
    const iv=[]; for(let i=1;i<taps.length;i++) iv.push(taps[i]-taps[i-1]);
    let g,sc,msg,bpm=0;
    if(iv.length<5){ g='bad'; sc=-1; msg='圧迫がほとんどできなかった。'; }
    else{ const mean=iv.reduce((a,b)=>a+b,0)/iv.length; bpm=Math.round(60000/mean); const sd=Math.sqrt(iv.reduce((a,b)=>a+(b-mean)**2,0)/iv.length); const steady=sd/mean<.2;
      if(bpm>=100&&bpm<=120){ g=steady?'best':'ok'; sc=steady?2:1; msg=`平均 ${bpm}回/分。${steady?'テンポも安定していて、理想的です。':'テンポは良いが、少しばらつきがある。'}`; }
      else if(bpm>=90&&bpm<=130){ g='ok'; sc=1; msg=`平均 ${bpm}回/分。${bpm<100?'少し遅い。':'少し速すぎる。'}目標は100〜120回/分。`; }
      else { g='bad'; sc=-1; msg=`平均 ${bpm}回/分。${bpm<100?'遅すぎて、十分な血流が作れない。':'速すぎて、胸が戻りきらず血液が心臓に戻らない。'}`; } }
    if(S.flags.soft){ msg+=' ただ、押す力が弱く、胸はほとんど沈んでいなかった。'; if(g==='best'){g='ok';sc=1;} }
    S.score+=sc;
    S.log.push({q:'胸骨圧迫のテンポ',you:bpm?`平均 ${bpm}回/分`:'ほとんど押せなかった',g,why:msg+' 胸骨圧迫は、約5cmの深さで、1分間に100〜120回。押したら胸が元に戻るまで力を抜き、できるだけ中断しないこと。',best:null,bestWhy:null});
    $('cprMsg').textContent=msg; $('cprDone').style.display='block'; $('guide').classList.remove('go'); sfx(g==='best'?'lvl':'ok');
  };
  pad.onpointerdown=e=>{ e.preventDefault(); e.stopPropagation(); if(done) return; const now=performance.now();
    if(!t0){ t0=now; timer=setInterval(()=>{ const left=Math.max(0,10-(performance.now()-t0)/1000); $('cprLeft').textContent='あと '+left.toFixed(1)+' 秒'; if(left<=0) end(); },100); }
    taps.push(now); sfx('hit'); pad.classList.add('hit'); setTimeout(()=>pad.classList.remove('hit'),90); stageFx('shake');
    if(taps.length>=3){ const r=taps.slice(-5); const m=(r[r.length-1]-r[0])/(r.length-1); const b=Math.round(60000/m); $('bpm').textContent=b; $('bpm').className='bpm '+(b>=100&&b<=120?'in':'out'); $('needle').style.left=pct(b)+'%'; } };
  $('cprLeft').textContent='あと 10.0 秒';
  $('guideOn').onchange=()=>$('guide').classList.toggle('go',$('guideOn').checked); $('guide').classList.toggle('go',$('guideOn').checked);
  $('cprDone').onclick=e=>{ e.stopPropagation(); P.style.display='none'; $('choices').style.display='flex'; closeSheet(); play([`あなたは押し続けた。${S.log[S.log.length-1].you}。`],cb); };
  window.__cprEnd=fake=>{ taps=fake; end(); };
}

      {sys:'この物語の人物と出来事は架空です。下田小学校は実在の学校ですが、学校の実際の避難計画や先生方の対応とは関係ありません。津波の時間と高さは、高知県・四万十市の公表資料をもとにしています。'},
      {bg:'class4'},{d:'10月の平日'},{t:'10:38'},{a:'okamura',x:300},{a:'hina',x:250,p:'sit'},{a:'hiroto',x:150,p:'sit'},{a:'kid1',show:true,x:80,p:'sit'},
      'ここは四万十川の河口にある、下田小学校。','3時間目は、4年生の算数。窓の外には、いつもと同じ山の緑が見える。',
      'okamura|「84を4つに分けると、いくつずつになるかな？」',
      'hiroto|「はい！ 21！」',
      'okamura|「正解。じゃあ、次は——」',
      {t:'10:40'},{se:'mail'},{fx:'red'},'その時、教室じゅうの携帯電話と、校内放送が、同時に鳴りだした。',
      'phone|「緊急地震速報です。強い揺れに警戒してください」',
      {fx:'nored'},{q0:1},{fx:'bigquake'},{mode:'tense'},{bgm:'tense'},
      'okamura|「机の下！ 机の脚を持って！」',
      {a:'hina',p:'duck'},{a:'hiroto',p:'duck'},{a:'kid1',p:'duck'},{a:'okamura',p:'crouch'},
      '床が、横に大きく振られる。立っていられない。',{se:'glass'},'窓ガラスが割れる音。棚の上の物が、次々に落ちてくる。',
      'hina|「先生！ こわい！」',
      'okamura|「大丈夫、頭を守って！ 先生はここにおるけん！」',
      {at:1},'揺れは、おさまらない。1分。',{se:'crash'},'後ろの棚が倒れた。',
      {at:2},'2分。まだ揺れている。長い。こんなに長い揺れは、生まれて初めてだ。',
      '@me|この揺れ方は、南海地震だ。下田は海と川のすぐそば。津波が来る。',
      {at:3},{fx:'noquake'},{bg:'classwreck'},{fx:'dust'},
      'やっと、揺れがおさまった。',{a:'hina',p:'sit',f:'cry'},{a:'hiroto',p:'sit',f:'shock'},{a:'kid1',p:'sit',f:'shock'},{a:'okamura',p:'stand',f:'shock'},
      'hina|「いたい……足が、いたい……」',
      '倒れた棚が、陽菜の右の足首に当たったらしい。陽菜は足を押さえて泣いている。'],
      obs:[['教室','窓ガラスが割れて、床に散らばっている'],['子どもたち','12人。泣いている子もいる'],['陽菜','倒れた棚で右足首を打った。歩けない'],['揺れ','おさまった。でも、また来るかもしれない']],
      q:'揺れがおさまった。まず、どうする？',
      choices:[
        {t:'上ばきのまま、ガラスのない側を通って廊下に出るよう言い、すぐに人数を数える。歩けない陽菜は自分が背負う。手当ては、高い所に着いてからにする',g:'best',dt:2,sc:2,
          res:['okamura|「みんな、上ばきのまま。ガラスのない、こっち側を通って廊下へ。走らない！」','okamura|「1、2、3……12人。全員おるね」',{a:'okamura',x:250},'okamura|「陽菜、先生の背中に乗って」',{a:'hina',x:256,y:205,p:'sit'},'hina|「……うん」'],next:'yard',
          why:'海の近くでは、揺れがおさまったら一刻も早く高い所へ向かうことが第一です。割れたガラスを避ける、人数を確かめるといった短い確認はけがや置き去りを防ぎます。歩けない人は背負って運び、手当ては安全な場所に着いてから行います。'},
        {t:'陽菜の足首は折れているかもしれない。動かす前に、その場で添え木を当てて、しっかり固定してから動く',g:'bad',dt:6,sc:-1,flag:'splinted',
          res:['okamura|「ちょっと待ってね。足を固定するけん」','教室の掃除用具入れから、ちりとりの柄と、タオルを持ってくる。',{adv:3},'結ぶのに、思ったより手間取る。ほかの子どもたちは、先生の手元を、じっと見ている。',{adv:3},'okamura|「よし……行こう」',{a:'hina',x:256,y:205,p:'sit'}],next:'yard',
          why:'骨折の固定は大切な手当てですが、浸水する場所で時間をかけると、逃げる時間がなくなります。数分の差が命を分けるのが津波です。歩けない人は背負って運び、固定は高い所に着いてから行います。'},
        {t:'とにかく早く。「校庭へ走れ！」と、子どもたちをすぐに外へ出す。陽菜は、ほかの子に肩を貸してもらう',g:'bad',dt:1,sc:-1,flag:'cut',
          res:['okamura|「校庭へ！ 走れ！」','子どもたちが、一斉に教室を飛び出す。',{se:'glass'},'kid1|「いたっ！」','一人が、割れたガラスで足の裏を切った。','廊下の角で、二人がぶつかって転ぶ。',{adv:2},'結局、全員を校庭に集めて数え直すのに、時間がかかってしまった。',{a:'hina',x:256,y:205,p:'sit'}],next:'yard',
          why:'急ぐことは正しいのですが、揺れの直後の校舎は、割れたガラスや倒れた物で危険です。あわてて走らせると、けがや転倒で、かえって時間がかかります。「走らない・押さない」で、短い確認をしてから、まとまって速く動きます。'}
      ]},
    yard:{lines:S=>[
      {bg:'yard'},{fx:'nodust'},{a:'okamura',x:290,p:'stand',f:'normal'},{a:'hina',x:296,y:205,p:'sit',f:'cry'},...kidsAt([70,110,150,190,230]),
      'ほかの学年も、次々に校庭へ出てきた。下田小学校の子どもたちが、ほぼ全員、校庭に集まっている。',
      {radio:'こちらは、防災しまんとし、です。《……です》　ただいま、高知県の沿岸に、大津波警報が、発表されました。《……されました》　海岸や川の近くの{方|かた}は、ただちに、高い所へ、避難してください。《……てください》'},
      '防災無線が、山に反響して、何度も重なって聞こえる。',
      {a:'kyoto',show:true,x:350},'教頭先生が、名簿を手に、息を切らせて来た。校長先生は、出張で中村に出ている。',
      'kyoto|「全員そろうたら、ここで待機します。市から指示が来るまで、勝手に動いたらいかん」',
      '@me|待機……？ 校庭の海抜は低い。有隣公園の高台までは、子どもの足でも数分のはずだ。',
      'sota|「先生、津波、来るが？」'],
      obs:[['大津波警報','発表された'],['ここ','下田小学校の校庭。海抜が低い'],['有隣公園','すぐ近くの高台'],['教頭先生','「指示が来るまで待機」'],['全校','子どもたちが校庭に集まっている']],
      q:'教頭先生は「待機」と言う。どうする？',
      choices:[
        {t:'「待っていたら間に合いません。今すぐ全員で、有隣公園へ上がりましょう」と、教頭先生に強く言う',g:'best',dt:2,sc:3,flag:'allSchool',x:{allSchool:1},
          res:['okamura|「教頭先生、指示を待っていたら、間に合いません。今すぐ、全員で有隣公園へ上がりましょう」','kyoto|「……けんど、市からは——」','okamura|「揺れたら高い所へ。それが一番の指示です。お願いします！」',{a:'kyoto',e:'!'},'教頭先生は、一瞬だけ海の方を見て、うなずいた。','kyoto|「……よし。全校、有隣公園へ移動！ 低学年から！」',...kidsAt([60,100,140,180,220],'run')],next:'parent',
          why:'東日本大震災では、校庭で長く待機したことが悲劇につながった例があります。大きな揺れの後、海の近くでは「指示を待たずに高い所へ」。周りの大人を説得して全員で動くことが、一番多くの命を守ります。'},
        {t:'教頭先生と言い争っている時間はない。自分のクラスだけでも、先に有隣公園へ向かう',g:'ok',dt:1,sc:1,flag:'myClass',x:{allSchool:0},
          res:['okamura|「4年生、先生について来て！ 有隣公園へ上がるよ！」','kyoto|「岡村先生！ 待ちなさい！」','振り返らずに歩き出す。','すると、それを見た5年生の担任が、自分のクラスを連れて後に続いた。',{adv:1},'一人、また一人。気づけば、全校が動き出していた。',...kidsAt([60,100,140,180,220],'run')],next:'parent',
          why:'「誰かが逃げ始めると、周りも逃げ始める」ことは、多くの災害で知られています。先に動いたことで全校が動きました。ただ、最初から全員で動けるよう説得できれば、もっと確実です。'},
        {t:'指示を待つ。ここで勝手に動けば、子どもたちが混乱する。全員そろって、指示が出てから動く方が安全だ',g:'bad',dt:0,sc:-2,flag:'waited',x:{allSchool:0},
          res:S=>X('fire','school')?[
            'okamura|「……わかりました。待機します」',{adv:3},'子どもたちを座らせて、名簿で人数を確かめる。',
            {a:'hamada',show:true,x:380,p:'run'},'その時、校門の方から、法被を着た男の人が走ってきた。',
            'hamada|「何しよるがな！ 校庭におったらいかん！ はよう上がれ！ 津波が来るぞ！」',
            '消防団の浜田さんだ。水門を閉めに行く途中で、校庭の子どもたちを見て、寄ってくれたのだ。',
            'kyoto|「……全校、有隣公園へ！ 急いで！」',{a:'hamada',show:false},...kidsAt([60,100,140,180,220],'run')]:[
            'okamura|「……わかりました。待機します」',{adv:3},'子どもたちを座らせて、名簿で人数を確かめる。',...kidsAt([70,110,150,190,230],'sit'),
            {radio:'大津波警報が、発表されています。《……ています》　ただちに、高い所へ、避難してください。'},{adv:3},
            'sota|「先生、まだ？」','okamura|「もうちょっと、待とうね」',{adv:2},
            '近所の人が、校門の外を、山の方へ走っていくのが見えた。','kyoto|「……指示が来ん。電話もつながらん。……移動しましょう。有隣公園へ」',...kidsAt([60,100,140,180,220],'run')],
          next:'parent',
          why:'指示を待つ気持ちは自然です。でも、大きな揺れの後の津波警報では、市からの個別の指示は来ないことが多く、防災無線の「ただちに高い所へ」がその指示です。東日本大震災では、校庭で長く待機したことが悲劇につながった例があります。'}
      ]},

          res:['okamura|「お母さん、港の方へ行ったら、間に合わんかもしれません。美咲ちゃんと一緒に、有隣公園へ上がってください」','smom|「けんど、ばあちゃんが……！」','okamura|「おばあちゃんのことは、消防団の人に、すぐ伝えます。お母さんが戻って、二人とも、三人とも、助からんかったら……美咲ちゃんが一人になります」',{a:'smom',e:'…'},'お母さんは、唇をかんで、美咲の手を強くにぎった。','smom|「……わかった。美咲、行くで」',{a:'smom',x:230},'列の後ろを歩いていた地区の人に、おばあちゃんのことを頼んだ。'],next:'route',

        {t:'保護者が迎えに来たのだから、美咲を引き渡す。家族のことは、家族が決めることだ',g:'bad',dt:1,sc:-2,flag:'handed',x:{handover:1},

          why:'迎えに来た保護者に引き渡すのは、ふだんなら当たり前のことです。でも、津波警報が出ている時、海の方の家へ向かうのは危険です。東日本大震災では、引き渡した後に親子が犠牲になった例があります。'},
        {t:'「警報が出ている間は引き渡せません」と、美咲は渡さない。お母さんには、一人で行ってもらうしかない',g:'ok',dt:2,sc:0,flag:'refused',x:{handover:0},
          res:['okamura|「警報が出ている間は、お子さんを引き渡せません。美咲ちゃんは、学校が責任を持って高台へ連れていきます」','smom|「……そんな……！」','お母さんは、美咲を見て、それから港の方を見た。','smom|「美咲、先生と行きよりなさい。お母さん、ばあちゃん連れて、すぐ行くけん！」',{a:'smom',x:400,p:'run'},'お母さんは、一人で車へ走っていった。',{a:'smom',show:false},'misaki|「お母さーん！」'],next:'route',
          why:'子どもを守ることはできました。でも、お母さんが危険な方へ向かうのを止められていません。保護者にも一緒に避難してもらい、残された家族のことは地区の人や消防団に伝えるのが、一番多くの命を守ります。'}
      ]},

      {bg:'road'},{a:'okamura',x:230,p:'stand'},{a:'hina',x:236,y:205,p:'sit',f:'normal'},...kidsAt([60,100,140,170,200]),

      'ブロック塀が道いっぱいに倒れて、ふさがっている。残った塀も、ぐらぐらと傾いている。',

    climb:{lines:S=>{
        const arr=elapsed()+2;
        const base=[{bg:'slope'},{a:'okamura',x:200,p:'run'},{a:'hina',x:206,y:205,p:'sit'},...kidsAt([60,90,120,150,170],'run'),{adv:2},
          '坂道を、上へ、上へ。息が切れる。背中の陽菜が、ずっしりと重い。'];
        if(arr>18) return base.concat([{mode:'tense'},{fx:'dusk'},'坂の途中で、後ろから、聞いたことのない音がした。',{se:'roar'},'ゴオオオ……という、地鳴りのような音。','振り返ると、さっきまで歩いていた町の向こうから、黒い水が——',{fx:'black'},{wait:1200}]);
        if(arr>=16) return base.concat([{se:'roar'},'坂の上の方から、地区の人が叫んでいる。','jiisan|「はよう上がれ！ 来よるぞ！」',{a:'jiisan',show:true,x:360},'振り返ると、坂の下の道に、水が流れこんでくるのが見えた。','最後の子どもが坂を上りきった、その数十秒後、坂の下は水につかった。',{a:'jiisan',show:false}]);
        return base.concat(['上の方から、地区の人たちが手招きしている。','最後の子どもまで、全員が坂を上りきった。','okamura|「着いた……！ みんな、おるね！」']);
      },
      go:S=>elapsed()>18?'late':'park',goAll:['park','late']},
