<title>四十八駿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="47都道府県の代表馬とアメリカからの招待馬が日本一を争う競馬ゲーム。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=BIZ+UDPGothic:wght@400;700&family=Oswald:wght@500;600&display=swap">
<style>
/* Layout: 競馬新聞の紙面。上に題字と節の帯、中身は「出馬表」の罫線で組む。レースだけは芝の中継画面。 */
:root{
  --paper:#eceee8; --sheet:#f7f8f4; --sunk:#e1e4dc; --ink:#15181b; --ink2:#4d5450; --rule:#c3c8bf;
  --red:#c8102e; --red-ink:#ffffff; --turf:#2a6a3c; --gold:#a8800f; --good:#1f7a43; --bad:#b3261e;
  --map:#d2d7cd; --map-line:#f7f8f4;
  --w1:#ffffff; --w2:#151515; --w3:#d7202f; --w4:#1f58d0;
  --f-head:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"Oswald","DIN Alternate","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111412; --sheet:#191d1a; --sunk:#222723; --ink:#e6e9e3; --ink2:#a2aaa2; --rule:#343b36;
  --red:#ff5c6c; --red-ink:#2a0207; --turf:#5cb877; --gold:#e0b64a; --good:#5fd08a; --bad:#ff7a6e;
  --map:#2c332e; --map-line:#191d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111412; --sheet:#191d1a; --sunk:#222723; --ink:#e6e9e3; --ink2:#a2aaa2; --rule:#343b36;
  --red:#ff5c6c; --red-ink:#2a0207; --turf:#5cb877; --gold:#e0b64a; --good:#5fd08a; --bad:#ff7a6e;
  --map:#2c332e; --map-line:#191d1a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;display:flex;flex-direction:column;gap:16px}
/* 題字の帯 */
.mast{display:flex;align-items:stretch;gap:14px;border-bottom:3px double var(--ink);padding-block:12px 10px;flex-wrap:wrap}
.seal{writing-mode:vertical-rl;font-family:var(--f-head);font-weight:800;font-size:28px;line-height:1;letter-spacing:.08em;background:var(--red);color:var(--red-ink);padding:8px 6px;border-radius:2px;flex:none;cursor:pointer;border:0}
.mast .t{min-width:14em!important;display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1}
.mast .t b{font-family:var(--f-head);font-size:20px;line-height:1.25}
.mast .t small{color:var(--ink2);font-size:12.5px}
.mast nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nb{border:1px solid var(--rule);background:var(--sheet);border-radius:2px;padding:6px 12px;font-size:14px;min-height:38px}
.nb[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:2px;padding:9px 18px;font-weight:700;font-size:15px;min-height:44px}
.btn.red{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:2px;padding:14px 16px;min-width:0}
h2.hd{margin:0;font-family:var(--f-head);font-weight:800;font-size:clamp(22px,4.6vw,30px);line-height:1.2;text-wrap:balance}
h2.hd small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--ink2);letter-spacing:.04em}
h3.sub{margin:0 0 6px;font-family:var(--f-head);font-size:18px;line-height:1.3;border-left:5px solid var(--red);padding-left:8px}
.kick{font-size:12px;letter-spacing:.14em;color:var(--red);font-weight:700;margin:0}
.muted{color:var(--ink2)}.small{font-size:13px}
p{margin:0}
.waku{display:inline-grid;place-items:center;width:1.7em;height:1.7em;font-family:var(--f-num);font-weight:600;font-size:14px;border:1px solid #555;border-radius:2px;flex:none}
.w1{background:var(--w1);color:#111}.w2{background:var(--w2);color:#fff;border-color:#000}.w3{background:var(--w3);color:#fff;border-color:#8a0f18}.w4{background:var(--w4);color:#fff;border-color:#0e2f7a}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:0 7px;border-radius:2px;border:1px solid var(--rule);background:var(--sunk);white-space:nowrap;line-height:1.7}
.chip.st{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.fav{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.g-S{color:#d4231f;font-weight:700}.g-A{color:#d4730f;font-weight:700}.g-B{color:var(--ink)}.g-C{color:#3f78c4}.g-D{color:#7a62c8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .g-S{color:#ff7068}:root:not([data-theme="light"]) .g-A{color:#ffae4a}:root:not([data-theme="light"]) .g-C{color:#7fb0ff}:root:not([data-theme="light"]) .g-D{color:#b9a6ff}}
:root[data-theme="dark"] .g-S{color:#ff7068}:root[data-theme="dark"] .g-A{color:#ffae4a}:root[data-theme="dark"] .g-C{color:#7fb0ff}:root[data-theme="dark"] .g-D{color:#b9a6ff}
/* 題 */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:18px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{margin:0;font-family:var(--f-head);font-weight:800;font-size:clamp(54px,14vw,112px);line-height:1;letter-spacing:.04em}
.hero h1 span{color:var(--red)}
.hero .lead{max-width:34em;margin-top:10px}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--ink);margin-top:14px}
.rules div{padding:8px 10px;border-right:1px solid var(--rule)}.rules div:last-child{border-right:0}
.rules b{display:block;font-family:var(--f-head);font-size:17px}.rules span{font-size:12.5px;color:var(--ink2);line-height:1.5;display:block}
@media (max-width:480px){.rules{grid-template-columns:1fr}.rules div{border-right:0;border-bottom:1px solid var(--rule)}.rules div:last-child{border-bottom:0}}
/* 地図 */
.jmap{width:100%;height:auto;display:block}
.jmap path{fill:var(--map);stroke:var(--map-line);stroke-width:.8;cursor:pointer;transition:fill .15s}
.jmap path:hover{fill:color-mix(in srgb,var(--red) 35%,var(--map))}
.jmap path.on{fill:var(--red)}
.jmap path.out{fill:color-mix(in srgb,var(--map) 50%,var(--paper));cursor:default}
.jmap path.alive{fill:color-mix(in srgb,var(--turf) 55%,var(--map))}
.jmap .frame{fill:none;stroke:var(--rule);stroke-dasharray:4 4}
/* 選択 */
.pick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
@media (max-width:820px){.pick{grid-template-columns:minmax(0,1fr)}}
.regs{display:flex;flex-wrap:wrap;gap:4px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
.hc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:2px;padding:8px 10px;min-width:0}
.hc:hover{border-color:var(--ink)}
.hc[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.hc .pf{font-size:11.5px;color:var(--ink2);grid-column:1/-1;letter-spacing:.06em}
.hc b{font-family:var(--f-head);font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.hc .tt{font-family:var(--f-num);font-size:18px;text-align:right}
.hc .mt{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink2)}
.silk{width:22px;height:22px;border-radius:2px;flex:none;border:1px solid rgba(0,0,0,.3)}
.detail{display:flex;flex-direction:column;gap:12px}
.detail .nm{font-family:var(--f-head);font-weight:800;font-size:clamp(26px,6vw,36px);line-height:1.15}
.detail .nm small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--ink2)}
.portrait{width:100%;max-width:100%;height:auto;aspect-ratio:2.2/1;display:block;background:linear-gradient(#cfe0e8,#e8efe6 60%,#5d9a5f 60.5%,#4b8a50);border-radius:2px}
.bars{display:grid;grid-template-columns:3.2em minmax(0,1fr) 2.4em;gap:5px 10px;align-items:center}
.bars span{font-size:13px;color:var(--ink2)}
.bar{height:10px;background:var(--sunk);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.bar i.hi{background:var(--red)}
.bar s{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);text-decoration:none}
.apt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--ink)}
.apt div{text-align:center;padding:4px 2px;border-right:1px solid var(--rule)}.apt div:last-child{border-right:0}
.apt small{display:block;font-size:11px;color:var(--ink2)}.apt b{font-family:var(--f-num);font-size:20px;font-weight:600}
.memo{font-size:13px;padding:8px 10px;background:var(--sunk);border-left:3px solid var(--gold)}
/* 大会 */
.round{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between}
.steps{display:flex;gap:0;border:1px solid var(--ink)}
.steps span{padding:4px 12px;font-size:13px;border-right:1px solid var(--rule)}.steps span:last-child{border-right:0}
.steps span.on{background:var(--ink);color:var(--paper);font-weight:700}
.steps span.done{color:var(--ink2);text-decoration:line-through}
.favbox{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.favbox b{font-family:var(--f-head);font-size:20px}
.races{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.rc{background:var(--sheet);border:1px solid var(--rule);border-radius:2px;display:flex;flex-direction:column;min-width:0}
.rc.mine{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.rc header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 10px;border-bottom:1px solid var(--rule)}
.rc header b{font-family:var(--f-head);font-size:16px}
.rc header span{font-size:12.5px;color:var(--ink2);text-align:right}
.rc ol{list-style:none;margin:0;padding:4px 10px;display:flex;flex-direction:column}
.rc li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--rule);font-size:14px}
.rc li:last-child{border-bottom:0}
.rc li .r{font-family:var(--f-num);font-size:13px;color:var(--ink2);text-align:right;white-space:nowrap}
.rc li.win{font-weight:700}.rc li.win .r{color:var(--red)}
.rc li.lose{color:var(--ink2)}
.rc li .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc footer{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--rule);margin-top:auto}
.rc footer .btn{flex:1;min-height:38px;padding:5px 10px;font-size:14px}
/* 出馬表 */
.cond{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
.cond .big{font-family:var(--f-head);font-weight:800;font-size:clamp(24px,5vw,34px);line-height:1.15}
.tw{overflow-x:auto;border:1px solid var(--ink);background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);text-align:center;white-space:nowrap;vertical-align:middle}
th:last-child,td:last-child{border-right:0}
thead th{font-size:12px;font-weight:400;color:var(--ink2);background:var(--sunk);letter-spacing:.06em}
tbody tr:last-child td{border-bottom:0}
td.l{text-align:left}
td .hn{font-family:var(--f-head);font-weight:800;font-size:17px;display:block;line-height:1.2}
td .hn+small{font-size:11.5px;color:var(--ink2)}
.mark{font-size:22px;line-height:1;color:var(--red);font-weight:700}
.odds{font-family:var(--f-num);font-size:18px}
.pop{font-size:11px;color:var(--ink2);display:block}
.cmt{font-size:12.5px;color:var(--ink2);white-space:normal;min-width:11em;text-align:left;line-height:1.45}
tr.me td{background:color-mix(in srgb,var(--red) 9%,var(--sheet))}
/* レース画面 */
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#3c7a45;overflow:hidden;border:1px solid var(--ink);container-type:inline-size;touch-action:manipulation;-webkit-user-select:none;user-select:none}
@media (max-width:640px){.stage{aspect-ratio:4/3}}
.stage canvas.main{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;pointer-events:none;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.hud.tl{left:10px;top:8px;display:flex;align-items:stretch;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));text-shadow:none}
.hud.tl .rn{background:#0f1a14;padding:3px 9px;font-family:var(--f-head);font-size:clamp(12px,2.2cqw,18px);line-height:1.3;border-left:4px solid var(--w3)}
.hud.tl .rn small{display:block;font-family:var(--f-body);font-size:clamp(10px,1.5cqw,12.5px);opacity:.85}
.hud.tl .rem{background:#f4f2e8;color:#111;padding:3px 10px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end}
.hud.tl .rem small{font-size:clamp(9px,1.3cqw,11px);color:#555;line-height:1}
.hud.tl .rem b{font-family:var(--f-num);font-weight:600;font-size:clamp(17px,3.2cqw,28px);line-height:1.1}
.hud.mm{right:8px;top:8px;width:clamp(96px,22cqw,190px);height:auto;aspect-ratio:2/1;background:rgba(10,20,14,.55);border-radius:3px}
.hud.ord{left:0;right:0;bottom:0;display:flex;gap:2px;padding:4px 6px;background:linear-gradient(transparent,rgba(0,0,0,.7) 30%);font-size:clamp(10px,1.8cqw,14px);text-shadow:none;overflow:hidden}
.hud.ord div{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.55);padding:2px 6px 2px 2px;border-radius:2px;min-width:0;flex:1 1 0}
.hud.ord div.fv{background:rgba(200,16,46,.85)}
.hud.ord .waku{width:1.5em;height:1.5em;font-size:.95em}
.hud.ord b{font-family:var(--f-num);font-weight:600}
.hud.ord span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hud.ord em{font-style:normal;font-family:var(--f-num);opacity:.85;margin-left:auto;white-space:nowrap}
.hud.sub{left:6%;right:6%;bottom:calc(clamp(22px,4cqw,34px) + 8px);text-align:center;font-weight:700;font-size:clamp(13px,2.4cqw,20px)}
.hud.sub span{background:rgba(0,0,0,.6);padding:2px 10px;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.7}
.hud.bn{left:0;right:0;top:30%;text-align:center;font-family:var(--f-head);font-weight:800;font-size:clamp(26px,7.5cqw,72px);letter-spacing:.1em;text-shadow:0 0 18px rgba(255,210,90,.85),0 3px 0 #000;animation:bn 1.8s ease forwards}
.hud.bn small{display:block;font-family:var(--f-body);font-size:.32em;letter-spacing:.1em;text-shadow:0 2px 3px #000}
@keyframes bn{0%{opacity:0;transform:scale(1.5)}12%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0}}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.kiai{display:flex;align-items:center;gap:12px;background:var(--red);color:var(--red-ink);border:0;border-radius:2px;padding:8px 22px 8px 16px;min-height:60px;box-shadow:0 4px 0 color-mix(in srgb,var(--red) 55%,#000)}
.kiai:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--red) 55%,#000)}
.kiai b{font-family:var(--f-head);font-weight:800;font-size:26px;letter-spacing:.12em;line-height:1}
.kiai small{display:block;font-size:11.5px;opacity:.9}
.kiai .pips{display:flex;gap:5px}
.kiai .pips i{width:13px;height:13px;border-radius:50%;background:currentColor;opacity:1}
.kiai .pips i.used{opacity:.25}
.kiai:disabled{opacity:.45;box-shadow:none}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:2px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:6px 12px;border-right:1px solid var(--rule);min-height:40px;font-family:var(--f-num);font-size:15px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.log{list-style:none;margin:0;padding:0;max-height:180px;overflow-y:auto;font-size:13.5px;display:flex;flex-direction:column}
.log li{padding:3px 0;border-bottom:1px dashed var(--rule);display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:8px}
.log li em{font-style:normal;font-family:var(--f-num);color:var(--ink2);text-align:right}
/* 結果 */
.win1{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:640px){.win1{grid-template-columns:minmax(0,1fr)}}
.win1 .big{font-family:var(--f-head);font-weight:800;font-size:clamp(30px,7vw,48px);line-height:1.1}
.res td .hn{font-size:16px}
.res tr.r1 td{background:color-mix(in srgb,var(--gold) 14%,var(--sheet))}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);font-family:var(--f-head);font-weight:800;font-size:20px;padding:0 10px;transform:rotate(-6deg);letter-spacing:.1em}
.champ{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:10px}
.champ .big{font-family:var(--f-head);font-weight:800;font-size:clamp(36px,10vw,80px);line-height:1.05}
.path{display:flex;flex-direction:column;gap:4px;font-size:14px;text-align:left;width:min(560px,100%)}
.path div{display:grid;grid-template-columns:5.5em minmax(0,1fr) auto;gap:8px;padding:4px 0;border-bottom:1px dashed var(--rule)}
/* 名鑑・検証 */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.hist{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--ink);padding-top:16px}
.hist div{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;min-width:0;height:100%}
.hist i{display:block;width:100%;background:var(--ink)}
.hist i.old{background:var(--rule)}
.hist em{font-style:normal;font-size:10.5px;font-family:var(--f-num);color:var(--ink2)}
.hist b{font-size:10.5px;font-family:var(--f-num);font-weight:500}
.histx{display:flex;gap:3px}.histx span{flex:1 1 0;text-align:center;font-family:var(--f-num);font-size:10.5px;color:var(--ink2);min-width:0}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:10px;margin-right:4px;vertical-align:-1px}
.chg td{font-size:13px}
.chg .why{white-space:normal;min-width:16em;text-align:left;line-height:1.5}
.up{color:var(--good);font-weight:700}.dn{color:var(--bad);font-weight:700}

  if (pat === '縦縞') for (let k = -1; k <= 4; k++) { g.beginPath(); g.moveTo(sx + k * 6, sy + 8); g.lineTo(sx + k * 6 + 4, sy - 10); g.stroke(); }

    o.gait = (o.gait + (moving ? o.v / 7.2 : 0.4) * dtReal * RV.spd * (moving ? 1 : 0.15)) % 1;

    const x = X(o.x) - 72 * sc;   // 鼻先がo.xの位置
    // 芝・泥が舞う
    if (moving && o.v > 10 && Math.random() < 0.5 * RV.spd && RV.parts.length < 160) RV.parts.push({ x: o.x - 1.4, y: o.lane, vx: -1 - Math.random() * 2, vy: 1.5 + Math.random() * 2, z: 0, life: 0.5 + Math.random() * 0.3, mud: bL >= 2 });
    const kiai = o.kiaiT && R.t < o.kiaiT;
    if (kiai) { g.save(); g.globalAlpha = 0.55; g.strokeStyle = '#ffd25a'; g.lineWidth = 2; for (let k = 0; k < 7; k++) { const yy = y - (20 + k * 12) * sc; const len = (40 + Math.random() * 60) * sc; g.beginPath(); g.moveTo(x - 40 * sc - len, yy); g.lineTo(x - 40 * sc, yy); g.stroke(); } g.restore(); }
    drawHorse(g, x, y, sc, o.gait, run, o.h, o.waku, { push: moving && o.x > o.spurtAt && !o.fin, whip: moving && o.x > o.spurtAt + 80 && !o.fin && o.x < D });
    // 名札
    const lx = x + 6 * sc, ly = y - 118 * sc;
    g.font = `700 ${Math.max(10, Math.min(14, 11 * sc * 1.2 + 4))}px BIZ UDPGothic, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    const label = (o.id === S.fav ? '▼ ' : '') + o.h.name, tw2 = g.measureText(label).width + 10;
    g.fillStyle = o.id === S.fav ? 'rgba(200,16,46,.92)' : 'rgba(0,0,0,.55)'; g.fillRect(lx - tw2 / 2, ly - 9, tw2, 18);
    g.fillStyle = '#fff'; g.fillText(label, lx, ly + 0.5);
    if (kiai) { g.fillStyle = '#ffd25a'; g.font = `800 ${Math.max(14, 20 * sc + 6)}px "Shippori Mincho B1", serif`; g.fillText('気合い！', lx, ly - 22); }
  }
  // 舞う芝
  for (let i = RV.parts.length - 1; i >= 0; i--) {
    const p = RV.parts[i]; if (false) { RV.parts.splice(i, 1); continue; }
    const dt = dtReal * RV.spd; p.life -= dt; p.x += p.vx * dt; p.z += p.vy * dt; p.vy -= 9 * dt; if (p.life <= 0 || p.z < 0) { RV.parts.splice(i, 1); continue; }
    g.fillStyle = p.mud ? 'rgba(80,58,36,.8)' : 'rgba(40,90,40,.8)'; g.fillRect(X(p.x), laneY(p.y) - p.z * ppm, 2.5, 2.5);
  }
  // 外ラチ（手前）
  g.fillStyle = '#f4f4ef'; g.fillRect(0, bot - Hh * 0.01, W, Hh * 0.012);
  for (let m = Math.floor((cam.x - cam.w) / 2) * 2; m < cam.x + cam.w; m += 2) { const a = X(m) + (X(m) - W / 2) * 0.25; g.fillRect(a - 1.5, bot - Hh * 0.05, 3, Hh * 0.05); }

  if (bL >= 2) { g.strokeStyle = 'rgba(220,230,240,.35)'; g.lineWidth = 1; g.beginPath(); for (let k = 0; k < (bL === 3 ? 90 : 45); k++) { const rx = (k * 97.3 + performance.now() * 0.9) % W, ry = (k * 53.7 + performance.now() * 1.3) % Hh; g.moveTo(rx, ry); g.lineTo(rx - 3, ry + 12); } g.stroke(); }
}
function drawMini() {
  const mm = $('#mm'); if (!mm) return;
  const g = mm.getContext('2d'), dpr = RV.dpr, W = mm.width / dpr, Hh = mm.height / dpr, { R, c } = RV;
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, Hh);
  // 楕円コース：直線2本＋半円2つ
  const lap = c.lap, r = Hh * 0.36, cx = W / 2, cy = Hh / 2;
  const straightPx = W - 2 * r - 16, sLen = c.straight, curveLen = (lap - 2 * sLen) / 2;
  const left = c.turn === '右';   // 時計回り（右回り）は決勝線が手前の直線の左端
  // s：決勝線から逆向きに測った距離 → 座標
  function pos(s) {
    s = ((s % lap) + lap) % lap; // 0 = 決勝線, 走る向きに増える
    // 決勝線は手前の直線の端（左回りなら左端、右回りなら右端）。走る向き：手前直線を決勝線へ
    let d = s, x, y;
    const segs = [sLen, curveLen, sLen, curveLen];
    const xL = cx - straightPx / 2, xR = cx + straightPx / 2;
    if (d < segs[0] * 0) { }
    // 決勝線から：1コーナー→向こう正面→3・4コーナー→最後の直線
    if (d < curveLen) { const a = d / curveLen * Math.PI; x = left ? xL - Math.sin(a) * r : xR + Math.sin(a) * r; y = cy + Math.cos(a) * r; return [left ? x : x, y]; }
    d -= curveLen;
    if (d < sLen) { const k = d / sLen; x = left ? xL + k * straightPx : xR - k * straightPx; return [x, cy - r]; }
    d -= sLen;
    if (d < curveLen) { const a = d / curveLen * Math.PI; x = left ? xR + Math.sin(a) * r : xL - Math.sin(a) * r; y = cy - Math.cos(a) * r; return [x, y]; }
    d -= curveLen;
    const k = d / sLen; x = left ? xR - k * straightPx : xL + k * straightPx; return [x, cy + r];
  }
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = Math.max(3, Hh * 0.07); g.beginPath();
  for (let s = 0; s <= lap; s += lap / 80) { const [x, y] = pos(s); s ? g.lineTo(x, y) : g.moveTo(x, y); } g.closePath(); g.stroke();
  const [fx, fy] = pos(0); g.fillStyle = '#c8102e'; g.fillRect(fx - 1.5, fy - 6, 3, 12);
  const startS = lap - (R.D % lap);
  for (const o of R.horses.slice().sort((a, b) => a.x - b.x)) {
    const [x, y] = pos(startS + Math.min(o.x, R.D));
    g.fillStyle = WAKU_COL[o.waku - 1]; g.strokeStyle = o.id === S.fav ? '#ffd25a' : '#000'; g.lineWidth = o.id === S.fav ? 2 : 1;
    g.beginPath(); g.arc(x, y, Math.max(3.5, Hh * 0.07), 0, Math.PI * 2); g.fill(); g.stroke();
  }
}
