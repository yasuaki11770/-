<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6a3a">
<meta name="description" content="四国の高校野球部の監督になって甲子園をめざす、観戦型の高校野球ゲーム。">
<title>白球ナイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* ---- 試合画面（三国スタジアム由来の中継画面） ---- */
/* Layout: 16:9 broadcast screen with TV-style overlays; manager console (or manual pad) under it. One deliberate night-game look. */
:root{
  --night:#070b16; --panel:#101a30; --panel2:#17243f; --line:#2c3d63; --ink:#f3f1ea; --dim:#97a3c0;
  --gold:#f2c14e; --gold2:#b8862a; --red:#e2513b; --green:#3fd36b; --blue:#4d7cff;
  --ui:'M PLUS 1p','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;
  --brush:'Dela Gothic One','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(1200px 500px at 50% -10%,#14213f,var(--night) 70%),var(--night);color:var(--ink);font-family:var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
#screen{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;overflow:hidden;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 0 1px #24324f;container-type:inline-size}
#cv{width:100%;height:100%;display:block}
.hud{position:absolute;pointer-events:none;font-size:clamp(9px,1.7cqw,17px);line-height:1.2}
/* scorebug */
#bug{top:3%;left:2.5%;display:flex;align-items:stretch;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
#bug .tm{display:grid;grid-template-columns:auto auto;background:linear-gradient(#1d2b4f,#0e1730);border:1px solid #3a4d7a;border-right:0}
#bug .tm span{padding:.18em .55em;font-weight:800;border-left:.35em solid var(--c)}
#bug .tm b{padding:.18em .55em;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.06);min-width:1.8em}
#bug .tm .bat{background:linear-gradient(90deg,rgba(242,193,78,.25),transparent)}
#bug .st{display:flex;align-items:center;gap:.6em;padding:0 .6em;background:linear-gradient(#26375f,#141f3c);border:1px solid #3a4d7a}
#bug .inn{font-weight:800;font-size:1.15em;color:var(--gold)}
#bug .cnt{display:grid;gap:.12em;font-size:.78em;font-weight:700}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:#2a3557;margin-left:.22em;vertical-align:-.08em;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.b .on{background:radial-gradient(circle at 35% 35%,#9dffb8,#22b04d)}.s .on{background:radial-gradient(circle at 35% 35%,#fff0a8,#e0a020)}.o .on{background:radial-gradient(circle at 35% 35%,#ffb0a0,#d0301c)}
#dia{width:2.6em;height:2.6em}
/* lower third */
#lower{left:2.5%;bottom:4%;display:flex;align-items:stretch;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));max-width:62%}
#lower .no{display:grid;place-items:center;padding:0 .6em;background:var(--c,#333);font-weight:800;font-size:1.5em;min-width:2.2em}
#lower .bd{background:linear-gradient(#f6f2e6,#d9d2bf);color:#111a2c;padding:.25em .8em .3em;min-width:0}
#lower .nm{font-family:var(--brush);font-size:1.75em;line-height:1.05}
#lower .ps{font-size:.75em;font-weight:700;color:#4a5570}
#lower .gr{display:flex;gap:.55em;margin-top:.15em;font-weight:800;font-size:.86em;flex-wrap:wrap}
#lower .gr i{font-style:normal;color:#5a6580;font-weight:700;margin-right:.15em}
.g-S{color:#e0245e}.g-A{color:#e85d1c}.g-B{color:#c28a00}.g-C{color:#6f9a10}.g-D{color:#1f9a58}.g-E{color:#1a7fb0}.g-F{color:#5a5fb0}.g-G{color:#777}
#pinfo{right:2.5%;bottom:4%;text-align:right;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
#pinfo .pc{background:linear-gradient(#1d2b4f,#0e1730);border:1px solid #3a4d7a;padding:.25em .7em}
#pinfo .pc b{font-family:var(--brush);font-weight:400;font-size:1.35em}
#pinfo .pc small{display:block;color:var(--dim);font-size:.75em;font-weight:700}
#pinfo .sp{margin-top:.25em;display:inline-block;background:linear-gradient(#f2c14e,#c58f1d);color:#1a1205;padding:.1em .6em;font-weight:800;font-size:1.25em;font-variant-numeric:tabular-nums}
#pinfo .sp small{font-size:.6em;margin-left:.4em}
#otag{top:3%;right:2.5%;background:linear-gradient(#b23a26,#7a2012);border:1px solid #ff9a7a;padding:.2em .7em;font-weight:800;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
#msg{left:0;right:0;top:30%;text-align:center;opacity:0;transition:opacity .15s}
#msg.show{opacity:1}
#msg .t{display:inline-block;font-family:var(--brush);font-size:clamp(26px,8.5cqw,96px);line-height:1.15;color:#fff;padding:.05em .7em;
  background:linear-gradient(90deg,transparent,rgba(5,8,16,.72) 15%,rgba(5,8,16,.72) 85%,transparent);
  text-shadow:0 0 18px rgba(242,193,78,.9),0 4px 0 #000}
#msg .t.big{color:var(--gold)}
#msg small{display:block;font-family:var(--ui);font-weight:800;font-size:clamp(11px,2.4cqw,24px);color:#fff;text-shadow:0 2px 4px #000;margin-top:.2em}
/* overlays */
.ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,20,.9),rgba(28,10,8,.92));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;padding:2.5cqw;font-size:clamp(11px,1.8cqw,17px);text-align:center;overflow:auto}
.ov h1{margin:0;font-family:var(--brush);font-weight:400;font-size:clamp(34px,9cqw,104px);letter-spacing:.06em;color:var(--gold);text-shadow:0 0 24px rgba(242,193,78,.5),0 5px 0 #5a1a0c;line-height:1}
.ov .sub{color:var(--dim);font-weight:700}
.pick{display:grid;grid-template-columns:4.5em repeat(4,1fr);gap:.6em;align-items:center;width:min(94%,720px)}
.pick .lb{color:var(--dim);text-align:right;font-weight:700}
.tb{font:inherit;color:var(--ink);background:linear-gradient(#1b2746,#111a33);border:1px solid var(--line);padding:.45em .3em;cursor:pointer;border-radius:6px;font-weight:700}
.tb .big{display:block;font-family:var(--brush);font-size:1.9em;line-height:1.1;font-weight:400}
.tb[aria-pressed="true"]{border-color:var(--gold);background:linear-gradient(var(--tc,#444),#0e1427);box-shadow:0 0 0 1px var(--gold),0 0 14px rgba(242,193,78,.35)}
.tb:focus-visible,.ob:focus-visible,.pb:focus-visible,#act:focus-visible,.go:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row2{display:flex;gap:.5em;align-items:center;flex-wrap:wrap;justify-content:center}
.row2 .lb{color:var(--dim);font-weight:700;margin-right:.3em}
.go{font:inherit;font-weight:800;font-size:1.35em;color:#1b0f05;background:linear-gradient(#ffd977,#d9a032);border:0;padding:.45em 1.8em;cursor:pointer;border-radius:8px;box-shadow:0 4px 0 #8a5a10,0 0 20px rgba(242,193,78,.35)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5a10}
#over table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-weight:700}
#over td,#over th{border:1px solid var(--line);padding:.25em .55em}
/* manager console */
#mgr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 16px;align-items:center;background:linear-gradient(#111b33,#0b1226);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
#mgr .who{font-weight:800;font-size:15px;white-space:nowrap}
#mgr .who small{display:block;color:var(--dim);font-weight:700;font-size:12px}
.orders{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.ob{font:inherit;font-weight:700;font-size:15px;color:var(--ink);background:linear-gradient(#1d2a4b,#141e38);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:42px}
.ob small{display:block;font-size:11px;color:var(--dim);font-weight:500}
.ob.on{border-color:var(--gold);background:linear-gradient(#5a4214,#2a1f0a);box-shadow:0 0 10px rgba(242,193,78,.35)}
.ob:disabled{opacity:.35;cursor:default}
.spd{display:flex;gap:4px}
.spd .ob{padding:8px 10px}
@media (max-width:640px){#mgr{grid-template-columns:1fr}.ob{font-size:13px;padding:6px 9px}}
#pad{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px}
.pb{font:inherit;font-weight:700;font-size:16px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;cursor:pointer;touch-action:none}
.pb.on,.pb:active{background:#2a3566;border-color:var(--gold)}
.types{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.types .pb{padding:8px 10px;min-width:64px}
#act{font:inherit;font-weight:800;font-size:19px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a5a,#b2301c);color:#fff;border:2px solid #ffb09a;box-shadow:0 5px 0 #6a1a0c;cursor:pointer;touch-action:none}
#act:active{transform:translateY(4px);box-shadow:0 1px 0 #6a1a0c}
.keys{color:var(--dim);font-size:13px;margin:0;text-align:center}
@media (max-width:480px){.dpad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px)}#act{width:84px;height:84px;font-size:16px}}
@media (prefers-reduced-motion:reduce){#msg{transition:none}}

/* ---- 運営画面 ----
   Layout: 上に題字と状況のピル、その下にタブ。ホームは「次にやること」のカードが主役、その下に週の報告とチーム力。
   試合中はタブを隠し、中継画面と指示パネルだけにする。 */
:root{
  --bg:#f3efe4; --surface:#fffdf7; --sunk:#e9e3d3; --ink:#1e2a22; --muted:#5f6a60; --line:#d8d0bc;
  --accent:#1f6a3a; --accent-ink:#ffffff; --gold2:#a07818; --warn:#c0453a;
  --f-disp:"Dela Gothic One","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121713; --surface:#1a211c; --sunk:#232c25; --ink:#e7ece4; --muted:#9aa69c; --line:#2f3a32;
  --accent:#3fa463; --accent-ink:#0c140e; --gold2:#d6b25c; --warn:#ff7a6a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121713; --surface:#1a211c; --sunk:#232c25; --ink:#e7ece4; --muted:#9aa69c; --line:#2f3a32;
  --accent:#3fa463; --accent-ink:#0c140e; --gold2:#d6b25c; --warn:#ff7a6a; color-scheme:dark}
html,body{height:auto;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-user-select:auto;user-select:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}
body.inmatch{background:radial-gradient(1200px 500px at 50% -10%,#14213f,#070b16 70%),#070b16;color:#f3f1ea}
#app{max-width:980px;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;border-bottom:1px solid var(--line);padding-bottom:10px}
body.inmatch header.top{display:none}
.brand{font-family:var(--f-disp);font-size:26px;line-height:1;letter-spacing:.06em;margin:0;color:var(--accent)}
.brand small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);letter-spacing:.1em;margin-top:4px}
#topinfo{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 11px;font-size:13px}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;padding:8px 14px 9px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:15px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
section{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{margin:0 0 8px;font-family:var(--f-disp);font-weight:400;font-size:18px}
.kick{margin:0;font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700}
.muted{color:var(--muted)}.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 18px;font-weight:700;font-size:15px;min-height:44px}
.btn.big{font-size:17px;padding:10px 24px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.next h2{margin:4px 0 6px;font-family:var(--f-disp);font-weight:400;font-size:clamp(22px,5vw,30px);line-height:1.25}
.next h2 small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);letter-spacing:.04em}
.next.tour{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.policies{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.pol{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-height:58px}
.pol b{font-size:15px}.pol small{font-size:12px;color:var(--muted);line-height:1.4}
.pol.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));box-shadow:0 0 0 1px var(--accent) inset}
.fatbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.sm{height:6px;width:56px;margin:auto}
.report ul{margin:6px 0 0;padding-left:1.2em}.report li{margin:2px 0}
.pw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0}
.pw>div{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2px 8px}
.pw span{font-size:13px;color:var(--muted)}.pw b{font-family:var(--f-disp);font-weight:400;font-size:22px;text-align:right}
.pw .bar{grid-column:1/-1}
@media (max-width:520px){.pw{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* 能力ランク（どちらのテーマでも読める色） */
.g-S{color:#e0245e}.g-A{color:#e85d1c}.g-B{color:#b88200}.g-C{color:#5f8f0a}.g-D{color:#1f9a58}.g-E{color:#1a7fb0}.g-F{color:#5a5fb0}.g-G{color:#888}
.gl{font-family:var(--f-disp);font-weight:400;font-size:15px;margin-right:3px}.gv{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 7px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.l,th.l{text-align:left}
td small.gr{display:block;font-size:11px;color:var(--muted)}
.roster tbody tr{cursor:pointer}.roster tr.sel td{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
tr.mine td,tr.mine th{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.ls th.l .sw{margin-right:6px;vertical-align:-1px}
#over th{background:none;color:#f3f1ea}
body.ontitle header.top{display:none}
.cond{font-size:12px;font-weight:700}.cond.c0{color:#5a4bb0}.cond.c1{color:#3a73b5}.cond.c2{color:var(--muted)}.cond.c3{color:#d97418}.cond.c4{color:#d2381f}
.hurt,.ace{font-size:11px;font-weight:700;padding:0 6px;border-radius:999px;color:#fff;background:var(--warn)}.ace{background:var(--accent);color:var(--accent-ink)}
.pd{display:flex;flex-direction:column;gap:10px}
.pd .who{display:flex;gap:12px;align-items:center}.pd .who small{display:block;color:var(--muted);font-size:12.5px}
.pd .big{font-family:var(--f-disp);font-weight:400;font-size:28px;line-height:1.1}
.emb{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--tc);color:#fff;font-family:var(--f-disp);font-size:24px;flex:none}
.emb.sm{width:40px;height:40px;font-size:18px}
.pd .bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto 2.2em;gap:6px 10px;align-items:center;max-width:460px}
.pd .bars span{font-size:13px;color:var(--muted)}.pd .bars b{font-family:var(--f-disp);font-weight:400}
.pd p{margin:0}
.games,.cal{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.games li,.cal li{padding:6px 2px;border-bottom:1px dashed var(--line);font-size:14px}
.games li.mine{font-weight:700;color:var(--accent)}
.games .r,.cal li span{display:inline-block;min-width:6.5em;color:var(--muted);font-size:12.5px}
.cal li.past{opacity:.55}.cal li.now{font-weight:700;color:var(--accent)}
/* タイトル */
.hero{padding:18px 0 4px}
.hero h1{margin:4px 0 8px;font-family:var(--f-disp);font-weight:400;font-size:clamp(44px,13vw,84px);line-height:1;letter-spacing:.06em;color:var(--accent)}
.hero .lead{margin:0;max-width:60ch;color:var(--muted)}
h2.sec{margin:6px 0 0;font-family:var(--f-disp);font-weight:400;font-size:20px}
.schools{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.school{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:12px;padding:12px}
.school:hover{border-color:var(--tc)}
.school .emb{grid-row:span 3;width:48px;height:48px}
.school .sn{font-family:var(--f-disp);font-size:20px;line-height:1.2}.school .sn small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:8px}
.school .mt{font-size:12.5px;color:var(--muted);line-height:1.45}
.cont{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.cont p{margin:0}
.note{font-size:12.5px;color:var(--muted)}
/* 試合画面 */
#v-match{gap:10px}
#mgr{grid-template-columns:auto minmax(0,1fr)}
#mgr .spd{grid-column:1/-1;flex-wrap:wrap}
.ob{color:#f3f1ea}
#over table td,#over table th{color:#f3f1ea}
.keys{color:#97a3c0}
@media (max-width:640px){#mgr{grid-template-columns:1fr}#screen{aspect-ratio:4/3}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <p class="brand">白球ナイン<small>四国高校野球 監督物語</small></p>
    <div id="topinfo"></div>
  </header>

function simPath(v0,noFence){

  let best=null;

      if(q.t<f.react||q.y>2.5)continue;

  return best;
}

/* ---------- レンダラー・球場（昼の試合と、照明をつけたナイター） ---------- */
const cv=document.getElementById('cv');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xbcd6f0,260,700);
const camera=new THREE.PerspectiveCamera(40,16/9,0.4,1200);
let composer=null,bloom=null;
function fit(){const w=cv.clientWidth||960,h=cv.clientHeight||540;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  if(composer){composer.setSize(w,h);}}
try{if(THREE.EffectComposer&&THREE.UnrealBloomPass){composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,camera));
  bloom=new THREE.UnrealBloomPass(new THREE.Vector2(960,540),0.42,0.3,0.93);composer.addPass(bloom);}}catch(e){composer=null;}

/* ---------- サウンド：Web Audioで合成した球場音＋ブラウザ読み上げの実況・審判コール ---------- */
const SND=(function(){
  let ctx=null,master=null,crowdG=null,roarG=null,on=true,voice=null;
  function noiseBuf(sec,color){
    const n=Math.floor(ctx.sampleRate*sec),b=ctx.createBuffer(2,n,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);let last=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;if(color==='brown'){last=(last+0.02*w)/1.02;d[i]=last*3.5;}else d[i]=w;}}
    return b;
  }
  function init(){
    if(ctx){if(ctx.state==='suspended')ctx.resume();return;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ctx=new AC();master=ctx.createGain();master.gain.value=on?0.9:0;
    const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
    // 観客のざわめき（ブラウンノイズ＋話し声帯域）
    const base=ctx.createBufferSource();base.buffer=noiseBuf(5,'brown');base.loop=true;
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=520;bp.Q.value=0.6;
    crowdG=ctx.createGain();crowdG.gain.value=0.16;base.connect(bp);bp.connect(crowdG);crowdG.connect(master);base.start();
    const wn=ctx.createBufferSource();wn.buffer=noiseBuf(4,'white');wn.loop=true;
    const bp2=ctx.createBiquadFilter();bp2.type='bandpass';bp2.frequency.value=1400;bp2.Q.value=0.9;
    const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=0.35;lg.gain.value=500;lfo.connect(lg);lg.connect(bp2.frequency);lfo.start();
    roarG=ctx.createGain();roarG.gain.value=0.0;wn.connect(bp2);bp2.connect(roarG);roarG.connect(master);wn.start();
    pickVoice();if(window.speechSynthesis)speechSynthesis.onvoiceschanged=pickVoice;
  }
  function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));voice=vs.find(v=>/male|男|Otoya|Ichiro|Keita/i.test(v.name))||vs[0]||null;}catch(e){voice=null;}}
  const now=()=>ctx.currentTime;
  function env(g,t,a,peak,d){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);}
  function burst(dur,type,freq,q,peak,t){
    const s=ctx.createBufferSource();s.buffer=noiseBuf(Math.max(0.05,dur),'white');const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
    const g=ctx.createGain();s.connect(f);f.connect(g);g.connect(master);env(g,t,0.002,peak,dur);s.start(t);s.stop(t+dur+0.05);
  }
  function tone(type,f0,f1,dur,peak,t){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    o.connect(g);g.connect(master);env(g,t,0.003,peak,dur);o.start(t);o.stop(t+dur+0.05);}
  return {
    init,
    get on(){return on;},
    toggle(){on=!on;if(master)master.gain.value=on?0.9:0;if(!on&&window.speechSynthesis)speechSynthesis.cancel();return on;},
    crack(p){if(!ctx)return;const t=now();burst(0.05,'highpass',1800,0.7,0.9*p+0.2,t);tone('triangle',2100,700,0.07,0.35*p+0.1,t);tone('sine',140,60,0.12,0.5*p,t);},
    mitt(){if(!ctx)return;const t=now();burst(0.035,'lowpass',1100,0.8,0.7,t);tone('sine',190,80,0.08,0.45,t);},
    whoosh(){if(!ctx)return;const t=now();const s=ctx.createBufferSource();s.buffer=noiseBuf(0.3,'white');const f=ctx.createBiquadFilter();f.type='bandpass';f.Q.value=2;
      f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(2400,t+0.25);const g=ctx.createGain();s.connect(f);f.connect(g);g.connect(master);env(g,t,0.05,0.12,0.22);s.start(t);},
    crowd(level,dur){if(!ctx)return;const t=now();const g=roarG.gain;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(0.5*level,t+0.25);g.linearRampToValueAtTime(0.02,t+0.25+dur);
      crowdG.gain.cancelScheduledValues(t);crowdG.gain.setValueAtTime(crowdG.gain.value,t);crowdG.gain.linearRampToValueAtTime(0.16+0.25*level,t+0.2);crowdG.gain.linearRampToValueAtTime(0.16,t+0.2+dur);},
    organ(notes,step){if(!ctx)return;let t=now()+0.05;for(const n of notes){if(n){const f=440*Math.pow(2,(n-69)/12);for(const [m,v] of [[1,0.16],[2,0.08],[3,0.05],[4,0.03]])tone('sine',f*m,f*m,step*0.9,v,t);}t+=step;}},
    fanfare(){if(!ctx)return;let t=now()+0.1;const seq=[[67,71,74],[67,71,74],[67,71,74],[72,76,79]],dur=[0.16,0.16,0.16,0.9];
      seq.forEach((ch,i)=>{ch.forEach(n=>{const f=440*Math.pow(2,(n-69)/12),o=ctx.createOscillator(),lp=ctx.createBiquadFilter(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=f;lp.type='lowpass';lp.frequency.setValueAtTime(900,t);lp.frequency.linearRampToValueAtTime(2600,t+0.08);
        o.connect(lp);lp.connect(g);g.connect(master);env(g,t,0.02,0.07,dur[i]);o.start(t);o.stop(t+dur[i]+0.1);});t+=dur[i]+0.04;});},
    siren(){if(!ctx)return;const t=now()+0.05,o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;
      o.type='sawtooth';o2.type='square';[o,o2].forEach((x,i)=>{x.frequency.setValueAtTime(220*(i?1.004:1),t);x.frequency.exponentialRampToValueAtTime(560*(i?1.004:1),t+1.2);x.frequency.setValueAtTime(560*(i?1.004:1),t+2.4);x.frequency.exponentialRampToValueAtTime(260,t+3.4);x.connect(lp);x.start(t);x.stop(t+3.5);});
      lp.connect(g);g.connect(master);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.05,t+0.5);g.gain.setValueAtTime(0.05,t+2.6);g.gain.exponentialRampToValueAtTime(0.0001,t+3.45);},
    say(text,rate,ump){if(!on||!window.speechSynthesis||(typeof G!=='undefined'&&(G.speed>=4||G.sim)&&!ump))return;text=yomi(text);try{
      if(ump)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';if(voice)u.voice=voice;u.rate=(rate||1.15)*(typeof G!=='undefined'?Math.min(1.5,Math.sqrt(G.speed||1)):1);u.pitch=ump?0.8:1.05;u.volume=1;speechSynthesis.speak(u);}catch(e){}}
  };
})();

/* ---------- 選手モデル：高校球児（帽子・ユニフォーム・アンダーシャツ・ストッキング・スパイク）。顔立ちと体格は名前から決める ---------- */
const PLAYER3D=(function(){
  const PI=Math.PI,TAU=Math.PI*2;
  const gradTex=(function(){const d=new Uint8Array([70,130,200,255]);const t=new THREE.DataTexture(d,4,1,THREE.LuminanceFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t;})();
  const OLM=new THREE.MeshBasicMaterial({color:0x000000,side:THREE.BackSide});
  const mcache={};
  function M(c){const k='T'+c;if(!mcache[k])mcache[k]=new THREE.MeshToonMaterial({color:c,gradientMap:gradTex});return mcache[k];}
  function mk(geo,mat,x,y,z,ol){const o=new THREE.Mesh(geo,mat);o.position.set(x||0,y||0,z||0);if(ol){const l=new THREE.Mesh(geo,OLM);l.scale.setScalar(ol);o.add(l);}return o;}
  const cylG=(r1,r2,h,s)=>new THREE.CylinderGeometry(r1,r2,h,Math.round((s||8)*1.6));
  const sphG=(r,s)=>{const n=Math.round((s||10)*1.6);return new THREE.SphereGeometry(r,n,Math.max(6,n-2));};
  const boxG=(x,y,z)=>new THREE.BoxGeometry(x,y,z);
  // 顔立ち（四国カルチョと同じ「名前から決める」方式）。高校球児なので髪は短め
  const HCOL=[0x18110d,0x18110d,0x221812,0x2e2016,0x18110d,0x3a2a1c];
  const SKIN=[0xeac3a2,0xe5b895,0xe0b090,0xd89a74,0xd08a64,0xe5b895];
  function lookOf(name){let x=7;for(const ch of String(name))x=(x*131+ch.charCodeAt(0))>>>0;const r=n=>{x=(x*1103515245+12345)>>>0;return(x>>>8)%n;};
    return{hair:HCOL[r(HCOL.length)],sk:SKIN[r(SKIN.length)],sc:.95+r(10)/100,w:.9+r(24)/100,brow:r(3)};}
  // 胸のマーク・背番号はキャンバスで描いた板を貼る
  const texCache={};
  function labelTex(text,fg,bg,font){const k=text+fg+bg+font;if(texCache[k])return texCache[k];const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
    if(bg){g.fillStyle=bg;g.fillRect(0,0,128,128);}g.fillStyle=fg;g.font=font;g.textAlign='center';g.textBaseline='middle';g.fillText(text,64,68);
    const t=new THREE.CanvasTexture(c);t.anisotropy=4;return texCache[k]=t;}
  function makeFace(head,hr,L,skin){
    const white=M(0xf4efe6),dkc=M(0x120a08),brw=M(L.hair),lipc=M(0x9a4a3a);
    [1,-1].forEach(s=>{const eg=new THREE.Group();eg.position.set(hr*.85,0,s*hr*.38);head.add(eg);
      const w=mk(sphG(hr*.19,10),white);w.scale.set(.5,.8,1.1);eg.add(w);
      const p=mk(sphG(hr*.1,8),dkc,hr*.07,-hr*.01,s*hr*.01);p.scale.set(.55,1,1);eg.add(p);
      const br=mk(boxG(hr*.1,hr*.07,hr*.36),brw,hr*.93,hr*.27,s*hr*.4);br.rotation.x=s*(L.brow-1)*.12;head.add(br);});
    const nose=mk(new THREE.ConeGeometry(hr*.11,hr*.3,4),skin,hr*.99,-hr*.2,0);nose.rotation.z=-PI/2+.18;nose.scale.z=.8;head.add(nose);
    head.add(mk(boxG(hr*.07,hr*.06,hr*.32),lipc,hr*.9,-hr*.52,0));
    [1,-1].forEach(s=>{const e=mk(sphG(hr*.17,8),skin,-hr*.02,0,s*hr*.97);e.scale.set(.5,1,.4);head.add(e);});
    const jaw=mk(sphG(hr*.6,10),skin,hr*.28,-hr*.55,0);jaw.scale.set(.8,.62,.78);head.add(jaw);
  }
  /* kit: {cap, shirt, trim, under, pants, sock, mark, markCol}  num: 背番号 */
  function build(name,kit,num){
    const L=lookOf(name),U=L.sc,ww=Math.sqrt(L.w);
    const f={L,U};
    const shirt=M(kit.shirt),trim=M(kit.trim),under=M(kit.under),pants=M(kit.pants),sock=M(kit.sock),cap=M(kit.cap),skin=M(L.sk),belt=M(0x1a1a1e),shoe=M(0x111114);
    const wrap=new THREE.Group(),root=new THREE.Group(),pelvis=new THREE.Group(),torso=new THREE.Group();
    wrap.add(root);root.rotation.y=-PI/2;root.add(pelvis);pelvis.add(torso);
    pelvis.position.y=.9*U;
    pelvis.add(mk(cylG(.17*U*ww,.18*U*ww,.22*U,10),pants,0,-.02*U,0,1.06));
    pelvis.add(mk(cylG(.175*U*ww,.175*U*ww,.05*U,12),belt,0,.1*U,0,1.05));
    torso.rotation.order='YZX';torso.position.y=.09*U;
    torso.add(mk(cylG(.16*U*ww,.17*U*ww,.26*U,10),shirt,0,.12*U,0,1.07));
    const chest=mk(cylG(.24*U*ww,.18*U*ww,.42*U,10),shirt,0,.45*U,0,1.05);chest.scale.z=.8;torso.add(chest);
    torso.add(mk(boxG(.012*U,.62*U,.03*U),trim,.205*U*ww,.34*U,0));          // 前立てのライン
    torso.add(mk(cylG(.12*U,.15*U,.06*U,10),trim,0,.66*U,0,1.07));          // 襟
    // 胸の校名マーク・背番号
    const mark=mk(new THREE.PlaneGeometry(.26*U*ww,.26*U),new THREE.MeshBasicMaterial({map:labelTex(kit.mark,kit.markCol,null,'900 96px "Dela Gothic One","Hiragino Kaku Gothic ProN",sans-serif'),transparent:true}),.214*U*ww,.5*U,0);
    mark.rotation.y=PI/2;torso.add(mark);
    if(num){const nb=mk(new THREE.PlaneGeometry(.3*U*ww,.3*U),new THREE.MeshBasicMaterial({map:labelTex(String(num),kit.markCol,null,'800 92px "M PLUS 1p",sans-serif'),transparent:true}),-.216*U*ww,.46*U,0);nb.rotation.y=-PI/2;torso.add(nb);}
    function limbArm(side){
      const sh=new THREE.Group();sh.position.set(0,.58*U,side*.235*U*ww);torso.add(sh);
      const L1=.3*U,L2=.3*U;
      sh.add(mk(sphG(.075*U),shirt,0,0,0,1.07));
      sh.add(mk(cylG(.07*U,.06*U,L1*.55,8),shirt,0,-L1*.25,0,1.12));      // 半袖
      sh.add(mk(cylG(.055*U,.05*U,L1,8),under,0,-L1/2,0,1.14));           // アンダーシャツ
      const el=new THREE.Group();el.position.y=-L1;sh.add(el);
      el.add(mk(sphG(.052*U),under,0,0,0));
      el.add(mk(cylG(.05*U,.042*U,L2,8),under,0,-L2/2,0,1.16));
      const hand=new THREE.Group();hand.position.y=-L2;el.add(hand);
      hand.add(mk(sphG(.055*U),skin,0,0,0,1.2));
      return{sh,el,hand,side,L1,L2};
    }
    f.armR=limbArm(1);f.armL=limbArm(-1);
    const head=new THREE.Group();head.position.y=.84*U;torso.add(head);
    torso.add(mk(cylG(.05*U,.06*U,.1*U,8),skin,0,.72*U,0));
    const hr=.142*U;
    const face=mk(sphG(hr,12),skin,0,0,0,1.06);face.scale.set(1,1.06,.96);head.add(face);
    makeFace(head,hr,L,skin);head.scale.setScalar(1.08);
    head.add(mk(new THREE.SphereGeometry(hr*1.04,16,10,0,TAU,0,PI*.5),M(L.hair),-hr*.04,hr*.0,0,1.04));   // 短髪
    // 帽子（ヘルメット兼用）とつば
    head.add(mk(new THREE.SphereGeometry(hr*1.1,18,10,0,TAU,0,PI*.47),cap,-hr*.02,hr*.12,0,1.05));
    const brim=mk(new THREE.CylinderGeometry(hr*.62,hr*.62,.012*U,16,1,false,-PI/2,PI),cap,hr*.82,hr*.3,0,1.1);brim.scale.set(1.1,1,1.25);brim.rotation.z=-.12;head.add(brim);
    head.add(mk(sphG(hr*.12,6),M(kit.trim),-hr*.02,hr*1.2,0));
    function limbLeg(side){
      const hp=new THREE.Group();hp.position.set(0,-.02*U,side*.1*U*ww);pelvis.add(hp);
      const L1=.46*U,L2=.46*U;
      hp.add(mk(sphG(.095*U),pants,0,0,0));
      hp.add(mk(cylG(.095*U,.075*U,L1,8),pants,0,-L1/2,0,1.12));
      const kn=new THREE.Group();kn.position.y=-L1;hp.add(kn);
      kn.add(mk(sphG(.078*U),pants,0,0,0,1.08));
      kn.add(mk(cylG(.074*U,.06*U,L2*.3,8),pants,0,-L2*.12,0,1.1));       // 膝下までのズボン
      kn.add(mk(cylG(.06*U,.05*U,L2*.72,8),sock,0,-L2*.6,0,1.14));        // ストッキング
      const ft=new THREE.Group();ft.position.y=-L2;kn.add(ft);
      ft.add(mk(boxG(.27*U,.075*U,.11*U),shoe,.07*U,-.02*U,0,1.14));
      return{hp,kn,ft,side};
    }
    f.legF=limbLeg(-1);f.legB=limbLeg(1);
    f.root=root;f.pelvis=pelvis;f.torso=torso;f.head=head;f.hip0=pelvis.position.y;
    const glove=mk(sphG(.085*U,10),M(0x8a4a1a),0,-.05*U,0,1.08);glove.scale.set(1.25,.6,1.3);f.armL.hand.add(glove);
    const gl2=mk(boxG(.03*U,.12*U,.16*U),M(0x6a3410),0,-.09*U,0,1.08);f.armL.hand.add(gl2);f.glove=[glove,gl2];
    const glR=glove.clone(),gl2R=gl2.clone();f.armR.hand.add(glR);f.armR.hand.add(gl2R);f.gloveR=[glR,gl2R];
    wrap.traverse(m=>{if(m.isMesh&&m.material!==OLM&&!m.material.map)m.castShadow=true;});
    const blob=new THREE.Mesh(new THREE.CircleGeometry(.42*U,16),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.16,depthWrite:false}));
    blob.rotation.x=-PI/2;blob.position.y=.03;wrap.add(blob);
    wrap.userData.f=f;
    return wrap;
  }
  function dispose(w){scene.remove(w);w.traverse(m=>{if(m.isMesh&&m.geometry)m.geometry.dispose();});}
  return{build,dispose};
})();
// 試合に出る選手のモデルを作る（試合が終わったら片付ける）

/* ---------- 結果だけの高速シミュレーション（観戦しない試合・「結果まで飛ばす」） ---------- */
const rand=Math.random;
function simPA(){
  autoRelief();
  const b=curBatter(),pt=curPitcher(),pit=pt.pit,def=teamIdx(defense()),o=offense();
  const cat=fieldOf(def).find(p=>p.pos==='捕');

  const r1=G.bases[0];
  if(r1&&!G.bases[1]&&r1.s>=62&&G.outs<2&&rand()<0.1){
    const ok=rand()<clamp(0.42+(r1.s-60)*0.013-(cat.a-60)*0.008,0.12,0.92);G.bases[0]=null;
    if(ok){G.bases[1]=r1;box(r1).sb++;}else{G.outs++;box(pt).po++;if(G.outs>=3)return;}
  }
  // 送りバント
  if((G.bases[0]||G.bases[1])&&!G.bases[2]&&G.outs===0&&b.p<52&&Math.abs(G.score[0]-G.score[1])<=2&&rand()<0.45){
    pt.pcount+=3;
    if(rand()<0.78){const nb=[null,G.bases[0],G.bases[1]];G.bases=nb;G.outs++;box(pt).po++;return;}
    G.bases=[b,G.bases[1],null];G.outs++;box(pt).po++;box(b).ab++;return;
  }
  const fat=fatigue();
  pt.pcount+=3+Math.floor(rand()*3);
  const B=b.m*0.55+b.p*0.45,Pq=pit.vel*0.36+pit.ctl*0.32+pit.brk*0.32-fat*0.45;
  const diff=(B-Pq)/100;

  const pBB=clamp(0.08-(pit.ctl-50)*0.0012+fat*0.0012,0.03,0.17),pK=clamp(0.18-diff*0.4,0.05,0.4);
  const r=rand(),bx=box(b),px=box(pt);
  const runs=n=>{if(!n)return;G.score[o]+=n;G.line[o][G.inning-1]=(G.line[o][G.inning-1]||0)+n;bx.rbi+=n;px.pr+=n;};
  if(r<pBB){bx.bb++;px.pbb++;const nb=[...G.bases];let n=0;if(nb[0]){if(nb[1]){if(nb[2])n++;nb[2]=nb[1];}nb[1]=nb[0];}nb[0]=b;G.bases=nb;runs(n);return;}
  bx.ab++;
  if(r<pBB+pK){bx.k++;px.pk++;G.outs++;px.po++;return;}
  const pHit=clamp(0.272+diff*0.4-dd*0.15+(b.s-50)*0.0012,0.14,0.45);
  if(rand()<pHit){
    bx.h++;G.hits[o]++;
    const hs=clamp(0.025+(b.p-50)*0.004,0.004,0.22)*3.2/(FENCE_H+0.2),ts=0.02*(b.s/50),ds=clamp(0.17+(b.p-50)*0.002,0.08,0.3),q=rand();
    const [B1,B2,B3]=G.bases,sp=x=>x?(x.s-50)*0.005:0;
    if(q<hs){bx.hr++;runs(1+[B1,B2,B3].filter(Boolean).length);G.bases=[null,null,null];return;}
    if(q<hs+ts){runs([B1,B2,B3].filter(Boolean).length);G.bases=[null,null,b];return;}
    if(q<hs+ts+ds){let n=(B3?1:0)+(B2?1:0),n3=null;if(B1){if(rand()<0.42+sp(B1))n++;else n3=B1;}runs(n);G.bases=[null,b,n3];return;}
    let n=B3?1:0,nb=[b,null,null];
    if(B2){if(rand()<0.55+sp(B2)||G.outs===2)n++;else nb[2]=B2;}
    if(B1){if(!nb[2]&&rand()<0.28+sp(B1))nb[2]=B1;else nb[1]=B1;}

  }

  const kind=rand();

    if(G.bases[0]&&G.outs<2&&rand()<0.32-(b.s-50)*0.004){G.outs+=2;px.po+=2;G.bases[0]=null;if(G.outs>=3)return;}
    else{G.outs++;px.po++;if(G.outs>=3)return;const nb=[...G.bases];let n=0;
      if(nb[2]&&rand()<0.45){n++;nb[2]=null;}if(nb[1]&&!nb[2]&&rand()<0.5){nb[2]=nb[1];nb[1]=null;}if(nb[0]&&!nb[1]){nb[1]=nb[0];nb[0]=null;}G.bases=nb;runs(n);return;}
    const nb=[...G.bases];if(nb[2]&&G.outs<3&&rand()<0.3){runs(1);nb[2]=null;}G.bases=nb;return;
  }
  G.outs++;px.po++;

function simRest(){

function fatigue(){const p=curPitcher();return Math.max(0,(p.pcount||0)-(48+p.pit.sta*0.9));}

  G.pitch={type,T,t:-WIND,x0:-0.24,y0:1.95,z0:-17.3,xt,yt,bx,by,kmh,swung:false,swingT:0,hit:null,released:false};

function pitchPos(pc,u){

const inZone=(x,y)=>Math.abs(x)<=ZX+0.05&&y>=ZY0-0.05&&y<=ZY1+0.05;
function cpuPitch(){

function cpuDecide(pc){

function makeHit(b,h){

/* ---------- 打球処理：捕球（好守）→ 送球 → 走者との競争 → 塁審のコール ---------- */
const OF='左中右';
const bDist=(x,z,j)=>Math.hypot(x-BASES[j][0],z-BASES[j][1]);
function planCatch(s,fs){
  if(s.hr){
    const q=s.pts.find(p=>p.t>=s.hrT)||s.pts[s.pts.length-1];
    if(s.hrY<FENCE_H+1.4){for(const f of fs){if(!OF.includes(f.pl.pos))continue;const need=Math.hypot(q.x-f.x,q.z-f.z)-f.reach;
      if(need<=f.speed*(s.hrT-f.react)&&Math.random()<clamp(0.2+f.pl.d*0.005-(s.hrY-FENCE_H-0.2)*0.3,0.05,0.7))
        return{mode:'wall',f,t:s.hrT,x:q.x*0.985,z:q.z*0.985,y:s.hrY,air:true,fine:true,robHR:true};}}
    return{mode:'hr'};
  }
  const n=intercept(s.pts,fs);
  if(n.air)return Object.assign({mode:'catch'},n);
  if(s.wallT&&s.wallY>FENCE_H-0.8){const q=s.pts.find(p=>p.t>=s.wallT);
    for(const f of fs){if(!OF.includes(f.pl.pos))continue;const need=Math.hypot(q.x-f.x,q.z-f.z)-f.reach;
      if(need<=f.speed*(s.wallT-f.react)&&Math.random()<0.25+f.pl.d*0.004)return{mode:'wall',f,t:s.wallT,x:q.x,z:q.z,y:s.wallY,air:true,fine:true};}}
  let dv=null;
  for(const f of fs){for(const q of s.pts){
    if(q.t<f.react||q.y>2.0||(!q.air&&q.y>0.7))continue;
    const need=Math.hypot(q.x-f.x,q.z-f.z)-f.reach,can=f.speed*(q.t-f.react);
    if(need<=can)break;
    if(need<=can+f.dive){if((q.air||q.t<n.t-0.35)&&(!dv||q.t<dv.t))dv={f,t:q.t,x:q.x,z:q.z,air:q.air,short:(need-can)/f.dive};break;}}}
  if(dv){
    const ps=clamp(0.1+dv.f.pl.d*0.006-dv.short*0.3,0.08,0.8);
    if(Math.random()<ps)return Object.assign({mode:dv.air?'dive':'divestop',fine:true},dv);
    const fs2=fs.map(f=>f===dv.f?Object.assign({},f,{react:dv.t+1.4,x:dv.x,z:dv.z}):f);

function coverOf(j,thrower){

}
function resolvePlay(plan,s,b,pc,h){

function refreshMgr(){
  if(!G.away||G.phase==='idle')return;

function drawBoard(){

  g.fillStyle='#0a0f17';g.fillRect(0,0,W,H);
  g.fillStyle='#f2c14e';g.font='800 40px "M PLUS 1p",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText((G.M&&G.M.title)||'白 球 ナ イ ン',W/2,38);
  const n=Math.max(9,G.inning||0),x0=170,cw=(W-x0-170)/n;
  g.font='700 30px "M PLUS 1p",sans-serif';g.fillStyle='#8a93a8';
  for(let i=0;i<n;i++)g.fillText(i+1,x0+cw*(i+.5),92);g.fillText('R',W-120,92);g.fillText('H',W-55,92);
  if(G.away){[G.away,G.home].forEach((t,r)=>{const y=145+r*62;g.fillStyle=t.color;g.fillRect(24,y-24,10,48);
    g.fillStyle='#ffffff';g.font='800 38px "M PLUS 1p",sans-serif';g.textAlign='left';g.fillText(t.short,46,y);g.textAlign='center';

    g.fillStyle='#ffffff';g.font='800 40px "M PLUS 1p",sans-serif';g.fillText(G.score[r],W-120,y);g.fillText(G.hits[r],W-55,y);});

    lamp('B',G.balls,3,'#3fd36b',46);lamp('S',G.strikes,2,'#f2c14e',236);lamp('O',G.outs,2,'#e2513b',386);

  }

let camMode='tv';const camPos=new THREE.Vector3(),camLook=new THREE.Vector3();
function setCam(m){camMode=m;if(fielders['捕'])fielders['捕'].visible=m!=='plate';
  if(m==='plate'){camera.fov=24;camPos.set(0,2.1,7.2);camLook.set(0,0.85,-18.4);}
  else if(m==='tv'){camera.fov=10;camPos.set(3.6,6.0,-52);camLook.set(-0.45,1.0,0);}
  else if(m==='follow'){camera.fov=40;camPos.set(0,9,17);camLook.set(0,1.5,-15);}
  camera.updateProjectionMatrix();camera.position.copy(camPos);camera.lookAt(camLook);aimLight(0,-8);}
function updateCam(dt){
  if(camMode!=='follow')return;
  const P=G.play,cut=P&&P.cuts&&P.cuts.find(c=>P.t>=c.t0&&P.t<=c.t1);
  if(cut){let dx=cut.x,dz=cut.z+19.4,l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;
    if(cut.kind==='base'){camPos.set(cut.x+dx*6.5-dz*2.5,2.4,cut.z+dz*6.5+dx*2.5);camLook.set(cut.x,0.8,cut.z);}
    else{const hx=-cut.x,hz=-cut.z,hl=Math.hypot(hx,hz)||1;camPos.set(cut.x+hx/hl*10,3.2,cut.z+hz/hl*10);camLook.set(cut.x,1.2,cut.z);}
    camera.fov=34;camera.updateProjectionMatrix();camera.position.copy(camPos);camera.lookAt(camLook);aimLight(cut.x,cut.z);P.wasCut=true;return;}
  if(P&&P.wasCut){P.wasCut=false;camera.fov=40;camera.updateProjectionMatrix();}
  const b=ball.position,d=Math.hypot(b.x,b.z);
  const tp=new THREE.Vector3(b.x*0.3,7+d*0.14,15+b.z*0.22),k=1-Math.pow(0.05,dt);
  camPos.lerp(tp,k);camLook.lerp(new THREE.Vector3(b.x,Math.max(0.5,b.y*0.6),b.z),Math.min(1,k*1.8));
  camera.position.copy(camPos);camera.lookAt(camLook);
  aimLight(camLook.x*0.8,camLook.z*0.8);
}

/* ---------- メインループ ---------- */
let last=performance.now(),demoT=0;
function updatePitch(dt){
  const pc=G.pitch;pc.t+=dt;
  const pm=fielders['投'],pf=pm.userData.f;
  const u=pc.t<0?(pc.t+WIND)/WIND:1+Math.min(0.45,pc.t*1.2);
  posePitcher(pm,u);
  const th=pf[tArm(pm)];
  if(pc.t<0){th.hand.getWorldPosition(_w1);ball.visible=true;ball.position.copy(_w1);ballShadow.visible=false;trailPush(false);}
  else{
    if(!pc.released){pc.released=true;th.hand.getWorldPosition(_w1);pc.x0=_w1.x;pc.y0=_w1.y;pc.z0=_w1.z;trailReset();SND.whoosh();}
    if(!pc.popped&&!pc.hit&&pc.t>=pc.T){pc.popped=true;SND.mitt();}
    const v=pc.t/pc.T;
    const q=v<=1?pitchPos(pc,v):(()=>{const e=pitchPos(pc,1);return{x:e.x,y:Math.max(0.3,e.y-(v-1)*0.6),z:Math.min(0.9,(v-1)*pc.T*30)};})();
    ball.visible=true;ball.position.set(q.x,q.y,q.z);ballAt(q);trailPush(true);
  }
  // 捕手のミット
  if(fielders['捕']&&pc.t>-0.4){const c=fielders['捕'];_w1.set(pc.xt*0.9,Math.max(0.35,pc.yt),0.45);armTo(c,gArm(c),_w1,new THREE.Vector3(c.userData.lefty?-1:1,-1,0));}
  // 盗塁の走者
  if(pc.steal&&pc.t>-0.35){const m=pc.steal.r.model,s=SEG*1+0+Math.max(0,pc.t+0.35)*(7+pc.steal.r.s*0.035);setOnPath(m,Math.min(s,2*SEG-0.6));pose(m,pc.t,0.8);}
  // 打者
  if(!userBatting()&&pc.cpuSwing&&!pc.swung&&pc.t>=pc.T-SWC){pc.swung=true;pc.swingT=pc.t;if(pc.cpuContact&&pc.cpuHit)pc.hit=pc.cpuHit;}
  if(pc.bunt){poseBatter(BUNT);}
  else if(pc.swung){poseBatter(sampleKeys(SWK,clamp((pc.t-pc.swingT)/SWING_DUR,0,1),'k'));}
  else{const w=pc.t<-0.4?Math.sin(pc.t*9)*0.04:0;const S=Object.assign({},SWK[0]);S.d=[S.d[0]+w,S.d[1],S.d[2]-w];if(pc.t>-0.35&&pc.t<0.2){const k=clamp((pc.t+0.35)/0.4,0,1)*0.35;Object.assign(S,sampleKeys(SWK,k*0.22/0.35,'k'));}poseBatter(S);}
  if(pc.hit&&pc.t>=Math.max(pc.T,pc.swingT+SWC))startPlay(pc.hit);
  else if(!pc.hit&&pc.t>=pc.T+(pc.steal?0.75:0.35))resolveNoContact();
  else if(pc.steal&&!pc.hit&&pc.t>pc.T+0.05){const u2=clamp((pc.t-pc.T-0.05)/0.62,0,1);ball.position.set(BASES[2][0]*u2,1.5+Math.sin(Math.PI*u2)*2.2,0.9+(BASES[2][1]-0.9)*u2);ballAt(ball.position);}
}
function loop(now){
  const rdt=Math.min(0.05,(now-last)/1000);last=now;
  if(!stageOn()){requestAnimationFrame(loop);return;}
  const dt=rdt*(G.phase==='idle'||G.phase==='over'?1:tscale())*(G.phase==='play'?playScale(G.play):1);
  if(G.phase==='idle'||G.phase==='over'||G.phase==='sim'){demoT+=rdt;if(camera.fov!==38){camera.fov=38;camera.updateProjectionMatrix();}
    camera.position.set(Math.sin(demoT*0.12)*58,22,Math.cos(demoT*0.12)*58-30);camera.lookAt(0,1,-22);aimLight(0,-18);}
  else{
    if(G.phase==='ready'){G.readyT+=dt;
      if(!userPitching()&&G.readyT>1.1){
        if(defOrd()==='walk'){if(usDef())G.ord.def='auto';G.cpuOrd.def='auto';walk(true);}
        else cpuPitch();}
      else{const w=Math.sin(G.readyT*2.2)*0.03,S=Object.assign({},offOrd()==='bunt'?BUNT:SWK[0]);S.d=[S.d[0]+w,S.d[1],S.d[2]];poseBatter(S);}
    }
    if(G.phase==='pitch')updatePitch(dt);
    if(G.phase==='play')updatePlay(dt);
    updateCam(dt);
  }
  renderFrame();
  requestAnimationFrame(loop);
}

    const p={name:x.name,yomi:YOMI[x.name],ep:x.ep,grade:g,m:hsMap(te*.6+me*.4,g),p:hsMap(k*.5+ph*.5,g),s:hsMap(sp,g),a:hsMap(k*.4+ph*.3+st*.3,g),d:hsMap(ju*.4+te*.3+me*.3,g),pot:clamp(1+(30-x.age)*0.02+(Object.values(STAR_OF).includes(x.name)?0.22:0),0.8,1.45),pit:null,pos:''};

}

function genPlayer(name,yomi,grade,base,pos,pot){
  const g=()=>clamp(Math.round(base+gauss()*7),5,95);
  const p={name,yomi,grade,m:g(),p:g(),s:g(),a:g(),d:g(),pot:pot||clamp(0.95+gauss()*0.15,0.75,1.4),pit:null,pos};

}

function makeRookies(t,rank,count){

/* ---------- 打順・守備位置 ---------- */
function chooseStarter(t,av){
  const ps=av.filter(p=>p.pit);
  if(t.key===S.my&&S.ace){const a=ps.find(p=>p.id===S.ace);if(a&&a.tired<45)return a;}
  ps.sort((a,b)=>pitV(b)*(1-a.tired*0)*(1-b.tired/110)-pitV(a)*(1-a.tired/110));
  return ps[0]||av.slice().sort((a,b)=>b.a-a.a)[0];
}
function autoLineup(t){
  let av=t.players.filter(p=>!p.hurt);if(av.length<9)av=t.players.slice();
  const sp=chooseStarter(t,av),used=new Set([sp]),lu=[{p:sp,pos:'投'}];
  for(const pos of ['捕','遊','二','中','三','右','左','一']){
    let b=null,bv=-1e9;
    for(const p of av){if(used.has(p))continue;
      const v=FIT[pos](p)*0.55+batV(p)*0.45+(p.pos===pos?9:0)-(pos==='捕'&&p.pos!=='捕'?14:0)-(p.pit?16:0);
      if(v>bv){bv=v;b=p;}}
    if(b){used.add(b);lu.push({p:b,pos});}
  }
  // DH：守備につかない打撃専門（投手は打席に立たない）
  {let b=null,bv=-1e9;for(const p of av){if(used.has(p))continue;const v=batV(p)-(p.pit?20:0);if(v>bv){bv=v;b=p;}}if(b){used.add(b);lu.push({p:b,pos:'DH'});}}
  lu.shift();
  // 打順：4番は長打、1番は出塁と足、3番・5番は打力
  const rest=lu.slice(),take=f=>{let bi=0;rest.forEach((x,i)=>{if(f(x.p)>f(rest[bi].p))bi=i;});return rest.splice(bi,1)[0];};
  const top5=new Set(lu.slice().sort((a,b)=>batV(b.p)-batV(a.p)).slice(0,5).map(x=>x.p));
  const o4=take(p=>(top5.has(p)?100:0)+p.p),o3=take(batV),o1=take(p=>p.m*.5+p.s*.5),o5=take(batV),o2=take(p=>p.m);
  rest.sort((a,b)=>batV(b.p)-batV(a.p));
  const order=[o1,o2,o3,o4,o5,...rest];
  return{order,pitcher:sp,bench:t.players.filter(p=>!used.has(p)&&!p.hurt)};
}
const NUMOF={'DH':10,'投':1,'捕':2,'一':3,'二':4,'三':5,'遊':6,'左':7,'中':8,'右':9};
function engineP(dp,pos,num){
  const c=(dp.cond||0)*2.5,cl=v=>clamp(v+c,1,99);
  const e={ref:dp,id:dp.id,name:dp.name,grade:dp.grade,pos,num,th:dp.th,bt:dp.bt,m:cl(dp.m),p:cl(dp.p),s:cl(dp.s),a:cl(dp.a),d:cl(dp.d),tired:dp.tired||0,hurt:dp.hurt,kmh:dp.pit?Math.round(dp.pit.kmh):0,pit:null};
  if(dp.pit){const tf=1-(dp.tired||0)/150;e.pit={vel:clamp((dp.pit.kmh-112)/0.48+c,0,99),ctl:cl(dp.pit.ctl),brk:cl(dp.pit.brk),sta:Math.max(5,dp.pit.sta*tf),gut:50};}

}
function matchTeam(t){
  const lu=autoLineup(t);let n=10;

  if(!pitcher.pit)pitcher.pit={vel:20,ctl:30,brk:20,sta:30,gut:50};n=11;

}

/* ---------- 試合の後始末：成績・疲れ・成長 ---------- */
function applyMatch(mt,res,side){
  const t=teamByKey(mt.key);if(!t||t.gen)return null;
  const won=res.winSide===side,lost=res.winSide===1-side,notes=[];
  const all=[...mt.players,mt.pitcher,...mt.bench,...mt.out].filter((e,i,a)=>e&&a.indexOf(e)===i);
  let mvp=null,mv=-1;
  for(const e of all){const d=e.ref,b=e.box;if(!b)continue;
    const c=d.car;c.g++;c.ab+=b.ab;c.h+=b.h;c.hr+=b.hr;c.rbi+=b.rbi;c.sb+=b.sb;c.po+=b.po;c.pk+=b.pk;c.pr+=b.pr;
    if(e.pcount)d.tired=clamp(d.tired+e.pcount*0.7,0,100);
    // 試合経験で少し伸びる
    const xp=t.key===S.my?1:0.6;
    grow(d,'m',(0.15+b.h*0.25)*xp);grow(d,'p',(0.1+b.hr*0.6+b.rbi*0.1)*xp);grow(d,'s',(0.08+b.sb*0.3)*xp);grow(d,'d',0.12*xp);grow(d,'a',0.08*xp);
    if(d.pit&&e.pcount){growP(d,'ctl',b.po*0.03*xp);growP(d,'sta',e.pcount*0.006*xp);growP(d,'brk',b.pk*0.06*xp);growP(d,'kmh',b.po*0.012*xp);}
    const v=b.h*2+b.hr*4+b.rbi*1.5+b.sb+(e.pcount?b.po*0.35+b.pk*0.4-b.pr*1.2:0);if(v>mv){mv=v;mvp=e;}
  }
  const sp=mt.starter;
  if(sp&&sp.ref){if(won)sp.ref.car.w++;if(lost)sp.ref.car.l++;}
  if(won)all.forEach(e=>{if(e.box&&e.ref.cond<2&&Math.random()<0.25)e.ref.cond++;});
  return mvp;
}
function teamByKey(k){if(S.teams[k])return S.teams[k];if(S.tour){const t=S.tour.teams.find(x=>x.key===k);if(t)return t;}if(S.pending&&S.pending.opp&&S.pending.opp.key===k)return S.pending.opp;return null;}

function grow(d,k,v){d[k]=Math.min(99,d[k]+v*d.pot*(1-d[k]/115));}
function growP(d,k,v){if(!d.pit)return;if(k==='kmh')d.pit.kmh=Math.min(158,d.pit.kmh+v*d.pot*(1-(d.pit.kmh-100)/65));else d.pit[k]=Math.min(99,d.pit[k]+v*d.pot*(1-d.pit[k]/115));}

    if(pol==='rest'){if(d.cond<2&&Math.random()<0.55)d.cond++;continue;}
    const mult=(1+d.cond*0.1)*(d.grade===1?1.12:d.grade===2?1.05:1)*(winter?1.2:1)*(mine?1:0.85);
    const before={m:d.m,p:d.p,s:d.s,a:d.a,d:d.d,kmh:d.pit&&d.pit.kmh,ctl:d.pit&&d.pit.ctl,brk:d.pit&&d.pit.brk,sta:d.pit&&d.pit.sta};
    for(const k in P.w)grow(d,k,P.w[k]*mult*(d.pit?0.6:1)*(0.6+Math.random()*0.8));
    if(d.pit)for(const k in P.pw)growP(d,k,P.pw[k]*mult*(k==='kmh'?0.8:1)*(0.6+Math.random()*0.8));
    if(mine){const ups=[];for(const k of ['m','p','s','a','d'])if(Math.floor(d[k])>Math.floor(before[k]))ups.push(STATN[k]);
      if(d.pit)for(const k of ['kmh','ctl','brk','sta'])if(Math.floor(d.pit[k])>Math.floor(before[k]))ups.push(STATN[k]);
      if(ups.length)gains.push([d,ups]);}
  }
  return gains;
}
const STATN={m:'ミート',p:'パワー',s:'走力',a:'肩',d:'守備',kmh:'球速',ctl:'制球',brk:'変化球',sta:'スタミナ'};

/* ---------- 年間の日程 ---------- */
const PRACTICE=[3,7,10,20,29];
const TOUR_DEF={
  summer:{w:12,end:16,size:16,gap:2,name:()=>'夏の'+myTeam().pref+'大会',board:()=>'夏 の '+myTeam().pref+' 大 会'},
  koshien:{w:16,end:18,size:16,gap:2,name:()=>'夏の甲子園',board:()=>'夏 の 甲 子 園',night:true},
  fall:{w:21,end:25,size:16,gap:3,name:()=>'秋季'+myTeam().pref+'大会',board:()=>'秋 季 '+myTeam().pref+' 大 会'},
  shikoku:{w:25,end:28,size:8,gap:3,name:()=>'秋季四国大会',board:()=>'秋 季 四 国 大 会'},
  senbatsu:{w:44,end:47,size:16,gap:2,name:()=>'春のセンバツ',board:()=>'春 の セ ン バ ツ'},
};
function addRep(title,lines){S.report=S.report?{title:S.report.title,lines:[...S.report.lines,'― '+title+' ―',...lines]}:{title,lines};}
function onWeekStart(w,first){
  const lines=[];
  if(w===0&&!first){
    // 新年度：進級と新入生
    S.year++;S.flags={};
    for(const k in S.teams){const t=S.teams[k];t.players.forEach(p=>p.grade++);
      const mine=k===S.my,rank=mine?repRank():2,n=mine?(rank===0?7:5+rank):6;
      const rk=makeRookies(t,rank,n);t.players.push(...rk);
      if(mine)lines.push('新入部員 '+rk.length+'人が入部した：'+rk.map(p=>p.name+'（'+POSNAME[p.pos]+(p.ep?'・'+p.ep:'')+'）').join('、'));}
    S.repPts=Math.max(0,S.repPts-4);
    addRep(S.year+'年目の春',[...lines,'評判：'+REP[repRank()]]);
  }
  if(PRACTICE.includes(w)){const t=myTeam(),avg=teamPower(t).all;S.pending={type:'practice',opp:genSchool(t.pref,avg+gauss()*4-4,new Set())};}
  if(w===18){
    const out=[];for(const k in S.teams){const t=S.teams[k],g3=t.players.filter(p=>p.grade>=3);t.players=t.players.filter(p=>p.grade<3);
      if(k===S.my){g3.forEach(p=>S.ob.push({name:p.name,year:S.year,pos:p.pos,car:p.car,ep:p.ep||''}));out.push(...g3.map(p=>p.name));if(S.ace&&g3.find(p=>p.id===S.ace))S.ace=null;}
      while(t.players.length<10)t.players.push(...makeRookies(t,k===S.my?repRank():2,1).map(p=>(p.grade=1,p)));}
    addRep('3年生の引退',[out.length?out.join('、')+'が引退。おつかれさま！':'3年生はいなかった。','新チームが始動した。秋の大会でセンバツ出場をめざそう。']);
  }
  if(w===38){
    const r=S.flags.shikoku;let sel=false;
    if(r&&r<=2)sel=true;else if(r&&r<=4&&Math.random()<0.4)sel=true;
    S.flags.senbatsu=sel;
    addRep('センバツ選考会',[sel?'春のセンバツ出場が決まった！':'センバツ出場はならなかった。夏に向けて鍛えよう。']);
    if(sel)S.repPts+=4;
  }
  for(const kind in TOUR_DEF){const T=TOUR_DEF[kind];if(T.w!==w)continue;
    if(kind==='koshien'&&!S.flags.summerChamp){S.kStreak=0;continue;}
    if(kind==='shikoku'&&!S.flags.fallTop2)continue;
    if(kind==='senbatsu'&&!S.flags.senbatsu){S.kStreak=0;continue;}
    makeTour(kind);}
}
function teamPower(t){const fs=t.players.filter(p=>!p.pit),ps=t.players.filter(p=>p.pit);
  const av=(a,f)=>a.length?a.reduce((s,p)=>s+f(p),0)/a.length:0;
  const top=fs.slice().sort((a,b)=>batV(b)-batV(a)).slice(0,8);
  const bat=av(top,batV),def=av(top,p=>(p.d+p.a)/2),run=av(top,p=>p.s),pit=ps.length?Math.max(...ps.map(pitV)):0;
  return{bat,def,run,pit,all:(bat*1.1+def*0.8+run*0.5+pit*1.2)/3.6};}

/* ---------- 大会 ---------- */
function makeTour(kind){
  const T=TOUR_DEF[kind],my=myTeam(),used=new Set(),list=[{ref:S.my}];
  const yb=(S.year-1)*2;
  if(kind==='summer'||kind==='fall'){
    const rv=S.rivalName[S.my];used.add(rv[0]);
    const riv=genSchool(my.pref,52+yb+Math.random()*4,used,{suffix:['学園','がくえん']});
    riv.name=rv[0]+'学園';riv.short=rv[0];YOMI[riv.name]=rv[1]+'がくえん';riv.rival=true;list.push(riv);
    const bases=[47,45,43,41,40,38,36,35,33,32,30,28,26,24];
    bases.forEach(b=>list.push(genSchool(my.pref,b+yb*0.5+gauss()*3+(kind==='fall'?-3:0),used)));
  }else if(kind==='shikoku'){
    for(const k in S.teams)if(k!==S.my)list.push({ref:k});
    for(const k in SCHOOLS)list.push(genSchool(SCHOOLS[k].pref,44+yb+Math.random()*6,used));
  }else{
    for(const k in S.teams)if(k!==S.my)list.push({ref:k});
    const outs=shuffle(OUTSIDE.slice()).slice(0,T.size-list.length);
    outs.forEach(o=>list.push(genSchool(o[0],50+yb*0.6+Math.random()*12,used,{outside:o})));
  }
  // 抽選
  const teams=list.slice(0,T.size);shuffle(teams);
  const stadium=kind==='koshien'||kind==='senbatsu'?'koshien':kind==='shikoku'?['koc','ehi','kag','tok'][(S.year-1)%4]:S.my;
  S.tour={kind,stadium,name:T.name(),board:T.board(),teams,alive:teams.map((_,i)=>i),round:0,log:[],out:false,place:null,gap:T.gap,end:T.end,night:!!T.night};
  refreshYomi();
}
const tTeam=e=>e.ref?S.teams[e.ref]:e;
function roundName(n){return n===2?'決勝':n===4?'準決勝':n===8?'準々決勝':n===16?'1回戦':n+'強';}
function userPair(){const tr=S.tour;if(!tr||tr.out)return null;const a=tr.alive;for(let i=0;i<a.length;i+=2){const x=tr.teams[a[i]],y=tr.teams[a[i+1]];if(x.ref===S.my)return[i,0];if(y&&y.ref===S.my)return[i,1];}return null;}
// 自分の試合のあと、同じ回戦の残りを進める
function finishRound(userRes){
  const tr=S.tour,a=tr.alive,next=[],lines=[];
  for(let i=0;i<a.length;i+=2){
    const x=tr.teams[a[i]],y=tr.teams[a[i+1]];let win;
    if(userRes&&userRes.i===i){win=userRes.win;}
    else{const {res}=simMatch(tTeam(x),tTeam(y));win=res.winSide===1?1:0;if(res.winSide<0)win=Math.random()<0.5?0:1;
      tr.log.push({r:roundName(a.length),a:tTeam(x).name,b:tTeam(y).name,s:res.score,w:win});}
    next.push(a[i+win]);
  }
  tr.alive=next;tr.round++;
  for(const k in S.teams)S.teams[k].players.forEach(p=>p.tired=Math.max(0,p.tired-12*tr.gap));
  if(next.length===1)return endTour();
  if(tr.out)return finishRound(null);
}
function placeOf(n){return n===1?'優勝':n===2?'準優勝':'ベスト'+n;}
function endTour(){
  const tr=S.tour,champ=tTeam(tr.teams[tr.alive[0]]),mine=champ.key===S.my;
  const place=mine?'優勝':tr.place||'—',lines=[];
  lines.push(tr.name+'：'+champ.name+'が優勝。');
  if(mine){lines.push('あなたのチームが頂点に立った！');}else lines.push('あなたのチームは'+place+'。');
  const k=tr.kind,r=place==='優勝'?1:place==='準優勝'?2:place.startsWith('ベスト')?+place.slice(3):99;
  if(k==='summer'&&mine)S.flags.summerChamp=true;
  if(k==='koshien'||k==='senbatsu'){S.kStreak=mine?(S.kStreak||0)+1:0;if(mine){const u=unlock(4);if(u)lines.push(u);}if(S.kStreak>=3){const u=unlock(5);if(u)lines.push(u);}}
  if(k==='fall'&&r<=2)S.flags.fallTop2=true;
  if(k==='shikoku')S.flags.shikoku=r;
  const bonus={summer:[8,4,2],fall:[5,3,1],shikoku:[8,5,2],koshien:[25,14,8],senbatsu:[20,12,6]}[k];
  S.repPts+=r===1?bonus[0]:r===2?bonus[1]:r<=4?bonus[2]:0;
  if(k==='summer'&&mine)lines.push('甲子園出場が決まった！');
  if(k==='summer'&&!mine)lines.push('3年生の夏が終わった……。');
  if(k==='fall'&&r<=2)lines.push('四国大会への出場が決まった！');
  if((k==='koshien'||k==='senbatsu')&&mine)lines.push('全国の頂点！'+(S.year<=3?'3年以内の目標を達成した！':''));
  S.hist.push({year:S.year,name:tr.name,place,champ:champ.name});
  S.report={title:tr.name+' 閉幕',lines};
  S.week=tr.end;const endW=tr.end;S.tour=null;
  onWeekStart(endW);
}

/* ---------- 1週間進める ---------- */
function advanceWeek(){
  if(S.tour||S.pending)return;
  const t=myTeam(),P=POLICY[S.policy];
  const gains=trainTeam(t,S.policy,true);
  for(const k in S.teams)if(k!==S.my)trainTeam(S.teams[k],Math.random()<0.15?'rest':'bal',false);
  S.fat=clamp(S.fat+P.f,0,100);
  const lines=[];
  t.players.forEach(p=>{if(S.policy!=='rest')p.cond=nextCond(p.cond);});
  if(S.fat>70)t.players.forEach(p=>{if(Math.random()<0.25&&p.cond>-2)p.cond--;});
  if(S.fat>85&&Math.random()<0.5){const v=pick(t.players.filter(p=>!p.hurt));if(v){v.hurt=2+Math.floor(Math.random()*3);lines.push('⚠ '+v.name+'がけがをした（'+v.hurt+'週間）。疲れがたまっている。');}}
  // ちょっとした出来事
  const ev=Math.random();
  if(ev<0.06){t.players.forEach(p=>{if(p.cond<2&&Math.random()<0.5)p.cond++;});lines.push('OBからスイカの差し入れ！みんなの調子が上がった。');}
  else if(ev<0.1){lines.push('地元の新聞に練習の様子が載った。');S.repPts+=1;}
  else if(ev<0.14&&S.week>=8&&S.week<32){lines.push('雨で練習が半分しかできなかった。');}
  const top=gains.sort((a,b)=>b[1].length-a[1].length).slice(0,6).map(([d,u])=>d.name+'：'+u.join('・')+' アップ');
  S.report={title:whenTxt(S.week)+'　練習「'+P.n+'」',lines:[...lines,...(top.length?top:['目立った伸びはなかった。']),'疲れ：'+fatWord()]};
  S.week++;
  if(S.week>=48)S.week=0;
  onWeekStart(S.week);
  saveYomi();save();render();
}
const fatWord=()=>S.fat<30?'元気いっぱい':S.fat<55?'少し疲れ':S.fat<75?'疲れ気味':'限界が近い';

/* ---------- 試合を始める ---------- */
let LIVE=null;
function playMatch(watch){
  const my=myTeam();let opp,ctx;
  if(S.tour){const up=userPair(),tr=S.tour,a=tr.alive;const oi=a[up[0]+(1-up[1])];opp=tTeam(tr.teams[oi]);ctx={tour:true,i:up[0],side:up[1],round:roundName(a.length)};}
  else{opp=S.pending.opp;ctx={tour:false};}
  const meHome=S.tour?ctx.side===1:Math.random()<0.5;
  const A=matchTeam(meHome?opp:my),B=matchTeam(meHome?my:opp),us=meHome?1:0;
  const title=S.tour?S.tour.board:'練 習 試 合';
  const done=res=>afterMatch(res,A,B,us,ctx,opp);
  const stadium=S.tour?S.tour.stadium:S.my;
  if(!watch){const res=startGame({away:A,home:B,us:-1,sim:true,stadium});done(res);return;}
  LIVE={A,B};showView('match');
  const night=!!(S.tour&&S.tour.night&&Math.random()<0.3);
  startGame({away:A,home:B,us,title,night,stadium,ads:[my.name,opp.name,'全力疾走','一球入魂',S.tour?S.tour.name:'練習試合'],onEnd:res=>{clearModels(A);clearModels(B);LIVE=null;showView('hub');done(res);}});
}
function afterMatch(res,A,B,us,ctx,opp){
  const mySide=us,mt=us===0?A:B,ot=us===0?B:A;
  const mvp=applyMatch(mt,res,us);applyMatch(ot,res,1-us);
  let win=res.winSide===us,draw=res.winSide<0;
  if(draw&&ctx.tour){win=Math.random()<0.5;}
  S.record[win?'w':draw?'d':'l']++;
  const line=res.score[us]+' - '+res.score[1-us];
  const lab=winLabel(res,us);
  const lines=[(win?'○ ':draw?'△ ':'● ')+lab+'　'+line+'　vs '+opp.name+(res.innings>9?'（延長'+res.innings+'回）':'')];
  if(mvp&&mvp.box){const b=mvp.box;lines.push('殊勲：'+mvp.name+'（'+(mvp.pcount?(Math.floor(b.po/3)+'回'+(b.po%3?b.po%3+'/3':'')+' 失点'+b.pr+' 奪三振'+b.pk):b.ab+'打数'+b.h+'安打'+(b.hr?' '+b.hr+'本塁打':'')+(b.rbi?' '+b.rbi+'打点':''))+'）');}
  S.last={line:res.line,score:res.score,teams:[A.short,B.short],colors:[A.color,B.color],innings:res.innings,us};
  if(ctx.tour){
    const tr=S.tour;tr.log.push({r:ctx.round,a:A.name,b:B.name,s:res.score,w:res.winSide===1?1:0,mine:true});
    const myWin=win?ctx.side:1-ctx.side;
    if(!win){tr.out=true;tr.place=tr.alive.length===2?'準優勝':(tr.alive.length===16?'1回戦敗退':'ベスト'+tr.alive.length);}
    else{S.repPts+=({summer:1,fall:1,shikoku:2,koshien:3,senbatsu:3})[tr.kind];tr.wins=(tr.wins||0)+1;
      const u=[unlock(1),tr.kind==='summer'&&tr.alive.length===16||tr.kind==='fall'&&tr.wins>=2?unlock(2):null,tr.kind==='koshien'||tr.kind==='senbatsu'?unlock(3):null].filter(Boolean);lines.push(...u);}
    S.report={title:tr.name+'　'+ctx.round,lines};
    finishRound({i:ctx.i,win:myWin});
    if(S.tour)S.report.lines.push(win?'次は'+roundName(S.tour.alive.length)+'！':'');
    else{const rep=S.report;rep.lines.unshift(...lines);}
  }else{
    S.pending=null;S.report={title:'練習試合',lines};
    myTeam().players.forEach(p=>{grow(p,'m',0.1);grow(p,'d',0.1);});
  }
  saveYomi();save();render();
}

  return '<div class="card next"><p class="kick">'+whenTxt(S.week)+'の練習</p><h2>練習方針を選ぶ</h2><div class="policies">'+Object.entries(POLICY).map(([k,p])=>'<button class="pol'+(S.policy===k?' on':'')+'" data-p="'+k+'"><b>'+p.n+'</b><small>'+p.d+'</small></button>').join('')+'</div>'+
    '<div class="fatbar"><span>疲れ</span><div class="bar"><i style="width:'+S.fat+'%;background:'+(S.fat>75?'#d2473f':S.fat>55?'#e07f22':'#3d9b4b')+'"></i></div><span>'+fatWord()+'</span></div>'+
    '<div class="btns"><button class="btn big" id="adv">1週間 練習する</button></div>'+(up?'<p class="muted small">次の予定：'+up+'</p>':'')+'</div>';
}
function strengthWord(o,m){const d=o-m;return d>8?'かなり格上':d>3?'格上':d>-3?'互角':d>-8?'格下':'かなり格下';}
function upcoming(){for(let w=S.week+1;w<S.week+48;w++){const x=w%48;if(PRACTICE.includes(x))return whenTxt(x)+' 練習試合';for(const k in TOUR_DEF){const T=TOUR_DEF[k];if(T.w===x&&(k==='summer'||k==='fall'))return whenTxt(x)+' '+T.name();}if(x===18)return whenTxt(x)+' 3年生引退';if(x===0)return '新年度（4月）';}return '';}
function lineScoreHTML(L){const n=Math.max(9,L.innings);let h='<div class="tablewrap"><table class="ls"><tr><th></th>';for(let i=1;i<=n;i++)h+='<th>'+i+'</th>';h+='<th>計</th></tr>';
  [0,1].forEach(r=>{h+='<tr'+(r===L.us?' class="mine"':'')+'><th class="l"><i class="sw" style="background:'+L.colors[r]+'"></i>'+esc(L.teams[r])+'</th>';for(let i=0;i<n;i++){const v=L.line[r][i];h+='<td>'+(v==null?(r===1&&i===n-1&&L.score[1]>L.score[0]?'x':''):v)+'</td>';}h+='<td><b>'+L.score[r]+'</b></td></tr>';});
  return h+'</table></div>';}
function renderHub(){
  const t=myTeam(),pw=teamPower(t),rep=S.report;
  let goal=S.year<=3?'目標：3年以内に甲子園優勝（あと'+(4-S.year)+'年）':'通算成績 '+S.record.w+'勝'+S.record.l+'敗';
  const won=S.hist.some(h=>(h.name.includes('甲子園')||h.name.includes('センバツ'))&&h.place==='優勝');
  if(won)goal='全国制覇を達成！　通算 '+S.record.w+'勝'+S.record.l+'敗';
  $('v-hub').innerHTML=nextCard()+
    (rep?'<div class="card report"><h3>'+esc(rep.title)+'</h3>'+(S.last&&rep.title.match(/練習試合|回戦|決勝|準|閉幕/)?lineScoreHTML(S.last):'')+'<ul>'+rep.lines.filter(Boolean).map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul></div>':'')+
    '<div class="card"><h3>チーム力</h3><p class="muted small">'+goal+'</p><div class="pw">'+[['打撃',pw.bat],['守備',pw.def],['走力',pw.run],['投手',pw.pit]].map(([n,v])=>'<div><span>'+n+'</span><b class="g-'+grade(v)+'">'+grade(v)+'</b><div class="bar"><i style="width:'+clamp(v,0,100)+'%"></i></div></div>').join('')+'</div>'+
    repHint()+'<p class="muted small">部員 '+t.players.length+'人（1年'+t.players.filter(p=>p.grade===1).length+'・2年'+t.players.filter(p=>p.grade===2).length+'・3年'+t.players.filter(p=>p.grade===3).length+'）'+(t.players.some(p=>p.hurt)?'　けが：'+t.players.filter(p=>p.hurt).map(p=>p.name).join('、'):'')+'</p></div>';
  document.querySelectorAll('.pol').forEach(b=>b.onclick=()=>{S.policy=b.dataset.p;save();renderHub();});
  const on=(id,f)=>{const e=$(id);if(e)e.onclick=f;};
  on('adv',advanceWeek);on('watch',()=>{SND.init();playMatch(true);});on('quick',()=>playMatch(false));
  on('skipP',()=>{S.pending=null;S.report={title:'練習試合を見送った',lines:['この週は休んで体を休めた。']};S.fat=Math.max(0,S.fat-20);S.week++;onWeekStart(S.week);save();render();});
}
function repHint(){const r=repRank(),nx=r+1;if(nx>=REP.length)return '<p class="muted small">評判：最高の「超名門」</p>';
  const need=(S.repOpen||0)<nx?'条件：'+REP_COND[nx]:'あと '+Math.max(0,REP_PTS[nx]-S.repPts)+'ポイント（勝つほど増える）';
  return '<p class="muted small">次の評判「'+REP[nx]+'」　'+need+'</p>';}
function renderTeam(){
  const t=myTeam(),lu=autoLineup(t),ord=new Map(lu.order.map((x,i)=>[x.p,{i,pos:x.pos}]));ord.set(lu.pitcher,{i:9,pos:'投'});
  const key=p=>ord.has(p)?ord.get(p).i:10+(3-p.grade)+(1-batV(p)/100);
  const list=t.players.slice().sort((a,b)=>key(a)-key(b));
  const fieldRows=list.map(p=>{const o=ord.get(p);return '<tr data-id="'+p.id+'"'+(selPlayer===p.id?' class="sel"':'')+'><td class="num">'+(o?(o.i<9?o.i+1:'P'):'')+'</td><td>'+(o?o.pos:'<span class="muted">控</span>')+'</td><td class="l"><b>'+esc(p.name)+'</b>'+(p.hurt?' <span class="hurt">けが</span>':'')+'<small class="gr">'+p.grade+'年・'+(POSNAME[p.pos]||'')+'</small></td><td><span class="cond '+condCls(p.cond)+'">'+condTxt(p.cond)+'</span></td>'+['m','p','s','a','d'].map(k=>'<td>'+gl(p[k])+'</td>').join('')+'</tr>';}).join('');
  const ps=t.players.filter(p=>p.pit).sort((a,b)=>pitV(b)-pitV(a));
  const ace=chooseStarter(t,t.players.filter(p=>!p.hurt));
  const pitRows=ps.map(p=>'<tr data-id="'+p.id+'"'+(selPlayer===p.id?' class="sel"':'')+'><td class="l"><b>'+esc(p.name)+'</b>'+(p===ace?' <span class="ace">先発</span>':'')+'<small class="gr">'+p.grade+'年・'+(p.th==='L'?'左':'右')+'投</small></td><td class="num">'+r1(p.pit.kmh)+'<small>km</small></td>'+['ctl','brk','sta'].map(k=>'<td>'+gl(p.pit[k])+'</td>').join('')+'<td><div class="bar sm"><i style="width:'+p.tired+'%;background:'+(p.tired>50?'#d2473f':'#e07f22')+'"></i></div></td></tr>').join('');
  $('v-team').innerHTML='<div class="card"><h3>打順と守備（おまかせ・DH制）</h3><p class="muted small">投手は打席に立たず、DH（指名打者）が打ちます。</p><div class="tablewrap"><table class="roster"><thead><tr><th>打順</th><th>守</th><th class="l">名前</th><th>調子</th><th>ミート</th><th>パワー</th><th>走力</th><th>肩</th><th>守備</th></tr></thead><tbody>'+fieldRows+'</tbody></table></div></div>'+
    '<div class="card"><h3>投手陣</h3><p class="muted small">選手をタップすると、次の試合の先発に指名できます。疲れが残っている投手は打たれやすくなります。</p><div class="tablewrap"><table class="roster"><thead><tr><th class="l">名前</th><th>球速</th><th>制球</th><th>変化球</th><th>スタミナ</th><th>疲れ</th></tr></thead><tbody>'+pitRows+'</tbody></table></div></div>'+
    '<div class="card" id="pdetail">'+detailHTML(t.players.find(p=>p.id===selPlayer))+'</div>';
  document.querySelectorAll('#v-team tr[data-id]').forEach(r=>r.onclick=()=>{selPlayer=+r.dataset.id;renderTeam();$('pdetail').scrollIntoView({block:'nearest'});});
  const ab=$('setAce');if(ab)ab.onclick=()=>{S.ace=S.ace===selPlayer?null:selPlayer;save();renderTeam();};
}
function detailHTML(p){
  if(!p)return '<p class="muted">選手をタップすると詳しい能力が見られます。</p>';
  const c=p.car,avg=c.ab?(c.h/c.ab).toFixed(3).replace(/^0/,''):'---';
  const bars=[['ミート',p.m],['パワー',p.p],['走力',p.s],['肩',p.a],['守備',p.d]].concat(p.pit?[['制球',p.pit.ctl],['変化球',p.pit.brk],['スタミナ',p.pit.sta]]:[]);
  return '<div class="pd"><div class="who"><span class="emb sm" style="--tc:'+myTeam().color+'">'+p.grade+'</span><div><b class="big">'+esc(p.name)+'</b><small>'+(p.yomi?esc(p.yomi)+'　':'')+p.grade+'年　'+POSNAME[p.pos]+'　'+(p.th==='L'?'左投':'右投')+(p.bt==='L'?'左打':p.bt==='S'?'両打':'右打')+(p.ep?'　「'+esc(p.ep)+'」':'')+'</small></div></div>'+
    '<div class="bars">'+bars.map(([n,v])=>'<span>'+n+'</span><div class="bar"><i style="width:'+v+'%"></i></div><b class="g-'+grade(v)+'">'+grade(v)+'</b><span class="num">'+r1(v)+'</span>').join('')+'</div>'+
    (p.pit?'<p>球速 <b class="num">'+r1(p.pit.kmh)+' km/h</b>　疲れ '+r1(p.tired)+'%</p>':'')+
    '<p class="muted small">通算：'+c.g+'試合　打率 '+avg+'　'+c.h+'安打 '+c.hr+'本塁打 '+c.rbi+'打点 '+c.sb+'盗塁'+(p.pit?'　投手 '+c.w+'勝'+c.l+'敗 '+c.pk+'奪三振':'')+'</p>'+
    '<p class="muted small">伸びしろ：'+(p.pot>=1.3?'大きい':p.pot>=1.08?'ふつうより大きい':p.pot>=0.92?'ふつう':'小さめ')+'</p>'+
    (p.pit?'<button class="btn ghost" id="setAce">'+(S.ace===p.id?'先発の指名を外す':'次の試合の先発に指名')+'</button>':'')+'</div>';
}
function renderSched(){
  const marks=[];for(let w=0;w<48;w++){let ev='';if(PRACTICE.includes(w))ev='練習試合';for(const k in TOUR_DEF){if(TOUR_DEF[k].w===w)ev=TOUR_DEF[k].name()+(k==='koshien'?'（県大会優勝で出場）':k==='shikoku'?'（秋の県大会2位以内）':k==='senbatsu'?'（選ばれたら）':'');}
    if(w===18)ev='3年生引退・新チーム';if(w===38)ev='センバツ選考会';if(w===32)ev='冬トレ（12〜2月は練習の伸びが良い）';if(w===0)ev='新入生入部';if(ev)marks.push([w,ev]);}
  let tourH='';
  if(S.tour){const tr=S.tour;tourH='<div class="card"><h3>'+esc(tr.name)+'</h3><p class="muted small">残り'+tr.alive.length+'校：'+tr.alive.map(i=>esc(tTeam(tr.teams[i]).name)).join('・')+'</p><ul class="games">'+tr.log.slice().reverse().map(g=>'<li'+(g.mine?' class="mine"':'')+'><span class="r">'+g.r+'</span>'+(g.w===0?'<b>'+esc(g.a)+'</b>':esc(g.a))+' <span class="num">'+g.s[0]+'-'+g.s[1]+'</span> '+(g.w===1?'<b>'+esc(g.b)+'</b>':esc(g.b))+'</li>').join('')+'</ul></div>';}
  $('v-sched').innerHTML=tourH+'<div class="card"><h3>1年の流れ</h3><ul class="cal">'+marks.map(([w,e])=>'<li'+(w===S.week?' class="now"':w<S.week?' class="past"':'')+'><span>'+whenTxt(w)+'</span>'+esc(e)+'</li>').join('')+'</ul></div>';
}
function renderRec(){
  const h=S.hist.slice().reverse();
  $('v-rec').innerHTML='<div class="card"><h3>大会の記録</h3>'+(h.length?'<ul class="games">'+h.map(x=>'<li><span class="r">'+x.year+'年目</span>'+esc(x.name)+'　<b>'+esc(x.place)+'</b>'+(x.place!=='優勝'?'<small class="muted">（優勝 '+esc(x.champ)+'）</small>':'')+'</li>').join('')+'</ul>':'<p class="muted">まだ大会に出ていません。</p>')+'<p class="muted small">試合 '+S.record.w+'勝'+S.record.l+'敗'+(S.record.d?S.record.d+'分':'')+'</p></div>'+
    '<div class="card"><h3>引退した選手</h3>'+(S.ob.length?'<ul class="games">'+S.ob.slice().reverse().map(o=>'<li><span class="r">'+o.year+'年目</span><b>'+esc(o.name)+'</b>　'+(POSNAME[o.pos]||'')+'　<small class="muted">'+o.car.g+'試合 '+o.car.h+'安打 '+o.car.hr+'本塁打'+(o.car.w||o.car.l?' '+o.car.w+'勝'+o.car.l+'敗':'')+'</small></li>').join('')+'</ul>':'<p class="muted">まだいません。</p>')+'</div>'+
    '<div class="card"><h3>データ</h3><p class="muted small">進み具合はこのブラウザに保存されます。</p><button class="btn ghost" id="reset">最初からやり直す</button></div>';
  $('reset').onclick=()=>{if(confirm('保存を消して、学校選びからやり直しますか？')){try{localStorage.removeItem(SAVE_KEY);}catch(e){}S=null;showView('title');}};
}

/* ---------- 起動 ---------- */
setSky(false);
S=null;
showView('title');
requestAnimationFrame(loop);

</script>
</body>
</html>
