<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>完全犯罪を暴け</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column. A kamishibai stage (wooden frame + sliding picture card), a dialogue box under it, then choices. */
:root{
  --bg:#e9edf1; --paper:#f8fafb; --ink:#18202a; --mute:#5d6874; --line:#c9d1d9;
  --tag:#e8b923; --tagink:#2a2205; --stamp:#b8322a; --ok:#2f7d55;
  --wood1:#8a5a33; --wood2:#5e3a1e; --woodline:#3d2410;
  --dlg:#141a22; --dlgink:#eef2f6; --dlgmute:#9aa6b2;
  --f-disp:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --paper:#18202a; --ink:#e4e9ee; --mute:#94a0ac; --line:#2c3743;
  --tag:#e3b42a; --tagink:#221b03; --stamp:#e2574c; --ok:#5cbf8a;
  --wood1:#6e4527; --wood2:#452a14; --woodline:#22140a;
  --dlg:#0a0e13; --dlgink:#eef2f6; --dlgmute:#8a96a2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --paper:#18202a; --ink:#e4e9ee; --mute:#94a0ac; --line:#2c3743;
  --tag:#e3b42a; --tagink:#221b03; --stamp:#e2574c; --ok:#5cbf8a;
  --wood1:#6e4527; --wood2:#452a14; --woodline:#22140a;
  --dlg:#0a0e13; --dlgink:#eef2f6; --dlgmute:#8a96a2; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.8;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-block:16px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.dlg:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase}

/* title */
.hero{display:grid;gap:14px;padding-block:20px 8px}
.hero h1{font-family:var(--f-disp);font-size:clamp(34px,9vw,58px);line-height:1.1;letter-spacing:.02em}
.hero h1 .strike{position:relative;display:inline-block}
.hero h1 .strike::after{content:"";position:absolute;left:-4%;right:-4%;top:52%;height:.12em;background:var(--stamp);transform:rotate(-4deg)}
.hero p{margin:0;color:var(--mute);max-width:60ch}
.rules{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.rules span{font-size:13px;border:1px solid var(--line);border-radius:4px;padding:2px 10px;background:var(--paper)}
.list{display:grid;gap:10px;margin-top:22px}
.case{display:grid;grid-template-columns:104px 1fr auto;gap:14px;align-items:center;text-align:left;
  background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 14px 10px 10px;width:100%}
.case:hover{border-color:var(--mute)}
.thumb{width:104px;aspect-ratio:5/3;border-radius:3px;overflow:hidden;border:3px solid var(--wood2);background:#000}
.thumb svg{display:block;width:100%;height:100%}
.thumb svg *{animation:none!important}
.case .nm{min-width:0}
.case .nm .yr{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--mute)}
.case .nm b{display:block;font-weight:700;font-size:16.5px;line-height:1.45}
.case .nm small{color:var(--mute);font-size:13px}
.seal{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;border:2px solid var(--stamp);color:var(--stamp);
  padding:1px 6px;border-radius:3px;transform:rotate(-6deg);white-space:nowrap}
.seal.none{border-color:var(--line);color:var(--mute);transform:none}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;
  display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar .l{display:flex;gap:8px}
.sbtn{background:none;border:1px solid var(--line);border-radius:4px;padding:3px 10px;font-size:13.5px}
.delay{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.delay i{width:12px;height:12px;border-radius:50%;border:2px solid var(--stamp);display:inline-block;transition:background .3s}
.delay i.on{background:var(--stamp)}
.file{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding-block:12px 4px}
.file h2{font-family:var(--f-disp);font-size:clamp(20px,5vw,28px);line-height:1.3}
.file .meta{font-family:var(--f-mono);font-size:12.5px;color:var(--mute)}
.board{display:flex;flex-wrap:wrap;gap:6px;min-height:30px;padding-block:6px 10px}
.board .lbl{font-size:12px;color:var(--mute);align-self:center;margin-right:2px}
.chip{background:var(--tag);color:var(--tagink);font-size:12.5px;font-weight:700;padding:2px 9px 2px 17px;border-radius:2px;position:relative;line-height:1.5}
.chip::before{content:"";position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--bg)}
.chip.new{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:translateY(-30px) scale(.4);opacity:0}100%{transform:none;opacity:1}}

/* kamishibai stage */
.stage{position:relative;padding:12px;border-radius:6px;
  background:linear-gradient(135deg,var(--wood1),var(--wood2));box-shadow:inset 0 0 0 2px var(--woodline),0 6px 18px rgba(0,0,0,.25)}
.stage::before,.stage::after{content:"";position:absolute;top:50%;width:10px;height:44px;margin-top:-22px;background:var(--woodline);border-radius:3px}
.stage::before{left:-4px}.stage::after{right:-4px}
.card{position:relative;aspect-ratio:5/3;max-width:100%;overflow:hidden;border-radius:2px;background:#000;box-shadow:inset 0 0 0 2px var(--woodline)}
.layer{position:absolute;inset:0}
.layer svg{display:block;width:100%;height:100%}
.layer.out{animation:pull .7s cubic-bezier(.6,0,.4,1) forwards;z-index:2;box-shadow:6px 0 14px rgba(0,0,0,.5)}
@keyframes pull{to{transform:translateX(-104%)}}
.stampov{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3}
.stampov span{font-family:var(--f-disp);font-size:clamp(26px,8vw,48px);padding:2px 16px;border:5px solid;border-radius:6px;transform:rotate(-8deg);
  animation:slam .9s ease forwards;background:rgba(0,0,0,.25)}
.stampov.bad span{color:#ff6b5e;border-color:#ff6b5e}
.stampov.good span{color:#ffd23f;border-color:#ffd23f}
@keyframes slam{0%{transform:rotate(-8deg) scale(2.4);opacity:0}25%{transform:rotate(-8deg) scale(1);opacity:1}75%{opacity:1}100%{opacity:0}}
.card.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* dialogue */
.dlg{position:relative;margin-top:12px;background:var(--dlg);color:var(--dlgink);border-radius:6px;padding:22px 18px 26px;min-height:128px;cursor:pointer;user-select:none}
.dlg .who{position:absolute;top:-13px;left:14px;font-weight:700;font-size:14px;padding:1px 12px;border-radius:3px;color:#111;background:#cfd6de}
.dlg .who[hidden]{display:none}
.dlg .txt{font-size:16.5px;line-height:1.85;min-height:3.6em;white-space:pre-wrap}
.dlg .txt.narr{color:#d6dde4}
.dlg .txt.think{color:var(--dlgmute)}
.dlg .more{position:absolute;right:14px;bottom:6px;font-size:12px;color:var(--dlgmute);animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(3px)}}
.choices{display:grid;gap:10px;margin-top:14px}
.ch{text-align:left;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:4px;padding:12px 14px;line-height:1.6;
  animation:rise .35s ease both}
.ch:nth-child(2){animation-delay:.07s}.ch:nth-child(3){animation-delay:.14s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.ch:hover:not(:disabled){border-color:var(--ink)}
.ch:disabled{opacity:.45;cursor:default;text-decoration:line-through;border-left-color:var(--stamp)}
.hint{font-size:12.5px;color:var(--mute);margin-top:8px}

/* ending */
.verdict{text-align:center;padding-block:24px 6px;display:grid;gap:10px;justify-items:center}
.verdict .big{font-family:var(--f-disp);font-size:clamp(30px,8vw,46px);color:var(--stamp);border:4px solid var(--stamp);padding:4px 18px;border-radius:4px;
  animation:endslam .7s cubic-bezier(.3,1.4,.5,1) both;transform:rotate(-3deg)}
@keyframes endslam{from{transform:rotate(-3deg) scale(2.5);opacity:0}}
.verdict .big.cold{color:var(--mute);border-color:var(--mute)}
.sec{margin-top:22px}
.sec h3{font-family:var(--f-disp);font-size:18px;margin-bottom:8px}
.sec p{margin:0 0 10px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin:0}
.facts dt{font-family:var(--f-mono);color:var(--mute);font-size:13px;padding-top:2px}
.facts dd{margin:0;min-width:0}
.go{margin-top:18px;width:100%;background:var(--ink);color:var(--bg);border:0;border-radius:4px;padding:12px;font-weight:700;font-size:16px}
.note{font-size:13px;color:var(--mute);margin-top:28px;max-width:60ch}
@media (max-width:440px){.case{grid-template-columns:84px 1fr}.thumb{width:84px}.case .seal{grid-column:2;justify-self:start}}

/* scene animations (inside the picture card) */
svg .a-fog{animation:fog 20s ease-in-out infinite alternate}
@keyframes fog{from{transform:translateX(-90px)}to{transform:translateX(90px)}}
svg .a-flick{animation:flick 2.6s infinite}
@keyframes flick{0%,100%{opacity:.9}44%{opacity:.55}50%{opacity:.95}56%{opacity:.7}}
svg .a-blink{animation:blink 6s infinite}
@keyframes blink{0%,60%,100%{opacity:1}65%,90%{opacity:.25}}
svg .a-sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.4s ease-in-out infinite alternate}
svg .a-swing{transform-box:fill-box;transform-origin:50% 0;animation:sway 2.6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
svg .a-wave{animation:wave 5s linear infinite}
@keyframes wave{to{transform:translateX(-80px)}}
svg .a-rise{animation:up 3s ease-in infinite}
@keyframes up{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-46px);opacity:0}}
svg .a-smoke{transform-box:fill-box;transform-origin:center;animation:smoke 5s ease-out infinite}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:.7}100%{transform:translate(30px,-60px) scale(1.8);opacity:0}}
svg .a-pulse{transform-box:fill-box;transform-origin:50% 100%;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.3);opacity:0}}
svg .a-spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
svg .a-fly{animation:fly 11s linear infinite}
@keyframes fly{from{transform:translate(-80px,40px)}to{transform:translate(480px,-40px)}}
svg .a-drive{animation:drive 2.6s linear infinite}
@keyframes drive{from{transform:translateX(-140px)}to{transform:translateX(540px)}}
svg .a-bob{animation:sbob 2.8s ease-in-out infinite alternate}
@keyframes sbob{to{transform:translateY(5px) rotate(1deg)}}
svg .a-dust{animation:dust 7s ease-in-out infinite alternate}
@keyframes dust{to{transform:translate(14px,24px);opacity:.2}}
svg .a-magn{animation:magn 6s ease-in-out infinite alternate}
@keyframes magn{0%{transform:translate(-50px,10px)}50%{transform:translate(20px,-14px)}100%{transform:translate(50px,12px)}}
svg .a-cur{animation:cur 1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
svg .a-draw{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 2.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
svg .a-glow{animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.3}to{opacity:1}}
svg .a-in{animation:inz 1.2s cubic-bezier(.2,1.2,.4,1) both}
@keyframes inz{from{transform:translate(200px,120px) rotate(-30deg) scale(.1);opacity:0}}
@media (prefers-reduced-motion:reduce){*,svg *{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
/* ======================= picture cards (SVG) ======================= */
let gid = 0;
const W = (inner, defs='') => `<svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>${defs}</defs>${inner}</svg>`;
function sky(a,b){ const id='g'+(++gid); return [`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`, `<rect width="400" height="240" fill="url(#${id})"/>`]; }
function glow(cx,cy,r,col,cls='a-flick'){ const id='g'+(++gid); return [`<radialGradient id="${id}"><stop offset="0" stop-color="${col}" stop-opacity=".75"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></radialGradient>`, `<circle class="${cls}" cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id})"/>`]; }
// silhouette person: x = center, y = feet
function man(x,y,s=1,hat='fedora',col='#0b0e13'){
  const h = 78*s, hw=15*s, hr=8.5*s, top=y-h;
  let hatS='';
  if(hat==='top') hatS=`<rect x="${x-7*s}" y="${top-14*s}" width="${14*s}" height="${14*s}" fill="${col}"/><rect x="${x-11*s}" y="${top-1*s}" width="${22*s}" height="${3*s}" fill="${col}"/>`;
  if(hat==='fedora') hatS=`<path d="M${x-8*s} ${top+1*s} Q${x} ${top-11*s} ${x+8*s} ${top+1*s}Z" fill="${col}"/><rect x="${x-13*s}" y="${top}" width="${26*s}" height="${3*s}" rx="${1.5*s}" fill="${col}"/>`;
  if(hat==='cap') hatS=`<path d="M${x-9*s} ${top+3*s} Q${x} ${top-8*s} ${x+9*s} ${top+3*s}Z" fill="${col}"/><rect x="${x-2*s}" y="${top+1*s}" width="${13*s}" height="${2.5*s}" fill="${col}"/>`;
  const dress = hat==='dress';
  const body = dress
   ? `<path d="M${x-8*s} ${top+18*s} L${x+8*s} ${top+18*s} L${x+20*s} ${y} L${x-20*s} ${y}Z" fill="${col}"/>`
   : `<path d="M${x-hw} ${top+22*s} Q${x} ${top+12*s} ${x+hw} ${top+22*s} L${x+hw-2*s} ${y-30*s} L${x+6*s} ${y-30*s} L${x+7*s} ${y} L${x+1*s} ${y} L${x} ${y-26*s} L${x-1*s} ${y} L${x-7*s} ${y} L${x-6*s} ${y-30*s} L${x-hw+2*s} ${y-30*s}Z" fill="${col}"/>`;
  const hair = dress ? `<circle cx="${x}" cy="${top+6*s}" r="${hr+2*s}" fill="${col}"/>` : '';
  return `${hair}<circle cx="${x}" cy="${top+9*s}" r="${hr}" fill="${col}"/>${body}${hatS}`;
}
function fogs(col='#c8d0dc', op=.13){ return [0,1,2].map(k=>`<ellipse class="a-fog" style="animation-duration:${16+k*7}s;animation-delay:-${k*5}s" cx="${120+k*90}" cy="${170+k*22}" rx="220" ry="${18+k*5}" fill="${col}" opacity="${op}"/>`).join(''); }
function stars(n=24, seed=3){ let s='',r=seed; for(let k=0;k<n;k++){ r=(r*9301+49297)%233280; const x=r/233280*400; r=(r*9301+49297)%233280; const y=r/233280*110; s+=`<circle class="${k%3?'':'a-blink'}" style="animation-delay:-${k}s" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${k%4?0.8:1.3}" fill="#fff" opacity=".7"/>`; } return s; }
function pine(x,y,s,col){ return `<path d="M${x} ${y-60*s} L${x+16*s} ${y-30*s} L${x+8*s} ${y-30*s} L${x+22*s} ${y} L${x-22*s} ${y} L${x-8*s} ${y-30*s} L${x-16*s} ${y-30*s}Z" fill="${col}"/>`; }

const ITEMS = {
  glasses:`<g transform="translate(200 150)"><circle cx="-34" cy="0" r="24" fill="#9fc6d9" fill-opacity=".25" stroke="#1a1a1a" stroke-width="7"/><circle cx="34" cy="0" r="24" fill="#9fc6d9" fill-opacity=".25" stroke="#1a1a1a" stroke-width="7"/><path d="M-10 -4 Q0 -12 10 -4" stroke="#1a1a1a" stroke-width="6" fill="none"/><path d="M-58 -6 L-92 -14 M58 -6 L92 -14" stroke="#1a1a1a" stroke-width="5"/><rect x="54" y="-11" width="8" height="8" fill="#e8b923" class="a-glow"/></g>`,
  ladder:`<g transform="translate(200 160) rotate(-62)"><rect x="-80" y="-26" width="170" height="8" fill="#b48a55"/><rect x="-80" y="18" width="170" height="8" fill="#b48a55"/>${[-66,-38,-10,18,46,74].map((x,k)=>`<rect x="${x}" y="-20" width="7" height="40" fill="${k===3?'#e8b923':'#9a7244'}" ${k===3?'class="a-glow"':''}/>`).join('')}</g>`,
  bill:`<g transform="translate(200 152) rotate(-6)"><rect x="-90" y="-40" width="180" height="80" rx="3" fill="#d8c47a"/><rect x="-82" y="-32" width="164" height="64" fill="none" stroke="#7a6420" stroke-width="2"/><circle cx="0" cy="0" r="20" fill="none" stroke="#7a6420" stroke-width="3"/><text x="0" y="-18" text-anchor="middle" font-size="9" font-family="serif" fill="#5a4a10" dy="-6">GOLD CERTIFICATE</text><text x="-60" y="26" font-size="12" font-family="serif" fill="#5a4a10">10</text><text x="48" y="26" font-size="12" font-family="serif" fill="#5a4a10">10</text><text x="-70" y="56" font-size="11" fill="#e8e3d3" font-family="monospace" class="a-glow">4U-13-41 N.Y.</text></g>`,
  typewriter:`<g transform="translate(200 160)"><rect x="-40" y="-70" width="80" height="50" fill="#f0ece0"/><g fill="#555">${[0,1,2,3].map(k=>`<rect x="-30" y="${-62+k*10}" width="${50-k*8}" height="3"/>`).join('')}</g><path d="M-70 -20 L70 -20 L84 30 L-84 30Z" fill="#232323"/><rect x="-76" y="-28" width="152" height="10" rx="5" fill="#333"/>${[0,1,2].map(r=>[...Array(9)].map((_,c)=>`<circle cx="${-56+c*14+r*4}" cy="${-4+r*11}" r="4.5" fill="#d8d0b8"/>`).join('')).join('')}</g>`,
  sandwich:`<g transform="translate(200 160)"><path d="M-80 0 Q-80 -30 -40 -32 L60 -32 Q86 -30 84 0 Z" fill="#d9a35c"/><rect x="-82" y="-4" width="168" height="10" fill="#b8323a"/><circle cx="-50" cy="1" r="9" fill="#d24b52"/><circle cx="-14" cy="1" r="9" fill="#d24b52"/><circle cx="22" cy="1" r="9" fill="#d24b52"/><rect x="-84" y="6" width="170" height="16" rx="6" fill="#d9a35c"/><circle cx="84" cy="-6" r="22" fill="#1a1814"/><circle cx="70" cy="-26" r="12" fill="#1a1814"/></g>`,

/* ======================= engine ======================= */
const LIMIT = 3;
const RANK = ['完全解明','解明','辛くも解明'];
const app = document.getElementById('app');
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let cleared={}, sound=true;
try{ cleared = JSON.parse(localStorage.getItem('abake-cleared')||'{}')||{}; sound = localStorage.getItem('abake-sound')!=='0'; }catch(e){}
function save(){ try{ localStorage.setItem('abake-cleared', JSON.stringify(cleared)); localStorage.setItem('abake-sound', sound?'1':'0'); }catch(e){} }

/* sound: 拍子木 on card change, soft ticks while text types */
let AC=null;
function ac(){ if(!sound) return null; try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){ AC=null; } return AC; }
function clack(){ const a=ac(); if(!a) return; [0,.13].forEach(t=>{ const n=a.createBufferSource(), b=a.createBuffer(1,a.sampleRate*.06,a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,6); n.buffer=b; const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1700+t*900; f.Q.value=6;
  const g=a.createGain(); g.gain.value=.9; n.connect(f).connect(g).connect(a.destination); n.start(a.currentTime+t); }); }
function tick(){ const a=ac(); if(!a) return; const o=a.createOscillator(), g=a.createGain(); o.frequency.value=720+Math.random()*80; g.gain.setValueAtTime(.025,a.currentTime); g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.04); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+.05); }
function thud(bad){ const a=ac(); if(!a) return; const o=a.createOscillator(), g=a.createGain(); o.type=bad?'sawtooth':'triangle'; o.frequency.setValueAtTime(bad?140:520,a.currentTime); o.frequency.exponentialRampToValueAtTime(bad?60:880,a.currentTime+.25); g.gain.setValueAtTime(.12,a.currentTime); g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.35); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+.4); }

let S=null;
function home(){
  S=null;
  const done = Object.values(cleared).filter(v=>v!=='cold').length;
  app.innerHTML = `
  <header class="hero">
    <div class="eyebrow">Case files · 実在の事件 ${CASES.length}件</div>
    <h1><span class="strike">完全犯罪</span>を暴け</h1>
    <p>「完全犯罪」に近かった実在の事件を、捜査する側から追う紙芝居ゲーム。関係者の話を聞き、証拠を選ぶ。判断を誤るたびに捜査は遅れ、${LIMIT}回で迷宮入りになる。犯人が見落とした一点を見つけ出そう。</p>
    <div class="rules"><span>タップで話が進む</span><span>選択で証拠を集める</span><span>誤り${LIMIT}回で迷宮入り</span><span class="mono">解決 ${done}/${CASES.length}</span></div>
  </header>
  <div class="list">
    ${CASES.map((c,i)=>{ const r=cleared[c.id];
      const seal = r==null?`<span class="seal none">未着手</span>`:(r==='cold'?`<span class="seal none">迷宮入り</span>`:`<span class="seal">${RANK[r]}</span>`);
      return `<button class="case" data-i="${i}"><span class="thumb">${sceneSVG(c.intro[0][0]==='@'?c.intro[0].slice(1):c.bg)}</span><span class="nm"><span class="yr">${c.year} ・ ${esc(c.place)}</span><b>${esc(c.title)}</b><small>${esc(c.sub)}</small></span>${seal}</button>`; }).join('')}
  </div>
  <p class="note">登場する事件はすべて実在の事件です。亡くなった方とご家族がいる出来事として、暴力の描写は控えています。史実をもとに、場面と会話はゲーム用に組み立てた創作を含みます。事実関係に諸説ある部分は解説で触れています。</p>`;
  app.querySelectorAll('.case').forEach(b=>b.onclick=()=>start(+b.dataset.i));
  window.scrollTo(0,0);
}

function start(i){
  const c=CASES[i];
  S={i, step:-1, strikes:0, ev:[], dis:new Set(), queue:[], qi:0, after:null, typing:null, full:'', scene:null};
  app.innerHTML = `
  <div class="bar"><div class="l"><button class="sbtn" id="back">← 事件一覧</button><button class="sbtn" id="snd">音 ${sound?'ON':'OFF'}</button></div><div class="delay" id="delay"></div></div>
  <div class="file"><h2>${esc(c.title)}</h2><div class="meta">${c.year} ・ ${esc(c.place)} ・ ${esc(c.sub)}</div></div>
  <div class="board" id="board"></div>
  <div class="stage"><div class="card" id="card"></div></div>
  <div class="dlg" id="dlg" tabindex="0" role="button" aria-label="次へ"><span class="who" id="who" hidden></span><div class="txt" id="txt"></div><span class="more" id="more">▼ タップで次へ</span></div>
  <div class="choices" id="choices"></div>`;
  document.getElementById('back').onclick=()=>{ stopType(); home(); };
  document.getElementById('snd').onclick=e=>{ sound=!sound; save(); e.target.textContent='音 '+(sound?'ON':'OFF'); };
  const dlg=document.getElementById('dlg');
  dlg.onclick=advance; dlg.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); advance(); } };
  drawDelay(); drawBoard();
  setScene(c.bg, true);
  play(c.intro, ()=>startStep(0));
}

function drawDelay(){ document.getElementById('delay').innerHTML='捜査の遅れ '+Array.from({length:LIMIT},(_,k)=>`<i class="${k<S.strikes?'on':''}"></i>`).join(''); }
function drawBoard(fresh){ document.getElementById('board').innerHTML = `<span class="lbl">証拠</span>`+(S.ev.length?S.ev.map(e=>`<span class="chip ${e===fresh?'new':''}">${esc(e)}</span>`).join(''):'<span class="lbl">まだない</span>'); }

function setScene(spec, instant){
  if(!spec || spec===S.scene) return;
  S.scene=spec;
  const card=document.getElementById('card'); if(!card) return;
  const old=card.querySelector('.layer:not(.out)');
  const nl=document.createElement('div'); nl.className='layer'; nl.innerHTML=sceneSVG(spec);
  card.insertBefore(nl, card.firstChild);
  if(old && !instant){ old.classList.add('out'); clack(); setTimeout(()=>old.remove(),720); }
  else if(old) old.remove();
}
function stamp(text, bad){
  const card=document.getElementById('card'); if(!card) return;
  const s=document.createElement('div'); s.className='stampov '+(bad?'bad':'good'); s.innerHTML=`<span>${esc(text)}</span>`;
  card.appendChild(s); setTimeout(()=>s.remove(),950);
  if(bad){ card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
  thud(bad);
}

function play(lines, after){ S.queue=lines.slice(); S.qi=0; S.after=after; document.getElementById('choices').innerHTML=''; showLine(); }
function showLine(){
  while(S.qi<S.queue.length && S.queue[S.qi][0]==='@'){ setScene(S.queue[S.qi].slice(1)); S.qi++; }
  if(S.qi>=S.queue.length){ const f=S.after; S.after=null; if(f) f(); return; }
  const line=S.queue[S.qi]; const k=line.indexOf('|');
  const who=document.getElementById('who'), txt=document.getElementById('txt');
  let name='', body=line;
  if(k>0){ name=line.slice(0,k); body=line.slice(k+1); }
  if(name){ who.hidden=false; who.textContent=name; who.style.background = nameColor(name); }
  else who.hidden=true;
  txt.className='txt'+(name?'':' narr')+(/^（.*）$/.test(body)?' think':'');
  typeText(txt, body);
  document.getElementById('more').hidden=false;
}
function nameColor(n){ const me=CASES[S.i].me; if(n===me||n==='あなた') return '#e8b923';
  const pal=['#cfd6de','#f0b7a8','#a8d0f0','#b8e0b0','#e0c8f0','#f0d8a0']; let h=0; for(const ch of n) h=(h*31+ch.charCodeAt(0))%997; return pal[h%pal.length]; }
function typeText(el, s){
  stopType(); S.full=s; el.textContent=''; let i=0;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ el.textContent=s; return; }
  S.typing=setInterval(()=>{ i++; el.textContent=s.slice(0,i); if(i%3===0) tick(); if(i>=s.length) stopType(); }, 32);
}
function stopType(){ if(S&&S.typing){ clearInterval(S.typing); S.typing=null; } }
function advance(){
  if(!S || S.qi>=S.queue.length) return;
  if(S.typing){ stopType(); document.getElementById('txt').textContent=S.full; return; }
  S.qi++; showLine();
}

function startStep(k){
  const c=CASES[S.i]; S.step=k; S.dis=new Set();
  const st=c.steps[k];
  setScene(st.bg);
  play([...(st.d||[]), st.q], showChoices);
}
function showChoices(){
  const st=CASES[S.i].steps[S.step];
  document.getElementById('more').hidden=true;
  const box=document.getElementById('choices');
  box.innerHTML = `<div class="hint mono">捜査 ${S.step+1} / ${CASES[S.i].steps.length}</div>` + st.c.map((ch,k)=>`<button class="ch" data-k="${k}" ${S.dis.has(k)?'disabled':''}>${esc(ch.t)}</button>`).join('');
  box.querySelectorAll('.ch').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  ac();
}
function pick(k){
  const c=CASES[S.i], st=c.steps[S.step], ch=st.c[k];
  document.getElementById('choices').innerHTML='';
  if(ch.bg) setScene(ch.bg);
  if(ch.ok){
    S.ev.push(ch.ev);
    setTimeout(()=>{ stamp('証拠', false); drawBoard(ch.ev); }, ch.bg?650:0);
    play([...(ch.s||[]), ch.r, `手がかりを得た：${ch.ev}`], ()=>{
      if(S.step+1<c.steps.length) startStep(S.step+1); else end(false);
    });
  } else {
    S.dis.add(k); S.strikes++; drawDelay(); stamp('捜査遅延', true);
    play([...(ch.s||[]), ch.r], ()=>{
      if(S.strikes>=LIMIT) end(true);
      else { setScene(st.bg); play([st.q], showChoices); }
    });
  }
}

function end(cold){
  stopType();
  const c=CASES[S.i], prev=cleared[c.id];
  if(cold){ if(prev==null) cleared[c.id]='cold'; }
  else { const r=Math.min(S.strikes,2); if(prev==null||prev==='cold'||r<prev) cleared[c.id]=r; }
  save();
  app.innerHTML = `
  <div class="bar"><div class="l"><button class="sbtn" id="back">← 事件一覧</button></div><div class="delay" id="delay"></div></div>
  <div class="file"><h2>${esc(c.title)}</h2><div class="meta">${c.year} ・ ${esc(c.place)} ・ ${esc(c.sub)}</div></div>
  <div class="board" id="board"></div>
  <div class="verdict">
    <div class="big ${cold?'cold':''}">${cold?'迷宮入り':RANK[Math.min(S.strikes,2)]}</div>
    <div class="mono" style="color:var(--mute);font-size:13px">誤り ${S.strikes} 回 ・ 証拠 ${S.ev.length} 点</div>
    ${cold?`<p style="margin:0;max-width:52ch">あなたの捜査は行き詰まった。だが現実の捜査員たちは、ここで見落とさなかった。実際に何が起きたのかを見てみよう。</p>`:''}
  </div>
  <div class="sec"><h3>犯人の誤算</h3><p>${esc(c.flaw)}</p></div>
  <div class="sec"><h3>捜査を動かしたもの</h3><p>${esc(c.key)}</p></div>
  <div class="sec"><h3>その後の史実</h3><p>${esc(c.history)}</p></div>
  <div class="sec"><h3>正しい捜査の流れ</h3><dl class="facts">${c.steps.map((s,k)=>`<dt>${k+1}</dt><dd>${s.c.filter(x=>x.ok).map(x=>esc(x.t)).join(' / ')}</dd>`).join('')}</dl></div>
  <button class="go" id="retry">${cold?'もう一度捜査する':'別の事件へ'}</button>`;
  drawDelay(); drawBoard();
  document.getElementById('back').onclick=home;
  document.getElementById('retry').onclick = cold ? ()=>start(S.i) : home;
  window.scrollTo(0,0);
}

home();
</script>
