<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="マジックシティの坑道20階に挑む、3Dダンジョン×一騎打ちRPG。">
<title>マジックシティ地下迷宮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
/* Layout: the 3D mine fills the screen; a status strip on top, the minimap at the right, the action button and
   the bag/方針/menu buttons at the bottom. Windows are Magic City's PS1-blue windows. The 一騎打ち opens over it all. */
:root{
  --bg:#05070c; --win1:#27477f; --win2:#0c1736; --line:#e3e9f2; --text:#f4f6fa; --dim:#a9b8cf;
  --ore:#e5866a; --bulb:#edbb52; --pine:#62be96; --red:#ff6b5e; --soul:#8fd8ff;
  --dot:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --disp:"Big Shoulders Display","Arial Narrow",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--dot);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--bulb);outline-offset:2px}
[hidden]{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.win{background:linear-gradient(180deg,var(--win1),var(--win2));border:2px solid var(--line);border-radius:7px;box-shadow:0 0 0 2px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.4);text-shadow:1px 1px 0 #000;padding:10px 12px}
.pb{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:6px 12px;border-radius:5px;border:1px solid rgba(255,255,255,.4);background:rgba(10,18,40,.7);cursor:pointer;text-shadow:1px 1px 0 #000;text-align:center}
.pb:active{transform:translateY(1px)}
.pb.pri{background:var(--bulb);color:#1d1405;text-shadow:none;font-weight:700;border-color:#fff8}
.pb.on{background:var(--bulb);color:#1d1405;text-shadow:none}
.pb:disabled{opacity:.4;cursor:default}
.pb small{font-size:.7rem;opacity:.85}
.dim{color:var(--dim)}
.lab{font-family:var(--disp);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:.76rem;color:var(--dim);text-shadow:none}
.layer{position:fixed;inset:0;pointer-events:none;padding:max(8px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.layer>*{pointer-events:auto}

/* ---------- title ---------- */
#title{position:fixed;inset:0;z-index:20;overflow-y:auto;touch-action:pan-y;background:radial-gradient(800px 500px at 50% -10%,#1a2a4a,rgba(5,7,12,.88) 70%)}
#title .col{width:100%;max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.logo{text-align:center;margin-top:5vh;text-shadow:3px 3px 0 #000}
.logo small{display:block;font-family:var(--disp);letter-spacing:.42em;color:var(--bulb);font-size:.9rem}
.logo b{display:block;font-family:var(--disp);font-weight:800;font-size:clamp(2.8rem,15vw,4.6rem);line-height:.9;color:#fff6e2}
.logo b i{font-style:normal;color:var(--ore)}
.logo span{display:block;margin-top:6px;font-size:1.2rem;letter-spacing:.3em}
.tmenu{display:grid;gap:8px}
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hcard{display:grid;justify-items:center;gap:4px;padding:10px 8px;border-radius:7px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);cursor:pointer;text-align:center}
.hcard img{width:84px;height:84px;border-radius:50%;border:2px solid var(--line);background:#000}
.hcard b{font-size:1.15rem}.hcard small{font-size:.75rem;color:var(--dim);line-height:1.35}
.hcard[aria-pressed=true]{border-color:var(--bulb);background:rgba(237,187,82,.16)}
.diffs{display:grid;gap:6px}
.dbtn{display:grid;grid-template-columns:6.4em 1fr;gap:8px;align-items:center;text-align:left;padding:7px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.25);cursor:pointer}
.dbtn b{font-size:1.02rem}.dbtn small{font-size:.75rem;color:var(--dim)}
.dbtn[aria-pressed=true]{border-color:var(--bulb);background:rgba(237,187,82,.16)}
.clr{color:var(--bulb);margin-left:4px}
.how{font-size:.82rem;color:var(--dim)}
.how summary{cursor:pointer;color:var(--bulb);padding:4px 0}
.how ul{margin:4px 0;padding-left:1.2em;display:grid;gap:4px}
.how b{color:var(--text)}
.gfx{display:flex;gap:6px;align-items:center;justify-content:center;font-size:.8rem}
.gfx .pb{min-height:32px;padding:2px 10px}

/* ---------- explore HUD ---------- */
#hud{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(118px,calc(env(safe-area-inset-right,0px) + 108px));top:max(8px,env(safe-area-inset-top,0px));display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 10px}
.fl{font-family:var(--disp);font-weight:800;font-size:1.5rem;line-height:1;text-align:center}
.fl small{display:block;font-family:var(--dot);font-size:.66rem;font-weight:400;color:var(--dim)}
.bars{display:grid;gap:3px;min-width:0}
.brow{display:grid;grid-template-columns:auto minmax(44px,1fr) auto;gap:5px;align-items:center;font-size:.76rem}
@media (max-width:400px){#hud{gap:6px;padding:5px 8px}.fl{font-size:1.25rem}.brow{font-size:.7rem;gap:4px}.side{font-size:.7rem}}
.brow b{font-weight:400;color:var(--dim);white-space:nowrap;overflow:hidden}
.brow span{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:9px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pine);transition:width .2s}
.bar i.low{background:var(--red)}.bar.full i{background:var(--bulb)}
.side{text-align:right;font-size:.78rem;line-height:1.35}
.side b{color:var(--bulb)}
.st{display:inline-block;font-size:.66rem;padding:0 4px;border-radius:3px;background:#5b2a7a;margin-left:3px}
.st.soul{background:#1e5a7a}
#mini{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:max(8px,env(safe-area-inset-top,0px));width:100px;height:100px;image-rendering:pixelated;border:2px solid var(--line);border-radius:6px;background:rgba(0,0,0,.55);pointer-events:none}
#msg{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(120px,calc(env(safe-area-inset-right,0px) + 110px));bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 64px);display:grid;gap:2px;pointer-events:none}
#msg p{margin:0;font-size:.8rem;line-height:1.35;padding:2px 8px;background:rgba(5,9,20,.72);border-radius:4px;text-shadow:1px 1px 0 #000;justify-self:start;max-width:100%}
#msg p:not(:last-child){opacity:.6}
#act{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 8px);min-width:200px;min-height:50px;border-radius:26px;background:var(--bulb);color:#1d1405;text-shadow:none;font-weight:700;border:2px solid #fff;box-shadow:0 4px 0 #6b4b10}
.rbtn{position:absolute;right:max(10px,env(safe-area-inset-right,0px));display:grid;gap:6px;bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 64px)}
.rbtn .pb{min-width:96px;min-height:40px;font-size:.85rem}
.hint{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:calc(max(8px,env(safe-area-inset-top,0px)) + 74px);font-size:.72rem;color:#fffc;text-shadow:1px 1px 0 #000;pointer-events:none;max-width:40%}
#stick{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(10,20,40,.35);pointer-events:none;display:none;z-index:6}
#stick.on{display:block}
#stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.7);border:2px solid #fff}

/* ---------- windows ---------- */
.ov{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45);padding:10px max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));touch-action:pan-y}
.ov.mid{align-items:center}
.ov .win{width:100%;max-width:540px;max-height:88%;overflow-y:auto}
.ov h2{margin:0 0 6px;font-size:1.15rem;font-weight:400;color:var(--bulb)}
.ov p{margin:4px 0}
.choices{display:grid;gap:6px;margin-top:10px}
.choices.two{grid-template-columns:1fr 1fr}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}
.tabs .pb{min-height:36px;padding:2px;font-size:.84rem}
.list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;padding:7px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.22);cursor:pointer}
.li .ic{text-align:center;font-size:1.1rem}
.li small{display:block;font-size:.72rem;color:var(--dim);line-height:1.3}
.li .r{font-size:.8rem;color:var(--dim);white-space:nowrap;text-align:right}
.li.sel{border-color:var(--bulb);background:rgba(237,187,82,.14)}
.li.eqd{border-color:rgba(98,190,150,.7)}
.dur{display:inline-block;width:46px;height:5px;background:rgba(255,255,255,.18);vertical-align:middle;margin-left:4px}
.dur i{display:block;height:100%;background:var(--pine)}.dur.low i{background:var(--red)}
.det{margin-top:8px;padding:8px;border-radius:6px;background:rgba(0,0,0,.3);font-size:.85rem}
.det ul{margin:4px 0;padding-left:1.1em}
.det .bl{color:#ffd58a}
.cmp{font-size:.78rem}.cmp .up{color:var(--pine)}.cmp .dn{color:var(--red)}
.who2{display:flex;gap:6px;margin-bottom:8px}.who2 .pb{flex:1;min-height:34px}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:3px 10px;font-size:.88rem;align-items:center}
.kv dt{color:var(--dim)}.kv dd{margin:0;font-variant-numeric:tabular-nums}.kv .nx{color:var(--pine);font-size:.78rem}
.pent{display:block;margin:0 auto;width:min(230px,70%)}
.techs{display:flex;flex-wrap:wrap;gap:5px}
.tch{font-size:.8rem;padding:3px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.25)}
.tch.off{opacity:.4}.tch.sp{border-color:var(--bulb);color:var(--bulb)}
.lv{margin:6px 0;padding:8px;border-radius:6px;background:rgba(237,187,82,.12);border:1px solid rgba(237,187,82,.5)}
.lv b{color:var(--bulb)}
.lvg{display:grid;grid-template-columns:auto auto auto auto;gap:2px 10px;font-size:.84rem;margin-top:4px}
.lvg .ng{color:var(--red);font-size:.74rem}
/* the bag: a sheet with a header, icon tabs, a scrolling body and a detail panel with its actions */
.ov.sh{align-items:flex-end;padding-top:max(14px,env(safe-area-inset-top,0px))}
.ov.sh .win{padding:0;max-height:94%;height:94%;display:flex;flex-direction:column;overflow:hidden}
.sheet{display:flex;flex-direction:column;height:100%;min-height:0}
.shd{display:grid;grid-template-columns:52px 1fr auto auto;gap:10px;align-items:center;padding:10px 12px 8px;border-bottom:1px solid rgba(255,255,255,.18)}
.shd img{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:#000}
.shn{min-width:0;display:grid;gap:3px}.shn b{font-size:1.05rem;font-weight:400}.shn b small{color:var(--bulb)}.shn>small{font-size:.74rem;color:var(--dim)}
.shd .pb{min-height:36px;padding:2px 10px;font-size:.8rem}.shd .x{width:38px;padding:0}
.stabs{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.2)}
.stabs button{display:grid;justify-items:center;gap:1px;padding:6px 2px 7px;border:0;background:none;color:var(--dim);font-size:.74rem;cursor:pointer;border-bottom:3px solid transparent}
.stabs button span{font-size:1.15rem;line-height:1}
.stabs button.on{color:var(--text);border-bottom-color:var(--bulb);background:rgba(237,187,82,.1)}
.sbody{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 14px;display:grid;align-content:start;gap:8px}
.sline{margin:0;font-size:.8rem;color:var(--dim)}.sline b{color:var(--text);font-weight:400}
.sdet{border-top:2px solid var(--bulb);background:rgba(5,10,24,.92);padding:10px 12px max(12px,env(safe-area-inset-bottom,0px));display:grid;gap:6px;max-height:46%;overflow-y:auto}
.sdet p{margin:0;font-size:.84rem}.dn2{font-size:1rem;font-weight:400;color:var(--bulb)}
.dl{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.8rem}.dl .bl{color:#ffd58a}
.acts2{display:flex;gap:6px;flex-wrap:wrap}.acts2 .pb{flex:1;min-width:30%}
.pb.warn{border-color:rgba(255,107,94,.7);color:#ffb0a8}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ggrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.gc{position:relative;display:grid;gap:2px;align-content:start;text-align:left;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);cursor:pointer;min-width:0}
.gc b{font-size:.86rem;font-weight:400;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.gc b em{font-style:normal;font-size:.6rem;color:#1d1405;background:var(--bulb);padding:0 4px;border-radius:2px;margin-left:4px;vertical-align:2px}
.gc small{font-size:.7rem;color:var(--dim);line-height:1.3}
.gc .gi{font-size:1rem;line-height:1}.gc .gi.big{font-size:1.5rem}
.gc .cnt{position:absolute;right:6px;top:6px;font-style:normal;font-size:.74rem;color:var(--bulb)}
.gc.sel{border-color:var(--bulb);background:rgba(237,187,82,.16)}.gc.eqd{border-color:rgba(98,190,150,.7)}
.gc.empty{cursor:default;opacity:.6;border-style:dashed}
.gc .dur{width:100%;margin:2px 0 0}
.bodyg{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media(min-width:480px){.bodyg{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.bodyg .det{grid-column:1/-1}}
.wrow{display:grid;grid-template-columns:4.2em 1fr;gap:6px;align-items:center;font-size:.78rem}
.wrow b{font-weight:400;color:var(--dim)}
.wcells{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.wcells span{font-size:.58rem;text-align:center;padding:2px 0;border-radius:2px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.3)}
.wcells span.on{background:rgba(237,187,82,.35);color:#fff;cursor:pointer}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:40;padding:8px 14px;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50;transition:opacity .35s}
#fade.on{opacity:1}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:45;transition:opacity .25s}
#duelw{position:fixed;inset:0;z-index:60;background:#0b1519;transition:opacity .25s}
#duelw.idle{opacity:0;pointer-events:none;visibility:hidden}
#duelw iframe{border:0;width:100%;height:100%;display:block}
#boot{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:#000;color:var(--dim);font-family:var(--disp);letter-spacing:.3em;text-align:center;padding:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tach{font-size:.85rem;color:var(--gold,#e8c872);margin:.7rem 0 .35rem}.tacr{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}.tacr .pb{flex-direction:column;padding:.55rem .2rem;text-align:center}.tacr .pb small{display:block;font-size:.7rem;opacity:.8;margin-top:.15rem}
.gc .gtag{display:inline-block;align-self:flex-start;justify-self:start;max-width:max-content;white-space:nowrap;width:auto;font-style:normal;font-size:.62rem;padding:.05rem .35rem;border-radius:.6rem;margin-top:.2rem;border:1px solid #5a6a90;color:#b8c4e0}.gc .gtag.hv{border-color:#c0703a;color:#f0a070}.gc .gtag.lt{border-color:#4aa0c8;color:#8fd0f0}.gc .gtag.no{opacity:.55;text-decoration:line-through}
.sens{margin:.7rem 0}.sens b{display:block}.sens small{display:block;opacity:.75;font-size:.75rem;margin:.1rem 0 .35rem}.srow{display:flex;align-items:center;gap:.5rem}.srow input{flex:1;accent-color:#e8c872}.srow .pb{width:2.6rem;flex:none;justify-content:center}.srow em{font-style:normal;width:1.4rem;text-align:center;font-weight:700}
</style>
</head>
<body>

<canvas id="gl"></canvas>
<div class="layer" id="explore" hidden>
  <div class="win" id="hud"></div>
  <canvas id="mini" width="72" height="72"></canvas>
  <div id="msg"></div>
  <button class="pb" id="act" hidden></button>
  <div class="rbtn"><button class="pb" id="bRest">⛺ 休む</button><button class="pb" id="bBag">🎒 持ち物</button><button class="pb" id="bTac">⚑ 方針</button><button class="pb" id="bMenu">≡ メニュー</button></div>
  <p class="hint" id="hint">画面下半分を押して移動・上半分をドラッグで見回す／WASD・矢印キー、Q E で視点、Space で調べる</p>
</div>
<div id="stick"><i></i></div>
<section id="title" hidden><div class="col" id="tcol"></div></section>
<div id="ov" class="ov" hidden></div>
<div id="toast" class="win"></div>
<div id="flash"></div>
<div id="fade"></div>
<div id="boot">LOADING…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const T = THREE;

const NUTSUM = 30, NUTFULL = 15, NUT_DIGEST = .01;   // cap; what counts as well fed; how fast meals are digested per point of hunger
const need = L => Math.round(10 * Math.pow(L, 1.25));
const xpBase = F => 3 + 2.4 * (F - 1);
function share(nut) {
  const keys = NUT.map(n => n[0]), v = keys.map(k => Math.max(0, nut[k] || 0)), sum = v.reduce((a, b) => a + b, 0) || 1;
  const tot = Math.max(3, Math.round(10 * Math.min(1, sum / NUTFULL)));   // underfed: fewer points to share
  const raw = v.map(x => tot * x / sum), pts = raw.map(Math.floor); let left = tot - pts.reduce((a, b) => a + b, 0);
  raw.map((r, i) => [r - pts[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (left > 0 && v[i] > 0) { pts[i]++; left--; } });
  return { mhp: 5 + pts[2] * 2, atk: pts[0], def: pts[1], dex: pts[3], spd: pts[4] };
}
function eat(h, nu) {
  if (!nu) return; const N = h.nut;
  for (const [k, v] of Object.entries(nu)) N[k] = (N[k] || 0) + v;
  const s = Object.values(N).reduce((a, b) => a + b, 0);
  if (s > NUTSUM) for (const k in N) N[k] = Math.round(N[k] * NUTSUM / s * 100) / 100;
}
function gainXp(h, xp) {
  const out = []; h.xp += xp;
  while (h.xp >= need(h.lv) && h.lv < 99) {

    out.push({ lv: h.lv, g, who: h.k });
  }
  return out;
}

>\n\n<section id=\"sel\" hidden>\n  <header class=\"hero\">\n    <p class=\"eyebrow\">武力で戦い、方言で語り合う<\/p>\n    <h1>一騎打ち<\/h1>\n    <p class=\"sub\">武将を選び、間合いを読んで斬り合う。武将たちはお国言葉で語りながら戦う。方針(四字熟語)を選んで戦い方を決めよう。<\/p>\n    <details class=\"how\" id=\"howD\">\n      <summary>あそびかた<\/summary>\n      <ul>\n        <li><b>戦い<\/b>　技は間合い（密着・近・中・遠）に応じて自動で選ばれる。小技は当たりやすく、大技は外れやすいが強い。ガッツが尽きると技は出せない。<\/li>\n        <li><b>距離<\/b>　最初は自動。B で手動に切り替え、C＝下がる、M＝近づく、Space＝吹き飛ばし。密着すると吹き飛ばされて最遠まで離れる。<\/li>\n        <li><b>能力<\/b>　体力＝HP、攻撃・防御はそのまま、知力＝知略技の威力、統率＝命中、回避＝100−防御、ガッツ回復＝その武将の最も高い能力、無双値＝必殺技の派手さ（派手なほど必要ガッツが多い）。<\/li>\n        <li><b>底力<\/b>　体力が半分以下になると発動することがある。命中・威力・ガッツ回復・回避が上がる。<\/li>\n        <li><b>方言<\/b>　武将は人柄に合わせた方言で話す(張飛は河内、劉備は京都、曹操は標準語…)。音声は中国語(字幕は日本語)で、「音声」ボタンで日本語・英語にも切り替えられる。<\/li>\n        <li><b>効果音の出典<\/b>　武器の音の一部は Battle for Wesnoth(GPL-2.0以降)の効果音を加工して使っている。<\/li>\n        <li><b>方針<\/b>　一気呵成・明鏡止水など13の四字熟語から戦い方を選べる。ポーズ中に変更もできる。相手も状況で方針を変える。<\/li>\n      <\/ul>\n    <\/details>\n    <p class=\"rec\" id=\"rec\"><\/p>\n  <\/header>\n  <div class=\"ctl\">\n    <div class=\"grp\"><span class=\"lbl\">戦場<\/span><div class=\"seg\" id=\"segSt\"><\/div><p class=\"lvd\" id=\"std\"><\/p><\/div>\n    <div class=\"grp\"><span class=\"lbl\">勢力<\/span><div class=\"seg\" id=\"segFac\"><\/div><\/div>\n    <div class=\"grp\"><span class=\"lbl\">相手をおまかせ<\/span><div class=\"seg\" id=\"segPick\"><\/div><\/div>\n  <\/div>\n  <div class=\"cols\">\n    <div><h2 class=\"me\">自分の武将<\/h2><div class=\"list me\" id=\"listMe\"><\/div><\/div>\n    <div><h2 class=\"foe\">相手の武将<\/h2><div class=\"list foe\" id=\"listFoe\"><\/div><\/div>\n  <\/div>\n  <div class=\"dock\">\n    <div>\n      <div class=\"vs\" id=\"vs\"><\/div>\n      <details class=\"cmp\">\n        <summary>能力を比べる<\/summary>\n        <div class=\"odds\" id=\"odds\"><\/div>\n      <\/details>\n    <\/div>\n    <div class=\"goRow\"><button class=\"btn primary big\" id=\"go\">いざ、尋常に勝負<\/button><button class=\"btn primary big musou\" id=\"goMu\">無双モード<\/button><\/div>\n  <\/div>\n<\/section>\n\n<section id=\"duel\" hidden>\n  <div class=\"arena\" id=\"arena\">\n    <svg class=\"hills\" viewBox=\"0 0 800 120\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M0 120 L0 70 C60 40 110 50 170 68 C230 86 280 30 350 36 C420 42 470 80 540 60 C610 40 690 20 800 64 L800 120 Z\"/><\/svg>\n    <div class=\"ground\"><\/div>\n    <div class=\"seal big me\" id=\"sealMe\"><\/div>\n    <div class=\"seal big foe\" id=\"sealFoe\"><\/div>\n    <div class=\"clash\" id=\"clash\"><svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><path d=\"M12 88 L88 12\"/><path d=\"M12 12 L88 88\"/><\/svg><\/div>\n    <div class=\"rays\" id=\"rays\"><\/div><div id=\"fullflash\"><\/div><div id=\"hitfx\"><\/div><div id=\"speedfx\"><\/div>\n    <div class=\"flash\" id=\"flash\"><\/div>\n    <div class=\"tech\" id=\"tech\"><\/div>\n    <div class=\"cut\" id=\"cut\"><\/div>\n    <div class=\"vig\" id=\"vig\"><\/div>\n    <div class=\"heat\" id=\"heat\" hidden><i><\/i><b>熱狂<\/b><\/div>\n    <div class=\"combo\" id=\"combo\"><\/div>\n    <div class=\"slash\" id=\"slash\"><\/div>\n    <div class=\"lockui\" id=\"lockui\" hidden><b>つばぜり合い!<\/b><div class=\"tug\"><i><\/i><\/div><small><\/small><\/div>\n  <\/div>\n  <div class=\"ov\" id=\"ov\">\n    <div class=\"hud\" id=\"hud\"><\/div>\n    <div class=\"top\">\n      <span class=\"t2\" id=\"lvTag\"><\/span>\n      <button class=\"btn mini\" id=\"spd\">速度 ×1<\/button>\n      <button class=\"btn mini\" id=\"vc\">声 日本語<\/button>\n      <button class=\"btn mini\" id=\"snd\">音 全部<\/button>\n      <button class=\"btn mini\" id=\"gore\" type=\"button\">流血 あり<\/button>\n      <button class=\"btn mini\" id=\"qual\" type=\"button\">画質 高<\/button>\n      <button class=\"btn mini\" id=\"pause\">一時停止<\/button>\n      <button class=\"btn mini\" id=\"stNow\" type=\"button\">方針<\/button>\n      <button class=\"btn mini\" id=\"quit\">降参<\/button>\n    <\/div>\n    <div class=\"stratP\" id=\"stratP\" hidden><b id=\ :'孫堅',az:'文台',en:'Sun Jian',p:98,f:'呉',s:'堅',w:'曲刀'},\n {id:'zhout',n:'周泰',az:'幼平',en:'Zhou Tai',p:94,f:'呉',s:'泰',w:'大剣'},\n {id:'lingt',n:'凌統',az:'公績',en:'Ling Tong',p:92,f:'呉',s:'凌',w:'三節棍'},\n {id:'luxun',n:'陸遜',az:'伯言',en:'Lu Xun',p:76,f:'呉',s:'遜',w:'双剣'},\n {id:'lumeng',n:'呂蒙',az:'子明',en:'Lu Meng',p:85,f:'呉',s:'蒙',w:'剣'},\n {id:'huanggai',n:'黄蓋',az:'公覆',en:'Huang Gai',p:90,f:'呉',s:'蓋',w:'鞭'},\n {id:'sunq',n:'孫権',az:'仲謀',en:'Sun Quan',p:76,f:'呉',s:'権',w:'宝剣'},\n {id:'gongsunz',n:'公孫瓚',az:'伯珪',en:'Gongsun Zan',p:94,f:'群',s:'瓚',w:'槍'},\n {id:'zhangx',n:'張繍',az:'',en:'Zhang Xiu',p:95,f:'群',s:'繍',w:'槍'},\n {id:'matengg',n:'馬騰',az:'寿成',en:'Ma Teng',p:92,f:'群',s:'騰',w:'槍'},\n {id:'dongz',n:'董卓',az:'仲穎',en:'Dong Zhuo',p:98,f:'群',s:'卓',w:'大鎚'},\n {id:'yanl',n:'顔良',az:'',en:'Yan Liang',p:96,f:'群',s:'顔',w:'大刀'}\n);\nconst PH={train:'修練',open:'口上',mid:'打ち合いの最中',lowMe:'劣勢 ・ 踏みとどまれ',lowFoe:'好機 ・ 決めにいけ'};\nconst FXT={\n train:{ok:'',ng:''},\n open:{ok:'正解 → 先手を取り、4合のあいだ有利',ng:'不正解 → 相手が3合のあいだ有利'},\n mid:{ok:'正解 → 3合のあいだ有利',ng:'不正解 → 相手が2合のあいだ有利'},\n lowMe:{ok:'正解 → 体力が12回復し、4合のあいだ有利',ng:'不正解 → 相手が3合のあいだ有利'},\n lowFoe:{ok:'正解 → 追撃18ダメージ、3合のあいだ有利',ng:'不正解 → 相手が体力8回復し、3合のあいだ有利'}\n};\n\n/* ================= ENGINE ================= */\nconst CFG={k:0.0035,boostP:0.045,boostDmg:1.1,crit:0.12,lowAt:30,midEvery:4,midMax:4};\nconst clamp=(x,a,b)=>Math.max(a,Math.min(b,x));\nconst ST={\n plain:{n:'平原',d:'癖のない戦場。効果なし',dmg:1,crit:0,cmp:1,regen:1},\n desert:{n:'砂漠',d:'熱砂で防御が下がる。ダメージ+12%（決着が早い）',dmg:1.12,crit:0,cmp:1,regen:1},\n mountain:{n:'山岳',d:'足場が悪く、武力差が出にくい（逆転しやすい）',dmg:1,crit:0,cmp:.8,regen:1},\n river:{n:'河原',d:'濡れた石で足が滑る。会心が出やすい（+5%）',dmg:1,crit:.05,cmp:1,regen:1},\n snow:{n:'雪原',d:'雪で動きが鈍る。ダメージ−12%・ガッツ回復が遅い',dmg:.88,crit:0,cmp:1,regen:.85},\n night:{n:'夜の陣',d:'闘志が燃える。ガッツの回復が速い（1.4倍）',dmg:1,crit:0,cmp:1,regen:1.4}\n};\nconst HZ={\n desert:{k:'sand',t:'砂嵐!',d:'7秒間、技が当たりにくくなる',set:function(d){d.hzK='sand';d.hzT=7;}},\n mountain:{k:'rock',t:'落石!',d:'岩がどちらかを襲う（−7）',set:function(d,side){d.hp[side]=Math.max(1,d.hp[side]-7);}},\n river:{k:'splash',t:'水しぶき!',d:'7秒間、会心が出やすい',set:function(d){d.hzK='splash';d.hzT=7;}},\n snow:{k:'snow',t:'吹雪!',d:'7秒間、ダメージが7割',set:function(d){d.hzK='snow';d.hzT=7;}},\n night:{k:'fire',t:'松明が倒れた!',d:'炎が燃え上がり、両者のガッツが40回復',set:function(d){d.gu[0]=Math.min(100,d.gu[0]+40);d.gu[1]=Math.min(100,d.gu[1]+40);}}\n};\nfunction newDuel(){return {gu:[60,60],pos:[-2,2],hzT:0,hzK:'',hp:[100,100],hpMax:[100,100],boost:[0,0],rd:0,opened:true,lowMe:true,lowFoe:true,midCount:CFG.midMax,nextMid:CFG.midEvery};}\nfunction pWin(d,me,foe){\n  const st=ST[d.st||'plain'];\n  let p=0.5+(me.p-foe.p)*CFG.k;\n  if(d.boost[0]>0)p+=CFG.boostP*st.boost;\n  if(d.boost[1]>0)p-=CFG.boostP*st.boost;\n  p=0.5+(p-0.5)*st.cmp;\n  if(d.hzN>0&&d.hzCmp)p=0.5+(p-0.5)*d.hzCmp;\n  return clamp(p,0.12,0.88);\n}\nfunction doRound(d,me,foe,rnd){\n  rnd=rnd||Math.random;\n  d.rd++;\n  const p=pWin(d,me,foe);\n  const w=rnd()<p?0:1,l=1-w;\n  let dmg=8+Math.floor(rnd()*7);\n  const boosted=d.boost[w]>0,st=ST[d.st||'plain'];\n  if(boosted)dmg=Math.round(dmg*CFG.boostDmg);\n  const hz=d.hzN>0;\n  const crit=rnd()<CFG.crit+st.crit+(hz?(d.hzCrit||0):0);\n  if(crit)dmg=Math.round(dmg*1.6);\n  dmg=Math.max(1,Math.round(dmg*st.dmg*(hz&&d.hzDmg?d.hzDmg:1)));\n  d.hp[l]=Math.max(0,d.hp[l]-dmg);\n  d.boost[0]=Math.max(0,d.boost[0]-1);\n  d.boost[1]=Math.max(0,d.boost[1]-1);\n  if(d.hzN>0){d.hzN--;if(d.hzN<=0){d.hzCmp=d.hzCrit=d.hzDmg=0;}}\n  return {w:w,l:l,dmg:dmg,crit:crit,boosted:boosted};\n}\nfunction nextAction(d){\n  if(d.hp[0]<=0||d.hp[1]<=0)return {t:'end'};\n  if(!d.opened)return {t:'quiz',phase:'open'};\n  if(!d.lowMe&&d.hp[0]<=CFG.lowAt)return {t:'quiz',phase:'lowMe'};\n  if(!d.lowFoe&&d.hp[1]<=CFG.lowAt)return {t:'quiz',phase:'lowFoe'};\n  if(d.midCount<CFG.midMax&&d.rd>=d.nextMid)return {t:'quiz',phase:'mid'};\n  return {t:'round'};\n}\nfunction applyQuiz(d,phase,ok){\n  const cap=function(i){d.boost[i]=Math.min(6,d.boost[i]);};\n  if(phase==='open'){d.opened=true;if(ok)d.boost[0]+=4;else d.boost[1]+=3;}\n  else if(phase==='mid'){d.midCount++;d.nextMid+=CFG.midEvery;if(ok)d.boost[0]+=3;else d.boost[1]+=2;}\n  else if(phase==='lowMe'){d.lowMe=true;d.nextMid=Math.max(d.nextMid,d.rd+2);if(ok){d.hp[0]=Math.min(100,d.hp[0]+12);d.boost[0]+=4;}else d.boost[1]+=3;}\n  else if(phase==='lowFoe'){d.lowFoe=true;d.nextMid=Math.max(d.nextMid,d.rd+2);if(ok){d.hp[1]=Math.max(0,d.hp[1]-18);d.boost[0]+=3;}else{d.hp[1]=Math.min(100,d.hp[1]+8);d.boost[1]+=3;}}\n  cap(0);cap(1);\n}\nconst PREP_MAX=5;\nfunction simulate(me,foe,policy,n){\n  let wins=0;\n  for(let i=0;i<n;i++){\n    const d=newDuel();if(policy==='all')d.boost[0]=PREP_MAX*3;\n    for(;;){\n      if(d.hp[0]<=0||d.hp[1]<=0)break;\n      doRound(d,me,foe);\n    }\n    if(d.hp[1]<=0)wins++;\n  }\n  return wins/n;\n}\n/* /ENGINE */\n\n/* ================= UI ================= */\nconst $=function(s){return document.querySelector(s);};\nconst esc=function(s){return String(s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c];});};\nconst sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};\nconst RM=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);\nconst byId=function(id){return HEROES.find(function(h){return h.id===id;});};\nconst LS={\n  get:function(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},\n  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}\n};\nfunction shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}\nfunction anim(el,kf,opt){\n  if(RM||!el||!el.animate)return Promise.resolve();\n  try{return el.animate(kf,opt).finished.catch(function(){});}catch(e){return Promise.resolve();}\n}\n\nconst pref=LS.get('yd_pref',{});\nlet meId=byId(pref.me)?pref.me:'zhaoy';\nlet foeId=(byId(pref.foe)&&pref.foe!==meId)?pref.foe:'guan';\nlet stId=(pref ncat([['I give all I have!','全てを賭けて、斬る!'],['No more holding back!','もう手加減はせぬ!'],['Witness this!','刮目せよ!'],['This blade decides it!','この一太刀で決める!']]);\nLN.win=LN.win.concat([['Remember this day.','この日を、忘れるな。'],['A worthy opponent.','良き好敵手だった。']]);\nLN.lose=LN.lose.concat([['I am not done... someday.','いつか…必ず。'],['Well fought...','見事…だ…']]);\nLN.fury=[['I am not finished!','まだ終わらぬ!'],['Come, I am ready.','さあ来い、覚悟は出来ている!'],['Burn, my spirit!','燃えろ、我が闘志!'],['This is my true strength!','ここからが、本当の戦だ!'],['I will not fall!','倒れるものか!']];\nLN.taunt=[['Is that all you have?','その程度か?'],['Show me your resolve.','覚悟を見せてみろ。'],['Do not hesitate.','迷えば、斬られるぞ。'],['The ground is yours. Come.','間合いは譲ろう。来い。'],['I can wait all day.','いくらでも待とう。'],['Breathe. Then strike.','息を整えろ。それから来い。']];\nconst HL={\n lubu:{sp:[['Behold the strongest warrior!','天下無双、その目に焼き付けろ!']],fury:[['I am Lu Bu. I do not fall!','この呂布、膝など折らぬ!']],win:[['Heaven has no rival.','天に我が敵なし。']],lose:[['Impossible... for me...','この俺が…敗れるだと…!']],taunt:[['Is anyone worthy?','俺に挑む者は、まだいるか。']]},\n guan:{sp:[['Green Dragon, rise!','青龍よ、天を裂け!']],fury:[['My oath will not break.','義に誓った身、倒れはせぬ。']],win:[['Justice stands.','義は、ここにあり。']],lose:[['My brothers... forgive me.','兄者…すまぬ…']],taunt:[['Your blade is restless.','刃が迷っているぞ。']]},\n zhangf:{sp:[['Roar, Serpent Spear!','燕人張飛ここにあり!']],fury:[['Come on, I am not done!','まだだ! 終わらんぞ!']],win:[['Haha! Who is next?','はっはっは! 次は誰だ!']],lose:[['Brother... I tried.','兄者…俺は…']],taunt:[['Fight me like a man!','男なら正面から来い!']]},\n zhaoy:{sp:[['Seven in, seven out.','七たび突き、七たび抜ける。']],fury:[['I will protect them all.','この命、守るためにある。']],win:[['The dragon never falls.','龍は、墜ちぬ。']],lose:[['Forgive me, my lord...','殿…申し訳…']],taunt:[['Step closer if you dare.','踏み込めるものなら、来い。']]},\n mac:{sp:[['Thunder of the west!','西涼の雷、受けてみよ!']],fury:[['For the pride of Xiliang!','西涼の誇りにかけて!']],win:[['Brocade Ma Chao!','錦馬超の名、刻め!']],lose:[['I was too proud...','驕りか…無念…']],taunt:[['Faster than thunder.','雷より先に斬る。']]},\n dianw:{sp:[['Twin halberds, crush!','双戟よ、砕け散れ!']],fury:[['I will hold this gate!','この門、死んでも通さぬ!']],win:[['None passed.','誰一人、通さん。']],lose:[['My lord... run...','殿…お逃げ…を…']],taunt:[['Come, try the gate.','来い。この壁を越えてみろ。']]},\n xuc:{sp:[['Tiger fool smash!','虎痴の怒り、思い知れ!']],fury:[['I will not budge!','一歩も退かんぞ!']],win:[['Hahaha, easy.','ふはは、他愛もない。']],lose:[['I am out of strength...','力が…尽きたか…']],taunt:[['Call me a fool. I am strong.','愚直で結構。それが強さだ。']]},\n tsc:{sp:[['One arrow, one soul.','一矢、魂を射抜く!']],fury:[['A promise to keep.','約束は、果たす!']],win:[['I keep my word.','信義、果たした。']],lose:[['Shenting... again...','神亭の…続き…か…']],taunt:[['Do not blink.','瞬きするな。']]},\n suns:{sp:[['The Little Conqueror!','小覇王、ここに参る!']],fury:[['Sun Ce does not kneel!','孫策は膝をつかぬ!']],win:[['Jiangdong is mine.','江東は、俺のものだ。']],lose:[['Take care of them...','後を…頼む…']],taunt:[['Let us make history.','歴史を動かそうぜ。']]},\n zhangl:{sp:[['Eight hundred, charge!','八百の兵を以て、貴様を砕く!']],fury:[['Zhang Liao is here!','張遼ここにあり!']],win:[['Even children fear me.','泣く子も黙る張文遠!']],lose:[['My lord... forgive me.','殿…お許しを…']],taunt:[['Dare to come closer?','近づく勇気はあるか?']]},\n xhd:{sp:[['I will not waste this eye!','この目、無駄にはせぬ!']],fury:[['A gift from my parents!','親にもらった体、無駄にはせぬ!']],win:[['Heaven watched.','天も見ていたろう。']],lose:[['One eye... not enough...','隻眼では…及ばぬか…']],taunt:[['I fear nothing.','恐れなど、この目に宿らぬ。']]},\n gann:{sp:[['Hear the bells ring!','鈴の音が、貴様の最期だ!']],fury:[['Night raid spirit!','夜襲の気迫、見せてやる!']],win:[['The pirates win!','錦帆賊の名にかけて!']],lose:[['A good ride...','いい…旅路だった…']],taunt:[['The sea teaches fear.','海を知れば、恐れも知る。']]},\n huangz:{sp:[['One arrow, sure kill!','老いてなお、必中!']],fury:[['Old, but not done!','老骨に鞭打ち、まだ戦う!']],win:[['Call it experience.','老いではない、経験だ。']],lose:[['A fine end.','悪くない…最期だ…']],taunt:[['Do not mock my age.','年寄りと侮るな。']]},\n weiy:{sp:[['Rebel bones!','反骨の刃、受けよ!']],fury:[['No one rules me!','誰にも、俺は縛れん!']],win:[['See? This is me.','見たか、これが俺だ。']],lose:[['Even so... I rebel.','それでも…俺は…']],taunt:[['Order me. I dare you.','俺に命じてみろ。']]},\n jiangw:{sp:[['Kirin spear!','麒麟の槍、貫け!']],fury:[['His will lives in me!','丞相の志、我が身にあり!']],win:[['One more step forward.','また一歩、前へ。']],lose:[['Forgive me, Prime Minister...','丞相…申し訳…']],taunt:[['I have no road back.','退く道は、とうに捨てた。']]},\n liub:{sp:[['Benevolence, my blade!','仁の刃、受けよ!']],fury:[['For the people!','民のため、倒れられぬ!']],win:[['This is not victory. It is hope.','これは勝利ではない。希望だ。']],lose:[['My brothers...','関羽…張飛…']],taunt:[['I seek no fight. But...','争いは望まぬ。だが。']]},\n caoc:{sp:[['I rule this age!','乱世を統べる、この曹操!']],fury:[['I am not done with the world.','天下を取るまで、死ねぬ!']],win:[['Heaven is in my palm.','天下は我が掌中。']],lose:[['Fate mocks me.','運命め…笑うか…']],taunt:[['Impress me.','私を楽しませてみせろ。']]},\n zhouy:{sp:[['Flames and music!','炎よ、奏でよ!']],fury:[['The tune is not over.','曲は、まだ終わらぬ。']],win:[['A perfect melody.','見事な旋律だった。']],lose:[['Heaven... why Zhuge...','天よ…なぜ…']],taunt:[['You are out of tune.','音が乱れているな。']]},\n zhugel:{sp:[['The east wind is mine.','東風よ、我が意に従え。']],fury:[['All as expected.','すべて、計算のうちだ。']],win:[['As I read.','読み通りだ。']],lose:[['It is... the will of heaven...','天命…か…']],taunt:[['I have seen this move.','その手は、既に見た。']]},\n sima:{sp:[['The wolf turns its gaze.','狼顧の相、見せてやろう。']],fury:[['Patience ends here.','耐える時は、終わった。']],win:[['Time sided with me.','時は、私に味方した。']],lose:[['I waited too long...','待ちすぎたか…']],taunt:[['You will tire first.','先に疲れるのは、君だ。']]},\n pangd:{sp:[['Coffin or victory!','棺を背負う覚悟、見よ!']],fury:[['No retreat!','退くな。進め!']],win:[['Duty done.','忠義、果たした。']],lose:[['Loyal to the end.','忠を…貫けたか…']],taunt:[['My coffin is ready.','棺は、もう用意してある。']]},\n xuh:{sp:[['Axe of heaven!','断岳の斧、受けよ!']],fury:[['I protect my lord!','殿を守る、それだけだ!']],win:[['Order restored.','軍律は、保たれた。']],lose:[['Too slow...','遅れを取ったか…']],taunt:[['A ragged blade will not reach me.','乱れた刃では、届かぬ。']]},\n sunj:{sp:[['Tiger of Jiangdong!','江東の虎、咆哮せよ!']],fury:[['A tiger never kneels!','虎は、膝を屈せぬ!']],win:[['Jiangdong stands firm.','江東は、揺るがぬ。']],lose:[['My sons...','息子た protect what I love.','愛するものを守るためだ。']],\n  [['Your stance is perfect.','構えが見事だな。'],['Thank you. Yours too.','礼を言う。お前もな。']],\n  [['Let us end this quickly.','早く決着をつけよう。'],['Fine. Come on!','よかろう。来い!']],\n  [['I have heard your name.','名は聞いている。'],['Then you know my strength.','ならば強さも知っていよう。']],\n  [['Take a breath.','息を整えろ。'],['I am ready.','準備はできている。']],\n  [['Do not hold back.','手加減は無用だ。'],['I never do.','するものか。']]],\n crit:[\n  [['That was a clean hit!','見事に決まった!'],['Ugh... not bad.','ぐっ…やるな。']],\n  [['Give up now!','降参しろ!'],['Never!','断じて断る!']],\n  [['Feel my strength!','我が力を知れ!'],['I can take it!','耐えてみせる!']],\n  [['You are too slow!','遅すぎる!'],['We are not done yet.','勝負はこれからだ。']],\n  [['Is it over?','もう終わりか?'],['Not even close.','まだまだだ。']]],\n dodge:[\n  [['Too slow!','遅い!'],['Hm. You are quick.','ほう、素早いな。']],\n  [['I saw that coming.','読めていたぞ。'],['Then try this.','ならばこれはどうだ。']],\n  [['Missed me!','外れだ!'],['Next time, then.','次は外さん。']]],\n furyReply:[['What power...','なんという気迫…'],['He is still standing!','まだ立つか!'],['Impressive spirit.','見上げた闘志だ。'],['Now it gets interesting.','面白くなってきた。']]\n};\nfunction banter(pool,first){\n  if(S.talk||!B||B.over)return;S.talk=true;const tok=S.tok,pr=pick(pool);\n  say(first,pr[0],true);\n  setTimeout(function(){if(tok===S.tok&&B&&!B.over)say(1-first,pr[1],true);setTimeout(function(){S.talk=false;},1800);},3100/S.spd);\n}\n\n/* ---- 名台詞(演義・正史・創作などに由来。訳は意訳を含む) ---- */\nconst MEI={\n weiy:[['Is there anyone who can kill me?','誰か我を殺せる者はあるか!','mei']],\n zhangf:[['I am Zhang Yide of Yan! Who dares fight me to the death?','我こそは燕人張飛なり! 死を賭して戦う者は出てこい!','mei']],\n lubu:[['Among men, Lu Bu. Among horses, Red Hare.','人中に呂布あり、馬中に赤兎あり。','mei']],\n caoc:[['I would rather betray the world than let it betray me.','我、人に背くとも、人をして我に背かしめず。','mei'],['Only you and I are the true heroes.','天下の英雄は、君と私だけだ。','mei']],\n liub:[['Never think a good deed too small to do.','善は小さいからと言って、為さずにいてはならぬ。','mei'],['Zhuge Liang is to me as water is to a fish.','孔明を得たのは ao! Bring the torches!','錦馬超! 松明を灯せ!'],['mac','Zhang Fei! Even at night, I win!','張飛! 夜でも勝つのは俺だ!']]],\n 'dianw|zhangx':[[['zhangx','You are a living wall.','まるで動く壁だな。'],['dianw','Then break me, if you can.','なら、壊してみろ。']]],\n 'suns|zhouy':[[['suns','Gongjin, race you to the gate!','公瑾、門まで競争だ!'],['zhouy','Bold as ever, Bofu.','相変わらず豪胆だな、伯符。']]],\n 'liub|zhaoy':[[['zhaoy','My lord, I will carry your son.','殿、御子は、必ず私が。'],['liub','Zilong... do not die for a child.','子龍…子のために死ぬな。']]],\n 'jiangw|zhugel':[[['jiangw','Master, I will not fail you.','師よ、必ず期待に応えます。'],['zhugel','I leave the north to you.','北伐は、君に託す。']]],\n 'jiangw|sima':[[['sima','Your loyalty is admirable.','その忠義、見事だ。'],['jiangw','Wei will fall for Shu.','魏を倒し、蜀を興す。']]],\n 'huanggai|zhouy':[[['huanggai','Whip me harder, my lord!','都督、もっと強く打て!'],['zhouy','Your pain will win this war.','その痛みが戦に勝つ。']]],\n 'xhd|xhy':[[['xhy','Brother, are you ready?','兄者、準備はいいか?'],['xhd','Always, Miaocai.','いつでも、妙才。']]]\n};\nObject.assign(CONV,{\n meiReply:[['A fine line.','見事な啖呵だ。'],['Words are cheap. Show me.','口だけではないか、見せてもらおう。'],['Hm... I will remember that.','…覚えておこう。'],['Then prove it.','ならば証明してみせろ。']],\n guard:[[['Not enough!','足りぬ!'],['Hm, solid defense.','ほう、堅い守りだ。']],[['I blocked it.','受け止めたぞ。'],['Then I will break it.','ならば崩すまでだ。']]],\n chain:[[['Do not stop!','攻め続けろ!'],['Too fast...','速い…!']],[['Again!','もう一撃!'],['Ugh!','ぐっ!']]],\n lock:[[['Push!','押し切れ!'],['I will not lose!','負けぬ!']],[['Your strength...','なんという力…'],['Mine is stronger!','我が力の方が上だ!']]],\n low:[[['I am not done...','まだ…終わらぬ…'],['Then stand up.','ならば立て。']],[['It hurts, but I stand.','痛むが、立っている。'],['Respect.','敬意を払おう。']]],\n stage:{\n  snow:[[['It is freezing.','凍えるほど寒いな。'],['Good. It keeps my head clear.','好都合だ。頭が冴える。']],[['My hands are numb.','手がかじかむ。'],['Then I will finish quickly.','ならば早く終わらせよう。']]],\n  desert:[[['The sand burns my feet.','砂が足を焼く。'],['Then fight faster.','なら、早く決めろ。']],[['I am thirsty.','喉が渇いた。'],['Win first. Drink later.','勝ってから飲め。']]],   poison() { const h = actH(G); if (h.poison) return false; h.poison = 1; h.poisonT = 60; return true; },
  steal() { const foods = Object.keys(G.inv).filter(k => ITEM[k].food && G.inv[k] > 0); if (G.cash > 0 && (Math.random() < .5 || !foods.length)) { const c = Math.max(1, Math.round(G.cash * rnd(.08, .18))); G.cash -= c; return `$${c}を盗んだ！`; } if (foods.length) { const k = pick(foods); G.inv[k]--; return `${ITEM[k].n}を盗んだ！`; } return null; },
  result(r) { setTimeout(() => duelEnd(r), 0); },
};
function duelEnd(r) {
  const D = DUEL; if (!D) return; DUEL = null;
  if (DW.w) DW.w.className = 'idle';
  MODE = 'explore'; G.inBattle = null; QD.trans = 0; QD.grace = 2; QD.last = performance.now();
  const h = actH(G), M = G.map;
  h.hp = Math.max(0, Math.min(stats(h).mhp, r.hp)); if (r.poison) h.poison = h.poison || 1;
  // what was learnt stays (with its name and the kinds of weapon it belongs to)
  h.known = h.known || []; h.techs = h.techs || {}; for (const t of r.learned || []) { if (!h.known.includes(t.k)) h.known.push(t.k); h.techs[t.k] = { n: t.n, tags: t.tags }; }
  qdRearm();
  const mapMon = id => M.mons.find(m => m.id === id);
  if (r.out === 'win') {
    for (const f of D.foes) f.fled = !!(r.fled && r.fled[f.idx]); for (const f of D.foes) if (f.fled) f.hp = 0; else f.hp = 0;
    const res = battleWin({ G, F: G.floor, H: { st: stats(h) }, foes: D.foes, taken: Math.max(0, D.hp0 - h.hp) });
    for (const s of D.spec.list) if (s.id) { const m = mapMon(s.id); if (m) m.dead = true; if (m && m.boss) M.bossBeat = true; }
    const lines = res.L.map(l => typeof l === 'string' ? l : l.t).concat(res.loot);
    const me = res.cards.filter(c => !c.away), away = res.cards.filter(c => c.away);
    const cards = me.map(c => `<div class="lv"><b>${HEROES[c.who].n}はレベル${c.lv}に上がった！</b><div class="lvg">${Object.keys(STAT).map(k => `<span>${STAT[k]}</span>${c.g[k] > 0 ? `<b>+${c.g[k]}</b>` : '<span class="ng">上がりませんでした</span>'}`).join('')}</div></div>`).join('');
    const awayT = away.length ? `<p class="dim" style="font-size:.82rem">控えの${HEROES[away[0].who].n}もレベル${away[away.length - 1].lv}になった。</p>` : '';
    const learned = (r.learned || []).length ? `<div class="det"><b>💡 閃いた技</b><div class="techs" style="margin-top:4px">${r.learned.map(t => `<span class="tch">${esc(t.n)}</span>`).join('')}</div></div>` : '';
    MUS.stop(.25); sfx('win'); if (me.length) setTimeout(() => sfx('lvl'), 2300);
    const boss = D.foes.some(f => f.boss);
    ov(`<h2>${boss ? '🏆 ボスを倒した！' : '勝利！'}</h2><div>${lines.map(t => `<p>${esc(t)}</p>`).join('')}</div>${learned}${cards}${awayT}<div class="choices"><button class="pb pri" id="rOk">つぎへ</button></div>`, { mid: true });
    const freed = G.soul && G.soul.F === G.floor && D.spec.list.some(x => x.id != null && x.id === G.soul.guard);
    $('#rOk').onclick = () => { ovClose(); saveSus(); hud(); floorMusic(); if (freed) { msg(`👻 魂を守っていた魔物を倒した！`); freeSoul(); return; } if (boss && G.floor === 20) ending(); else if (boss) msg(`⬇ 地下${G.floor + 1}階への道が開いた。`); };
    $('#rOk').focus(); hud(); return;
  }
  // the rats beaten before it went wrong are gone; the rest step back
  for (const s of D.spec.list) if (s.id) { const m = mapMon(s.id); const i = D.spec.list.indexOf(s); if (m && (i < (r.cur || 0) || (r.fled && r.fled[i]))) m.dead = true; else if (m) { m.stun = 3; m.state = 'wander'; } }
  const ci = Math.min(r.cur || 0, D.spec.list.length - 1), cs = D.spec.list[ci], cf = D.foes[ci];
  let killer = cs && cs.id != null ? mapMon(cs.id) : null;
  if (r.out === 'flee') { floorMusic(); if (killer && killer.guard && r.foeHp != null) { killer.hpLeft = Math.max(1, r.foeHp); msg(`${cf.n}の残りHPは${killer.hpLeft}。`); } msg('うまく逃げ切った。'); saveSus(); hud(); return; }
  if (!killer && cf) { killer = { id: M.nid++, sp: cf.sp, rank: cf.rank, x: qdTi(QD.P.x), y: qdTi(QD.P.z), st: 'wander', stun: 0 }; M.mons.push(killer); }
  if (killer && cf) { killer.gMax = cf.mhp; killer.hpLeft = Math.max(1, r.foeHp != null ? r.foeHp : cf.mhp); killer.gName = cf.n; }
  heroDown('duel', killer);
}

/* ===================== the soul ===================== */
function heroDown(cause, killer) {
  const dead = G.act, o = other(dead), h = G.heroes[dead], P = QD.P;
  h.hp = 0; h.poison = 0; MUS.stop(.3); sfx('lose');
  if (G.soul || G.heroes[o].hp <= 0) { gameOver(); return; }
  G.soul = { who: dead, F: G.floor, wx: P.x, wz: P.z, x: qdTi(P.x), y: qdTi(P.z) };
  if (!killer) {   // fell to hunger or poison: a monster of the floor comes to sit by the soul
    const sp = rollSpecies(G.floor), rank = rollRank(G.floor), f = makeFoe(G.floor, sp, rank, 1, G.diff);
    killer = { id: G.map.nid++, sp, rank, x: G.soul.x, y: G.soul.y, st: 'wander', stun: 0, gMax: f.mhp, hpLeft: f.mhp, gName: f.n }; G.map.mons.push(killer);
  }
  killer.guard = 1; killer.fol = 0; killer.dead = false; killer.post = { x: P.x + .8, z: P.z }; G.soul.guard = killer.id; G.soul.gName = killer.gName || MON[killer.sp].n;
  for (const m of G.map.mons) if (!m.dead && Math.hypot(m.wx - P.x, m.wz - P.z) < 5) { m.stun = 3; m.state = 'wander'; }
  const oh = G.heroes[o]; oh.hp = stats(oh).mhp; oh.poison = 0;
  G.act = o; G.full = Math.max(G.full, 30); G.streak = 0;
  for (const m of G.map.mons) if (m.boss && !m.dead) { m.stun = 2; m.state = 'wander'; }
  ov(`<h2>${HEROES[dead].n}は倒れた…</h2><p>${cause === 'hunger' ? '飢えに力尽きた。' : cause === 'poison' ? '毒に力尽きた。' : '魔物に倒された。'}</p><p>その場に、青白い<b style="color:var(--soul)">魂</b>が残った。<b>${G.soul.gName}</b>が魂のそばに居座っている（残りHP ${killer.hpLeft}）。</p><p>知らせを受けた<b>${HEROES[o].n}</b>が、地下1階から助けに向かう！ 倒した魔物は全ての階に戻ってくる。 地下${G.floor}階の魂を守る${G.soul.gName}を倒せば、${HEROES[dead].n}が復活する。${HEROES[dead].n}が与えたダメージはそのまま残っている。</p><p class="dim" style="font-size:.8rem">${HEROES[o].n}まで倒れたら、冒険は終わり。</p><div class="choices"><button class="pb pri" id="sOk">${HEROES[o].n}で向かう</button></div>`, { mid: true });
  // the mine fills up again: every beaten monster on every floor is back (bosses and the lords stay beaten)
  let back = 0; for (const M2 of Object.values(G.floors || {})) for (const m of M2.mons) if (m.dead && !m.boss && !m.lord) { m.dead = false; m.dying = null; m.wx = null; m.wz = null; m.state = 'wander'; m.tgt = null; m.stun = 0; back++; }
  $('#sOk').onclick = () => { ovClose(); enterFloor(1, false, `地下1階。${HEROES[o].n}は坑道の入口から駆け下りていく。${HEROES[dead].n}の魂は地下${G.soul.F}階。${back ? `倒したはずの魔物たちが坑道に戻ってきている…（${back}匹）` : ''}`); };
}
function freeSoul() {
  const who = G.soul.who, me = G.act, h = G.heroes[who];
  h.hp = Math.max(1, Math.round(stats(h).mhp * .5)); G.soul = null; sfx('soul'); flash();
  ov(`<h2>魂を解放した！</h2><p>守りが解けた魂に${HEROES[me].n}が触れると、${HEROES[who].n}が光の中から起き上がった！（HP半分で復活）</p><p>どちらで進む？ もう一人は控えに回る。</p><div class="choices two"><button class="pb pri" id="fA">${HEROES[who].n}に戻す</button><button class="pb" id="fB">${HEROES[me].n}のまま</button></div>`, { mid: true });
  $('#fA').onclick = () => { G.act = who; qdHeroMesh(); ovClose(); hud(); saveSus(); msg(`${HEROES[who].n}が先頭に戻った。`); };
  $('#fB').onclick = () => { ovClose(); hud(); saveSus(); msg(`${HEROES[me].n}が先頭のまま進む。`); };
}
function gameOver() {
  G.over = true; LS.del(K_SUS); const rec = LS.get(K_REC, null);
  const o = ov(`<h2 style="color:var(--red)">全滅…</h2><p>ヤスもシュウも倒れ、地下${G.floor}階の闇に消えた。</p><p class="dim">倒した魔物 ${G.kills}匹</p><div class="choices">${rec ? `<button class="pb pri" id="gRec">記録から再開（地下${rec.G.floor}階）</button>` : ''}<button class="pb" id="gTitle">タイトルへ</button></div>`, { mid: true });
  if (rec) $('#gRec').onclick = () => { ovClose(); loadRecord(); };
  $('#gTitle').onclick = () => { ovClose(); titleScreen(); };
}
function ending() {
  MUS.stop(.3); sfx('win');
  G.over = true; LS.del(K_SUS); const clr = LS.get(K_CLR, {}); clr[G.diff] = 1; LS.set(K_CLR, clr);
  ov(`<h2>🏆 地の底の王を倒した！</h2><p>地の底の王が消えると、坑道の奥から冷たい風が吹き抜けた。鉄の街Birminghamの地下に、静けさが戻った。</p><p>${HEROES[G.main].n}と${HEROES[other(G.main)].n}は、ランタンの灯りを頼りに、長い長い階段を上っていった。</p>
  <dl class="kv"><dt>難易度</dt><dd>${DIFF[G.diff].n}</dd><dd></dd><dt>倒した魔物</dt><dd>${G.kills}匹</dd><dd></dd><dt>記録した回数</dt><dd>${G.saves}回</dd><dd></dd><dt>ヤス</dt><dd>Lv${G.heroes.yasu.lv}・技${(G.heroes.yasu.known || []).length}</dd><dd></dd><dt>シュウ</dt><dd>Lv${G.heroes.shu.lv}・技${(G.heroes.shu.known || []).length}</dd><dd></dd></dl>
  <div class="choices"><button class="pb pri" id="eT">タイトルへ</button></div>`, { mid: true });
  $('#eT').onclick = () => { ovClose(); titleScreen(); };
}

/* ===================== input ===================== */
function bindInput() {
  const cv = $('#gl'), I = QD.inp, stick = $('#stick');
  const live = () => MODE === 'explore' && !ovOpen() && !QD.trans;
  cv.addEventListener('pointerdown', ev => {
    if (!live()) return;
    if (I.id === null && ev.clientY > innerHeight * .45) { I.id = ev.pointerId; I.sx = ev.clientX; I.sy = ev.clientY; stick.style.left = ev.clientX + 'px'; stick.style.top = ev.clientY + 'px'; stick.classList.add('on'); }
    else I.cam = { id: ev.pointerId, x: ev.clientX, y: ev.clientY };
    try { cv.setPointerCapture(ev.pointerId); } catch (e) { }
  });
  cv.addEventListener('pointermove', ev => {
    if (!live()) return;
    if (ev.pointerId === I.id) { const dx = ev.clientX - I.sx, dy = ev.clientY - I.sy, L = Math.hypot(dx, dy), R = 72 / (PREF.stickS || 1), k = L > R ? R / L : 1, m = Math.min(1, L / R), dz = .1, c = m < dz ? 0 : Math.pow((m - dz) / (1 - dz), 1.3); I.jx = L ? dx / L * c : 0; I.jy = L ? dy / L * c : 0; stick.querySelector('i').style.transform = `translate(${dx * k}px,${dy * k}px)`; }
    else if (I.cam && ev.pointerId === I.cam.id) { QD.yaw -= (ev.clientX - I.cam.x) * .0055 * (PREF.camS || 1); if (QD.fpK > .5) QD.fpPitch = clamp((QD.fpPitch || 0) + (ev.clientY - I.cam.y) * .003 * (PREF.camS || 1), -.6, .75); else QD.pitch = clamp(QD.pitch + (ev.clientY - I.cam.y) * .003 * (PREF.camS || 1), .18, .95); I.cam.x = ev.clientX; I.cam.y = ev.clientY; QD.drag = QD.t; }
  });
  const up = ev => { if (ev.pointerId === I.id) { I.id = null; I.jx = I.jy = 0; stick.classList.remove('on'); stick.querySelector('i').style.transform = ''; } if (I.cam && ev.pointerId === I.cam.id) I.cam = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', ev => { if (!live()) return; ev.preventDefault(); QD.dist = clamp(QD.dist + Math.sign(ev.deltaY) * .4, 3, 7.5); }, { passive: false });
  addEventListener('keydown', e => {
    if (MODE !== 'explore') return;
    if (ovOpen()) { if (e.key === 'Escape') ovClose(); return; }
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); doAct(); return; }
    if (e.key === 'i' || e.key === 'I') { bagMenu(); return; }
    if (/^(Key[WASDQE]|Arrow|ShiftLeft)/.test(e.code)) { e.preventDefault(); QD.keys.add(e.code); }
  });
  addEventListener('keyup', e => QD.keys.delete(e.code));
  addEventListener('blur', () => QD.keys.clear());
  $('#act').onclick = doAct;
  $('#bBag').onclick = () => bagMenu();
  $('#bTac').onclick = () => tacticMenu();
  $('#bRest').onclick = () => restMenu();

  $('#bMenu').onclick = () => mainMenu();
  addEventListener('resize', () => E.resize());
}
/* what dungeon.js calls */
const UI = { paused: () => ovOpen() || MODE !== 'explore', msg, hud, minimap, act: setAct, heroDown, encounter, trap };

/* ===================== boot ===================== */
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - (QD.last || now)) / 1000); QD.last = now;
  if (MODE === 'explore' && QD.on) { qdFrame(dt); if (QD.P && QD.P.speed > .5 && !QD.hintOff) { QD.hintOff = 1; setTimeout(() => { const h = $('#hint'); if (h) h.hidden = true; }, 4000); } }
  else if (MODE === 'title' && renderer) { renderer.setClearColor(0x05070c, 1); renderer.clear(); }
  if (MODE === 'explore' && G && (QD.saveT = (QD.saveT || 0) - dt) <= 0) { QD.saveT = 10; saveSus(); }
}
function boot() {
  try { renderer = E.init($('#gl')); } catch (e) { $('#boot').textContent = '3D表示を起動できませんでした：' + (e && e.message || e); return; }
  $('#boot').remove();
  bindInput(); titleScreen(); requestAnimationFrame(loop); setTimeout(duelFrameInit, 400);
}
setTimeout(boot, 30);
MUS.enabled = PREF.snd; addEventListener('pointerdown', () => { if (PREF.snd) MUS.unlock(); }, { once: true, capture: true });

</script>
